# Publishes a GitHub release when a version tag (v1.0.0, ...) is pushed, with the notes
# in docs/releases/<tag>.md.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: gh release create "$GITHUB_REF_NAME" --title "Lage Landen $GITHUB_REF_NAME" --notes-file "docs/releases/$GITHUB_REF_NAME.md" --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
