id: unit-12
number: 12
title: Water, welfare and tolerance
era: 1932 to today
summary: In 1932 the Afsluitdijk closes off the Zuiderzee. After the war the Netherlands rebuilds, sends half a million emigrants abroad, Canada first, and builds a welfare state. In 1953 the sea breaks through in the southwest, and the Delta Works are the answer. In the 1960s the pillars crumble and Provo mocks authority. Suriname becomes independent in 1975, and the Antilles are split up in 2010. The country becomes known for tolerating soft drugs and for the first laws on euthanasia and same-sex marriage, and it has to face its share in the failure at Srebrenica.
note: >-
  The last lesson of this unit tells of the genocide at Srebrenica in July 1995, when more than 8,000 Bosniak men
  and boys were murdered after the fall of a town that Dutch UN soldiers were there to protect. It is told plainly,
  without celebrations.
lessons:
  - id: u12-l1
    title: A dam, a slump and a safety net
    icon: polder
    sources:
