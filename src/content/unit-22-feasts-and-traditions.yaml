  - id: u22-l6
    title: Keti Koti and the days of freedom
    icon: chain
    note: >-
      This lesson is about how slavery and the war dead are remembered in the Netherlands and Suriname. It is told
      plainly.
    sources:
      - title: "Wikipedia, Keti Koti"
        url: https://en.wikipedia.org/wiki/Keti_Koti
      - title: "Wikipedia (Dutch), Keti Koti"
        url: https://nl.wikipedia.org/wiki/Keti_Koti
      - title: "DutchNews, Breaking bread, breaking the chains: ritual meals open dialogue (June 2023)"
        url: https://dutchnews.nl/2023/06/breaking-bread-breaking-the-chains-ritual-meals-open-dialogue
      - title: "IamExpat, Dutch cities ask government to recognise abolition of slavery with national holiday"
        url: https://www.iamexpat.nl/expat-info/dutch-news/dutch-cities-ask-government-recognise-abolition-slavery-national-holiday
      - title: "Wikipedia (Dutch), Bevrijdingsvuur"
        url: https://nl.wikipedia.org/wiki/Bevrijdingsvuur
      - title: "Wikipedia, National Slavery Monument"
        url: https://en.wikipedia.org/wiki/National_Slavery_Monument
    exercises:
      - type: story
        title: The chain is cut
        body: >-
          Slavery in Suriname and the Dutch Caribbean was abolished on 1 July 1863 (Unit 7). Keti Koti, the day the
          chain was cut, has been a public holiday in Suriname since 1955. In Paramaribo people parade in their best
          clothes; in Amsterdam they gather at the monument in the Oosterpark and in many towns, to remember the
          enslaved and to celebrate freedom, with music, food and dance.
        visual: { kind: photo, photo: keti-koti-2018b }
      - type: when
        prompt: Women in koto, the Afro-Surinamese dress, dance in the Oosterpark to remember the end of slavery. Turn the wheel to the day.
        photo: keti-koti-2013
        answer: keti-koti
        days: 1
        explain: >-
          Keti Koti, 1 July, called the Day of Freedoms in Suriname. Many women wear the koto on this day to remember
          their ancestors.
      - type: choice
        prompt: People eat herheri on Keti Koti, a one-pot dish that recalls the food of the plantations. What is in it?
        visual: { kind: photo, photo: keti-koti-cake }
        answer: 0
        options:
          - label: Cassava, sweet potato, plantain, egg and salt cod
            why: >-
              Right. Filling roots and dried fish: a dish that goes back to the time of slavery. Eating it on Keti Koti
              is a way to remember the enslaved.
          - label: Rice, chicken and peanut sauce
            why: Herheri is a dish of roots and salt cod, cassava, sweet potato, plantain and egg.
          - label: Potatoes, kale and smoked sausage
            why: That is Dutch stamppot. Herheri is cassava, sweet potato, plantain, egg and salt cod.
          - label: Mussels and fries
            why: That is Belgian. Herheri is cassava, sweet potato, plantain, egg and salt cod.
      - type: choice
        prompt: Around Keti Koti, people sit at dialogue tables to talk about slavery and what it left behind. At the start they chew a piece of very bitter wood. Why?
        visual: { kind: photo, photo: keti-koti-stage }
        answer: 1
        options:
          - label: It is a cure for a sore throat
            why: The bitter wood stands for the bitter taste of the history of slavery.
          - label: For the bitter taste of the history of slavery
            why: >-
              Right. The Keti Koti Table was begun by Mercedes Zandwijken, inspired by the Jewish Passover meal. People of
              colour and white people sit facing each other, rub coconut oil into each other's wrists, and take turns to
              speak and listen, for exactly the same time.
          - label: To keep awake until midnight
            why: The bitter wood stands for the bitter taste of the history of slavery.
          - label: It was the plantation workers' only food
            why: The bitter wood stands for the bitter taste of the history of slavery.
      - type: truemyth
        statement: Keti Koti is a day off for everyone in the Netherlands.
        visual: { kind: photo, photo: slavery-monument }
        answer: false
        explain: >-
          Myth, so far. It is a public holiday in Suriname, and in the Netherlands a national day of remembrance, but
          not a day off. In 2021 an advisory group called for one, Amsterdam, Rotterdam, The Hague and Utrecht asked
          parliament for it, and some employers give their staff the day.
      - type: scrub
        prompt: Drag the slider to the years when slavery has been abolished, but there is no national monument to it yet in Amsterdam.
        map: feasts
        start: 1700
        answer: [1863, 2001]
        explain: >-
          Slavery was abolished on 1 July 1863. The National Slavery Monument in the Oosterpark was unveiled on 1 July
          2002, after years of calls by Surinamese and Antillean Dutch for a place to remember.
      - type: choice
        prompt: At midnight on Liberation Day a fire is lit in Wageningen, where the German surrender was agreed in 1945. What happens to it?
        visual: { kind: photo, photo: hotel-de-wereld }
        answer: 0
        options:
          - label: Runners carry it in relays to about 70 places across the country
            why: >-
              Right. Some 2,000 runners take the Liberation Fire to the towns where festivals open the day. It has been
              lit since 1948.
          - label: It burns in Wageningen for a year
            why: Runners carry it in relays to about 70 places across the country.
          - label: It lights the fireworks on the Dam
            why: Runners carry it in relays to about 70 places across the country.
          - label: It is carried by boat to London
            why: Runners carry it in relays to about 70 places across the country.
      - type: cause
        prompt: Link each cause to what it led to.
        pairs:
          - [Slavery is abolished on 1 July 1863, Suriname keeps 1 July as Keti Koti]
          - [Descendants of the enslaved ask for a place to remember, A national monument opens in the Oosterpark in 2002]
          - [The German army in the Netherlands surrenders in May 1945, A Liberation Fire is lit every 5 May]
          - [A Passover meal inspires Mercedes Zandwijken, People talk about slavery at Keti Koti Tables]
        explain: >-
          Feasts of freedom are also days of remembrance. The year from 1 July 2023 to 1 July 2024 was a memorial year
          for slavery: 160 years after abolition and 150 years after the end of forced work in 1873.
