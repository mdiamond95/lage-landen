    exercises:
      - type: story
        title: Orange fever
        body: >-
          On the king's birthday the Netherlands turns orange, the colour of the House of Orange. Canals fill with
          boats, streets with flea markets, music and orange cakes, and people call it oranjegekte, orange madness. It
          began in Utrecht on 31 August 1885, the fifth birthday of Princess Wilhelmina, as Princess's Day: the idea of
          a newspaper editor, J. W. R. Gerlach.
        visual: { kind: photo, photo: koningsdag-boats }
      - type: who
        photo: defile-1966
        clues:
          - I was born on 30 April 1909, the only child of a queen.
          - In the Second World War I lived in Ottawa with my daughters, and my third was born there.
          - From 1949, on my birthday, thousands of people filed past the steps of my palace at Soestdijk.
          - I gave up the throne to my eldest daughter in 1980.
        options: [Juliana, Wilhelmina, Beatrix, Emma]
        answer: 0
        explain: >-
          Queen Juliana. When she became queen in 1948, Queen's Day moved from her mother Wilhelmina's birthday, 31
          August, to hers. The march past at Soestdijk, the defilé, was shown on television for years.
      - type: scrub
        prompt: Drag the slider to the years when Queen's Day falls on 30 April.
        map: feasts
        start: 1900
        answer: [1949, 2013]
        explain: >-
          Juliana's birthday was 30 April, and from 1949 Queen's Day moved to it. Her daughter Beatrix, born on
          31 January, kept 30 April from 1980 to 2013, rather than hold the feast in winter.
      - type: hunt
        prompt: In Jan Steen's Prince's Day, an inn celebrates the birthday of the young William III. Find the prince himself.
        photo: steen-prinsjesdag
        targets:
          - [0.42, 0.03, 0.12, 0.21]
        explain: >-
          His portrait hangs on the wall above the box bed, and a crown hangs from the ceiling. A paper on the floor carries a toast to the "Nassau
          laddie, in one hand a rapier, and in the other a glass". William III was born on 14 November 1650.
      - type: choice
        prompt: On King's Day anyone may sell on the street, without a permit or tax. What is the street sale called?
        visual: { kind: photo, photo: vrijmarkt-1986 }
        answer: 0
        options:
          - label: The vrijmarkt, the free market
            why: >-
              Right. Children sell old toys and play music for coins, and the streets of Amsterdam are covered with
              blankets from the night before.
          - label: The braderie
            why: A braderie is a street market held by the shops. On King's Day it is the vrijmarkt, open to anyone.
          - label: The jaarmarkt
            why: A jaarmarkt is a town's yearly fair. On King's Day it is the vrijmarkt, open to anyone.
          - label: The kermis
            why: A kermis is a funfair. On King's Day the street sale is the vrijmarkt, open to anyone.
      - type: truemyth
        statement: Belgium's national day, 21 July, marks the start of the revolution of 1830.
        visual: { kind: photo, photo: defile-2016 }
        answer: false
        explain: >-
          Myth. On 21 July 1831 Leopold I swore the oath as the first King of the Belgians (Unit 9). Belgium first
          kept the days of the revolution in September; a law of 1890 moved the national day to 21 July. Brussels
          holds a military parade before the king.
      - type: when
        prompt: On this day a Te Deum is sung in the cathedral of Brussels and parliament honours the royal family, though most Belgians go to work. Turn the wheel to it.
        photo: royal-palace
