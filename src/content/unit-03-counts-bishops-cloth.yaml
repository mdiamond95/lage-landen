id: unit-03
number: 3
title: Counts, bishops and cloth cities
era: 900 to 1384
summary: Counts, dukes and prince-bishops carve up the Low Countries, towns win their freedoms, and English wool makes Flanders rich.
lessons:
  - id: u3-l1
    title: Counts and bishops
    icon: shield
    sources:
      - title: Encyclopaedia Britannica, History of the Low Countries, the territorial principalities and the rise of the towns
        url: https://www.britannica.com/topic/history-of-the-Low-Countries-prehistoric-times-to-1579-2157575/The-development-of-the-territorial-principalities-and-the-rise-of-the-towns-925-c-1350
      - title: Encyclopaedia Britannica, Imperial Flanders
        url: https://www.britannica.com/place/Imperial-Flanders
      - title: City of Ghent, Castle of the Counts, history and stories
        url: https://historischehuizen.stad.gent/en/castle-counts/history-and-stories
      - title: Encyclopaedia Britannica, Dirk III
        url: https://www.britannica.com/biography/Dirk-III
      - title: University of Liège, Notger and his time
        url: https://www.reflexions.uliege.be/cms/c_18697/en/notger-and-his-time
      - title: Encyclopaedia Britannica, Henry I, duke of Brabant
        url: https://www.britannica.com/biography/Henry-I-duke-of-Brabant
      - title: Online Etymology Dictionary, Holland
        url: https://www.etymonline.com/word/Holland
      - title: "Wikipedia, Gravensteen"
        url: https://en.wikipedia.org/wiki/Gravensteen
      - title: OpenStreetMap, street maps of the old town centres
        url: https://www.openstreetmap.org/
    exercises:
      - type: story
        title: A patchwork of lords
        body: >-
          After Charlemagne's empire broke up, the kings were far away and Vikings raided the rivers. Local lords
          took charge. By 1100 the Low Countries were a patchwork: counts in Flanders and Holland, a duke in
          Brabant, and bishops in Liège and Utrecht who ruled land like princes. The Scheldt split them: the count
          of Flanders held most of his land from the king of France, while the others answered to the German
          emperor.
        visual: { kind: map, highlight: [], rivers: [Schelde], pins: [ghent, liege, utrecht, leuven] }
      - type: region
        prompt: The counts of Flanders ruled the coast west of the Scheldt. Shade the two Belgian provinces that still carry the name Flanders.
        layer: provinces
        answer: [BE-VWV, BE-VOV]
        explain: >-
          West and East Flanders. The medieval county also reached into today's France, around Lille and Dunkirk,
          and into Zeeland, which is why the strip south of the Westerschelde is still called Zeelandic Flanders.
      - type: choice
        prompt: Count Philip of Alsace rebuilt this castle in Ghent as a stone fortress in 1180. What is it called?
        visual: { kind: photo, photo: gravensteen }
        answer: 0
        options:
          - label: The Gravensteen, the Castle of the Counts
            why: >-
              Right. An older castle stood on the spot; Philip's gate still carries the date 1180. Later it served as
              a court, a prison and even a cotton mill before Ghent restored it around 1900.
          - label: The Belfry of Ghent
            why: The belfry is a tall tower that belonged to the town, not a castle that belonged to the count.
          - label: The Steen of Antwerp
            why: The Steen is a castle in Antwerp, on the Scheldt, not in Ghent.
          - label: The Muiderslot
            why: The Muiderslot is a castle near Amsterdam, in the old county of Holland.
      - type: landmark
        prompt: The Gravensteen, the castle of the counts of Flanders, stands beside the water about 500 m north-west of the Belfry of Ghent. Find it on the map.
        city: ghent
        answer: gravensteen
        show: [belfry]
        options: [gravensteen, belfry, st-bavo, boekentoren]
        explain: >-
          The castle sits between two arms of the Leie, a short walk from the town's belfry. In medieval Ghent
          power was shared, often uneasily, between the count and the town.
      - type: truemyth
        statement: Baldwin "Iron Arm", the first count of Flanders, began his career by running off with a king's daughter.
        answer: true
        explain: >-
          Around 862 he eloped with Judith, daughter of the West Frankish king Charles the Bald. The furious king
          later forgave him and gave him land in Flanders, which his descendants turned into a county.
      - type: region
        prompt: Around 1100 the counts of the boggy coast north of the Maas began to call their land Holland. Shade the two provinces that carry the name today.
        layer: provinces
        answer: [NL-NH, NL-ZH]
        explain: >-
          North and South Holland. Earlier counts were called counts "in Frisia", and Holland first named only
          part of their land before it spread to the whole county.
      - type: truemyth
        statement: Holland means "hollow land", after its low, wet ground.
        visual: { kind: map, highlight: [NL-NH, NL-ZH], rivers: [], pins: [] }
        answer: false
        explain: >-
          Probably not. The name most likely comes from holt-land, "wood land". "Hollow land" is a popular guess
          that fits the low landscape, but language historians reject it.
      - type: pin
        prompt: In 1018 Count Dirk III beat an army sent by the emperor at his fort on the Maas, where he charged tolls on passing ships. Pin Vlaardingen.
        place: vlaardingen
        okKm: 25
        explain: Vlaardingen lies just west of Rotterdam. Winning the battle let the counts keep their tolls and grow rich on river trade.
      - type: pin
        prompt: In 985 the emperor gave Bishop Notger a county, making the bishops of this city worldly rulers too. Pin Liège.
        place: liege
        explain: >-
          Notger is often called the first prince-bishop of Liège. The principality lasted until 1795, when France
          annexed it. A later saying goes: "Liège owes Notger to Christ, and everything else to Notger."
      - type: region
        prompt: Henry I called himself duke of Brabant from about 1190. Shade the three provinces, in two countries, that still carry the name Brabant.
        layer: provinces
        answer: [NL-NB, BE-VBR, BE-WBR]
        explain: >-
          North Brabant in the Netherlands, and Flemish Brabant and Walloon Brabant in Belgium. The dukes ruled
          from Leuven and later Brussels.
      - type: match
        prompt: Match each land to its ruler.
        pairs:
          - [Flanders, A count who served the king of France]
          - [Holland, A count who served the emperor]
          - [Brabant, A duke]
          - [Liège, A prince-bishop]
      - type: order
        prompt: Put these in order, oldest first.
        items:
          - { label: Baldwin Iron Arm runs off with Judith, year: 862, when: about 862 }
          - { label: Bishop Notger gets the county of Huy, year: 985, when: '985' }
          - { label: Dirk III wins at Vlaardingen, year: 1018, when: '1018' }
          - { label: Philip of Alsace rebuilds the Gravensteen, year: 1180, when: '1180' }
          - { label: Henry I takes the title duke of Brabant, year: 1190, when: about 1190 }
        explain: It took three centuries for the counties, duchies and bishoprics to settle into shapes that would last until the Burgundians.

  - id: u3-l2
    title: Towns and their freedoms
    icon: bell
    sources:
      - title: UNESCO, Belfries of Belgium and France
        url: https://whc.unesco.org/en/list/943/
      - title: Visit Bruges, the Belfry
        url: https://www.visitbruges.be/en/things-to-do/culture-and-heritage/belfort-belfry
      - title: Focus on Belgium, Huy, the first free city in Western Europe
        url: https://focusonbelgium.be/en/facts/huy-first-free-city-western-europe
      - title: Amsterdam City Archives, the toll privilege of 1275
        url: https://www.amsterdam.nl/stadsarchief/stukken/handel/tolprivilege/
      - title: UNESCO, Flemish Béguinages
        url: https://whc.unesco.org/en/list/855/
    exercises:
      - type: story
        title: Towers of freedom
        body: >-
          Trade made towns rich, and rich towns bought or fought for rights from their lords: their own courts,
          councils and taxes. A town kept its charter of freedoms, its treasury and its great bell in a tall tower,
          the belfry, which also served as a lookout for fire and enemies. The belfry of Bruges, begun around 1240,
          stands 83 m tall.
        visual: { kind: photo, photo: bruges-belfry }
      - type: pin
        prompt: In 1066 the bishop of Liège gave this town on the Maas a charter of freedoms, often called the oldest north of the Alps. Pin Huy.
        place: huy
        okKm: 25
        explain: Huy lies on the Maas about 30 km upstream from Liège. Its citizens paid the bishop for their rights.
      - type: region
        prompt: UNESCO lists 56 belfries as world heritage. They stand in two countries. Tap both.
        layer: countries
        answer: [BEL, FRA]
        explain: >-
          Belgium has 33 and France 23, mostly in the old county of Flanders and its neighbours. Towns in the
          north of France were once Flemish too: Lille, Douai and Dunkirk.
      - type: choice
        prompt: The Cloth Hall of Ypres has a belfry rising from its middle. Which of these did a town keep in its belfry?
        visual: { kind: photo, photo: ypres-cloth-hall }
        answer: 1
        options:
          - label: The count's throne
            why: The count lived in his own castle. The belfry belonged to the citizens.
          - label: The town charter, the treasury and the bell
            why: >-
              Right. The bell called people to work, to meetings and to arms, and rang out alarms. Bruges's tower
              now holds a carillon of 47 bells.
          - label: The bishop's relics
            why: Relics were kept in churches. The belfry was the town's own, non-church tower.
          - label: Bales of wool for sale
            why: Wool and cloth were sold in the cloth hall, often built right beside the belfry.
      - type: choice
        prompt: Wipe between 1240 and 1382 on the map of buildings. What have the towns added in those years?
        visual: { kind: compare, map: buildings, years: [1240, 1382] }
        answer: 0
        options:
          - label: The Cloth Hall of Ypres, a belfry in Ghent and the Dom tower in Utrecht
            why: >-
              Right. In 1240 only Tournai and Bruges had begun their belfries. By 1382 Ypres had finished its cloth hall,
              125 metres long, Ghent had its belfry with a gilded dragon on top, and Utrecht's bishops their Dom tower.
          - label: Nothing; the towns were too poor to build
            why: Look at the new marks of 1382. The towns were rich from cloth.
          - label: Royal palaces for the king of Belgium
            why: Belgium did not exist yet. The new buildings belong to the towns and the church.
          - label: Canal houses in Amsterdam
            why: Amsterdam's canal ring came in the 1600s. Look at the towers and halls of Flanders.
      - type: pin
        prompt: In 1220 the count gave town rights to Dordrecht, usually called the oldest town of Holland. Pin it.
        place: dordrecht
        explain: Dordrecht grew rich from river trade where the Merwede and other rivers meet, about 20 km south-east of Rotterdam.
      - type: order
        prompt: Put these town rights in order, oldest first.
        items:
          - { label: Huy gets its charter, year: 1066, when: '1066' }
          - { label: "'s-Hertogenbosch gets town rights", year: 1185, when: about 1185 }
          - { label: Dordrecht gets town rights, year: 1220, when: '1220' }
          - { label: Amsterdam is first named in a toll privilege, year: 1275, when: '1275' }
          - { label: Amsterdam gets town rights, year: 1300, when: about 1300 }
        explain: The towns of the south were older and richer. Holland's towns, built on peat and clay, came later but grew fast.
      - type: gap
        prompt: >-
          Amsterdam is first named in a document of 27 October 1275. Count Floris V of Holland freed its people
          from paying tolls in his county. Fill the gap in how he described them.
        quote: homines manentes apud Amestelledamme, the people living near the Amstel ___
        source: Toll privilege of Floris V, given at Leiden, 1275, in Latin with an English rendering
        visual: { kind: map, highlight: [], rivers: [], pins: [amsterdam] }
        options: [dam, castle, church, bridge]
        answer: 0
        explain: >-
          The dam in the river Amstel gave the town its name: Amestelledamme, Amsterdam. The toll privilege is the
          oldest document naming the town, and it is kept in the Amsterdam City Archives.
      - type: choice
        prompt: Women called beguines lived in courts of small houses like this one, praying and working but taking no lifelong vows. What is such a place called?
        visual: { kind: photo, photo: beguinage }
        answer: 2
        options:
          - label: A monastery
            why: Nuns in a monastery took lifelong vows. Beguines could leave and marry.
          - label: A guildhall
            why: A guildhall was a meeting house for craftsmen or merchants.
          - label: A béguinage, or begijnhof
            why: >-
              Right. Béguinages spread through the Low Countries from the 1200s. UNESCO lists 13 in Flanders,
              among them Bruges, Leuven and Kortrijk.
          - label: An almshouse
            why: Almshouses housed the poor. Béguinages were run by the women themselves.
      - type: truemyth
        statement: The last beguine of the old tradition died in 2013.
        answer: true
        explain: Marcella Pattyn died in the béguinage of Kortrijk in April 2013, aged 92. The movement had lasted about 800 years.
      - type: pin
        prompt: The duke of Brabant founded a town in the north of his duchy around 1185. Its name means "the duke's wood". Pin 's-Hertogenbosch.
        place: den-bosch
        okKm: 25
        explain: Today it is the capital of North Brabant, also called Den Bosch.

  - id: u3-l3
    title: Wool and cloth
    icon: ship
    sources:
      - title: Encyclopaedia Britannica, Flanders
        url: https://www.britannica.com/place/Flanders
      - title: The Hanse, the Kontore
        url: https://hanse.org/en/the-medieval-hanseatic-league/die-kontore
      - title: Visit Gent, Ghent over the centuries
        url: https://visit.gent.be/en/good-know/practical-information/why-ghent/ghent-over-centuries
      - title: Encyclopaedia Britannica, Edward III and the Calais staple
        url: https://www.britannica.com/place/United-Kingdom/Edward-III-1327-77
      - title: British Library, the Luttrell Psalter
        url: https://www.bl.uk/collection-items/luttrell-psalter
    exercises:
      - type: story
        title: The wool road
        body: >-
          Flanders grew rich on cloth. Its towns wove more than their own sheep could supply, so they bought the
          best wool in Europe from England and sold fine, brightly dyed cloth across the continent. Press play to
          follow three centuries of trade around the North Sea.
        visual: { kind: time-map, map: cloth }
      - type: choice
        prompt: The sheep in this English book of psalms, made around 1330, grew the wool that Flemish weavers wanted most. Which way did the wool travel?
        visual: { kind: photo, photo: luttrell-sheep }
        answer: 0
        options:
          - label: From England to Flanders
            why: >-
              Right. Raw wool crossed the North Sea to Flanders, and finished cloth came back and went on to the
              rest of Europe.
          - label: From Flanders to England
            why: The other way round. England had the sheep; Flanders had the weavers.
          - label: From Italy to Flanders
            why: Italy sent spices, silk and alum, a chemical that fixed dyes, but not wool.
          - label: From the Baltic to Flanders
            why: The Baltic sent furs, wax, grain and timber.
      - type: choice
        prompt: Look at the map around 1250. Where did Flemish cloth go south to be sold to Italian merchants?
        visual: { kind: time-map, map: cloth, year: 1250 }
        answer: 1
        options:
          - label: Paris
            why: Paris was a big buyer, but the great meeting place for northern and Italian traders lay further east.
          - label: The fairs of Champagne, at Troyes and Provins
            why: >-
              Right. Fairs moved between four towns in Champagne through the year. Once Italian ships sailed
              straight to Bruges, from 1277, the fairs faded.
          - label: Cologne
            why: Cologne traded with Flanders along the land road, but Italian buyers met Flemings in Champagne.
          - label: London
            why: London sold wool to Flanders; Italian merchants did not buy Flemish cloth there.
      - type: scrub
        prompt: Drag the slider to a year when Italian ships sail all the way to Bruges.
        map: cloth
        answer: [1277, 1384]
        explain: >-
          Genoese ships first sailed round Spain to Bruges in 1277, and Venetian galleys followed in the 1310s.
          From then on Italians bought their cloth in Bruges, not in Champagne.
      - type: pin
        prompt: Pin Ypres, one of the three great cloth cities of Flanders.
        place: ypres
        okKm: 25
        explain: Ypres lies in West Flanders, near the French border. With Bruges and Ghent it was one of the "Three Members" that spoke for Flanders.
      - type: choice
        prompt: This hall in Ypres, about 125 m long, was finished in 1304. What was sold in it?
        visual: { kind: photo, photo: ypres-cloth-hall }
        answer: 2
        options:
          - label: Fish
            why: Fish was sold in a separate fish market. This hall was built for the town's main trade.
          - label: Grain
            why: Grain had its own market. This hall was for the product that made Ypres rich.
          - label: Cloth
            why: >-
              Right. The Cloth Hall was one of the largest commercial buildings of the Middle Ages. It burned
              down in 1914, in the First World War, and was rebuilt by 1967.
          - label: Wine
            why: Wine came in through Damme, near Bruges. Ypres made and sold cloth.
      - type: pin
        prompt: Around 1300 one Flemish city was the biggest north of the Alps after Paris, with perhaps 60,000 people. Pin Ghent.
        place: ghent
        explain: Ghent lies where the Leie meets the Scheldt. Thousands of its people worked in cloth, as weavers, fullers and dyers.
      - type: match
        prompt: Match each trade good to where it came from.
        pairs:
          - [Wool, England]
          - [Spices and silk, Italian galleys]
          - [Furs and wax, The Baltic]
          - [Wine, France and the Rhineland]
      - type: truemyth
        statement: When England stopped selling wool to Flanders in 1336, the Flemish weavers hardly noticed.
        visual: { kind: time-map, map: cloth, year: 1336 }
        answer: false
        explain: >-
          The looms fell silent and weavers went hungry. Within two years Ghent turned to Jacob van Artevelde, who
          struck a deal with Edward III to get the wool back.
      - type: order
        prompt: Put these in order, oldest first.
        items:
          - { label: The Hanse gets privileges in Flanders, year: 1252, when: '1252' }
          - { label: Genoese galleys first sail to Bruges, year: 1277, when: '1277' }
          - { label: Edward III bans wool exports to Flanders, year: 1336, when: '1336' }
          - { label: England takes Calais, year: 1347, when: '1347' }
          - { label: All English wool must go through Calais, year: 1363, when: '1363' }
        explain: The wool trade tied Flanders to England, even though the count owed loyalty to England's enemy, the king of France.
      - type: choice
        prompt: Look at the map in 1370. Where must Flemish buyers now fetch their English wool?
        visual: { kind: time-map, map: cloth, year: 1370 }
        answer: 2
        options:
          - label: Bruges
            why: Before 1363 wool came straight to Bruges. Now it stopped short, across the border.
          - label: Boston
            why: Boston was an English wool port, but foreign buyers were now sent to one market.
          - label: Calais
            why: >-
              Right. England captured Calais in 1347, and from 1363 all its exported wool had to be sold there, so
              the crown could tax it easily.
          - label: Cologne
            why: Cologne lies on the Rhine, far from the sheep of England.

  - id: u3-l4
    title: Bruges, market of the world
    icon: coin
    sources:
      - title: National Bank of Belgium Museum, the Ter Beurze house
        url: https://museum.nbb.be/en/node/242
      - title: UNESCO, Historic Centre of Brugge
        url: https://whc.unesco.org/en/list/996/
      - title: The Hanse, the Kontore
        url: https://hanse.org/en/the-medieval-hanseatic-league/die-kontore
      - title: Visit Bruges, the Belfry
        url: https://www.visitbruges.be/en/things-to-do/culture-and-heritage/belfort-belfry
      - title: "Wikipedia, Belfry of Bruges"
        url: https://en.wikipedia.org/wiki/Belfry_of_Bruges
      - title: OpenStreetMap, street maps of the old town centres
        url: https://www.openstreetmap.org/
    exercises:
      - type: story
        title: A port 15 km from the sea
        body: >-
          Bruges lies inland. In 1134 a storm flood tore open an inlet, the Zwin, and gave the town a waterway to
          the sea. Around 1180 the port of Damme was founded on it, and later Sluis. By 1300 ships from Genoa,
          Venice, Germany, England and Spain crowded the Zwin, and Bruges was the great market of northern Europe.
        visual: { kind: map, highlight: [BE-VWV], rivers: [], pins: [bruges, damme, sluis] }
      - type: pin
        prompt: Pin Damme, the outport of Bruges on the Zwin.
        place: damme
        fullKm: 6
        okKm: 15
        explain: Damme lies about 6 km north-east of Bruges, linked to it by a canal. Wine and herring were unloaded here.
      - type: scrub
        prompt: Drag the slider to a year when Hanseatic ships already sail to Bruges, but Flemish cloth still goes overland to the fairs of Champagne.
        map: cloth
        answer: [1252, 1320]
        explain: >-
          The German merchants of the Hanse won their rights in Bruges in 1252. The Champagne fairs faded in the
          early 1300s, once Italian ships could buy cloth in Bruges itself.
      - type: choice
        prompt: Merchants met on the square in front of this inn, run by the Van der Buerse family. Which word do we get from their name?
        visual: { kind: photo, photo: ter-beurze }
        answer: 0
        options:
          - label: Bourse, a stock exchange
            why: >-
              Right. People called the square "the Beurs", and the word spread: beurs in Dutch, bourse in French,
              Börse in German. The building you see dates from 1453.
          - label: Purse
            why: Purse is a cousin of the word, from the Latin bursa, a leather bag, but the stock exchange came from the Bruges family.
          - label: Bank
            why: Bank comes from the Italian banco, the bench where money changers sat.
          - label: Market
            why: Market comes from the Latin mercatus.
      - type: landmark
        prompt: Huis ter Beurze, the inn where the merchants of Bruges met, stands about 350 m north of the Belfry. Find it on the map.
        city: bruges
        answer: ter-beurze
        show: [belfry]
        options: [ter-beurze, belfry, our-lady, burg, beguinage]
        explain: >-
          The inn stands on a small square a few streets north of the Markt. The Venetians, the Genoese and the
          Florentines built their nation houses around it, and it became the money market of Bruges.
      - type: truemyth
        statement: Bruges declined partly because its waterway to the sea silted up.
        visual: { kind: map, highlight: [], rivers: [], pins: [bruges, sluis] }
        answer: true
        explain: >-
          The Zwin slowly filled with sand and silt from the late 1200s. By the late 1400s big ships could no
          longer reach Bruges, and trade moved to Antwerp, on the deep Scheldt.
      - type: choice
        prompt: The German merchants of the Hanse had four great trading offices abroad. Which city was NOT one of them?
        answer: 3
        options:
          - label: Bruges
            why: Bruges was one of the four, though the Hanse had no walled compound there, only a meeting house.
          - label: London
            why: London's Steelyard was one of the four.
          - label: Novgorod
            why: Novgorod, in Russia, was one of the four, the source of furs and wax.
          - label: Venice
            why: Right. Venice was not a Hanse office. The fourth was Bergen in Norway, the stockfish market.
      - type: region
        prompt: Bruges is the capital of a Belgian province. Shade it.
        layer: provinces
        answer: [BE-VWV]
        explain: West Flanders. Its coast is only about 67 km long, but in the Middle Ages its harbours faced half of Europe.
      - type: pin
        prompt: Pin Bruges.
        place: bruges
        explain: Bruges lies about 15 km from the coast. Its medieval centre is a UNESCO world heritage site.
      - type: choice
        prompt: Which building on the market square of Bruges is this?
        visual: { kind: photo, photo: bruges-belfry }
        answer: 1
        options:
          - label: The cathedral
            why: The cathedral of Bruges is a church a few streets away, not this tower on the market square.
          - label: The belfry, above the old market hall
            why: Right. Cloth was sold in the hall around the courtyard at its foot, and the tower held the town's charters and bells.
          - label: The count's castle
            why: The count of Flanders had a castle and court in Bruges, but this tower belonged to the town.
          - label: A lighthouse
            why: Bruges is inland. The tower was a lookout for fires, not ships.
      - type: truemyth
        statement: The belfry of Bruges once stood almost 20 metres taller than it does today.
        visual: { kind: then-now, pair: bruges }
        answer: true
        explain: >-
          True. The eight-sided top, added from 1483 to 1487, carried a wooden spire. Lightning burned it in 1493,
          and its replacement burned in 1741 and was never rebuilt, so the tower fell from 102 to 83 metres. Drag
          across: since the 1890s it has hardly changed.
      - type: cause
        prompt: Link each cause to its effect.
        pairs:
          - [A storm flood tears open the Zwin in 1134, Ships can sail from the sea to Bruges]
          - [Merchants meet by the Van der Buerse inn, Stock exchanges are called bourses]
          - [The Zwin fills up with sand and silt, Trade moves to Antwerp]
        explain: >-
          The sea made Bruges and the sea unmade it. When big ships could no longer reach the town in the late
          1400s, the merchants moved to Antwerp, on the deep Scheldt.

  - id: u3-l5
    title: The Golden Spurs
    icon: sword
    sources:
      - title: VRT NWS, The story of Flanders, "schild en vriend" (in Dutch)
        url: https://www.vrt.be/vrtnws/nl/2023/01/23/verhaal-van-vlaanderen-schild-en-vriend/
      - title: Visit Kortrijk, Church of Our Lady
        url: https://visitkortrijk.be/en/onze-lieve-vrouwekerk
      - title: VRT NWS, why 11 July is the Flemish holiday (in Dutch)
        url: https://www.vrt.be/vrtnws/nl/2023/07/10/waarom-wordt-op-11-juli-de-vlaamse-feestdag-gevierd/
      - title: New College, Oxford, the Courtrai Chest
        url: https://www.new.ox.ac.uk/node/216
      - title: Encyclopaedia Britannica, Guy, count of Flanders
        url: https://www.britannica.com/biography/Guy-count-of-Flanders
    exercises:
      - type: story
        title: Craftsmen against knights
        body: >-
          In 1300 the French king Philip IV locked up the count of Flanders and took over his county. The weavers
          and craftsmen of Bruges rose up. On 11 July 1302, outside Kortrijk, an army of Flemish townsmen on foot
          faced the knights of France, the best cavalry in Europe. Few expected the result.
        visual: { kind: photo, photo: golden-spurs-chronicle }
      - type: pin
        prompt: Pin Kortrijk, where the battle was fought.
        place: kortrijk
        okKm: 25
        explain: Kortrijk (Courtrai in French) lies on the Leie in West Flanders. The battle took place on the Groeninge field beside the town.
      - type: hunt
        prompt: In this French chronicle picture of the battle, the Flemings carry the banner of Flanders into the fight. Find it.
        photo: golden-spurs-chronicle
        targets: [[0.37, 0, 0.27, 0.35]]
        explain: >-
          A black lion on gold, the arms of the counts of Flanders. The lion is still the flag of Flanders today.
          The gold lilies on blue belong to the king of France and his knights.
      - type: choice
        prompt: The front of this chest, carved in the 1300s, shows the Flemish rising of 1302. Who won the battle at Kortrijk?
        visual: { kind: photo, photo: courtrai-chest }
        answer: 1
        options:
          - label: The French knights
            why: The knights charged across streams and ditches and were stopped by a wall of Flemish pikes and clubs.
          - label: The Flemish foot soldiers
            why: >-
              Right. Their commander killed, the French fled. Foot soldiers beating knights shocked Europe. The
              chest belongs to New College, Oxford.
          - label: The English army
            why: England was not in this battle. It was Flemings against the king of France.
          - label: Neither; it was a draw
            why: It was a clear Flemish victory, though the French won two years later at Mons-en-Pévèle.
      - type: truemyth
        statement: After the battle the Flemings hung hundreds of captured golden spurs in a church in Kortrijk.
        answer: true
        explain: >-
          Tradition says 500 spurs, taken from fallen knights, were hung in the Church of Our Lady. French troops
          took them back after beating the Flemings at Roosebeke in 1382. The battle is named after them.
      - type: choice
        prompt: This statue on the market square of Bruges, from 1887, honours the leaders of the 1302 rising. Pieter de Coninck was a weaver. Who stands beside him?
        visual: { kind: photo, photo: breydel-statue }
        answer: 0
        options:
          - label: Jan Breydel, a butcher
            why: >-
              Right, at least in legend. Breydel's leading role was only written up in the 1400s, and historians
              have found no proof for it. Pieter de Coninck's role is well recorded.
          - label: Count Guy of Dampierre
            why: Count Guy was a prisoner in France in 1302. He died in captivity in 1305.
          - label: Jacob van Artevelde
            why: Jacob van Artevelde led Ghent a generation later, from 1338. His statue stands in Ghent.
          - label: King Philip IV
            why: Philip IV was the French king the Flemings rose against. He has no statue in Bruges.
      - type: order
        prompt: Put these in order, oldest first.
        items:
          - { label: The count of Flanders is locked up in France, year: 1300, when: '1300' }
          - { label: The Bruges Matins, rebels kill French soldiers in Bruges, year: 1302, when: 18 May 1302 }
          - { label: The French win at Mons-en-Pévèle, year: 1304, when: '1304' }
          - { label: The Treaty of Athis forces Flanders to pay France, year: 1305, when: '1305' }
          - { label: Hendrik Conscience writes The Lion of Flanders, year: 1838, when: '1838' }
        explain: >-
          The victory of 1302 did not last: by 1305 Flanders had to pay France heavily. But 500 years later
          Conscience's novel made the battle a symbol for the Flemish Movement.
      - type: truemyth
        statement: 11 July, the day of the battle, is the official holiday of the Flemish Community.
        visual: { kind: map, highlight: [BE-VWV, BE-VOV, BE-VAN, BE-VLI, BE-VBR], rivers: [], pins: [kortrijk] }
        answer: true
        explain: It has been the official Flemish holiday since 1973. Wallonia has its own holiday in September, and Belgium's national day is 21 July.
      - type: truemyth
        statement: Historians agree that the rebels in Bruges killed anyone who could not pronounce "schild en vriend".
        answer: false
        explain: >-
          The chronicles say the rebels used the password "schild en vriend" (shield and friend). Whether it was
          really a test that French speakers would fail is still argued, and the gory scenes come from
          19th-century retellings.
      - type: match
        prompt: Match each person to their part in 1302.
        pairs:
          - [Philip IV, French king who seized Flanders]
          - [Guy of Dampierre, Count held prisoner in France]
          - [Pieter de Coninck, Weaver who led Bruges]
          - [Robert of Artois, French commander killed in battle]

