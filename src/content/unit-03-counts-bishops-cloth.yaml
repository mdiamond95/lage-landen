    exercises:
      - type: story
        title: A war over the Channel
        body: >-
          In 1337 England and France began the Hundred Years' War, and Flanders was caught in the middle: its count
          sided with France, its weavers needed English wool. On 24 June 1340, in the Zwin off Sluis, the English
          fleet destroyed the French one, as this chronicle shows.
        visual: { kind: photo, photo: sluys-battle }
      - type: who
        photo: artevelde-statue
        clues:
          - I was a rich cloth merchant in Ghent, and in 1338 the city put me in charge.
          - When England's wool ban starved our weavers, I made a deal with King Edward III.
          - In 1340 Edward III was proclaimed king of France on the Friday Market in Ghent, where my statue stands.
          - I was killed in a riot in 1345. My son Philip later led Ghent too.
        options: [Jacob van Artevelde, Pieter de Coninck, Floris V, Philip the Bold]
        answer: 0
        explain: >-
          Jacob van Artevelde, nicknamed "the wise man of Ghent", kept the looms working by keeping Flanders on
          good terms with England. His statue went up on the Vrijdagmarkt in 1863.
      - type: pin
        prompt: Pin Sluis, where the English fleet won in 1340.
        place: sluis
        okKm: 20
        explain: Sluis lies on the Dutch side of the border, north of Bruges. The Zwin inlet has since silted up, leaving the town inland.
      - type: choice
        prompt: This picture from a Tournai chronicle of 1349 shows townspeople doing what?
        visual: { kind: photo, photo: plague-tournai }
        answer: 2
        options:
          - label: Building the town walls
            why: The boxes are coffins, not building stones.
          - label: Carrying goods to market
            why: They are carrying the dead, not goods.
          - label: Burying victims of the Black Death
            why: >-
              Right. The plague reached Tournai and Flanders in 1349. Across Europe it killed perhaps a third of
              the people in a few years.
          - label: Celebrating a saint's day
            why: The scene is a burial, painted by Pierart dou Tielt for the abbot Gilles li Muisis.
      - type: choice
        prompt: Count Floris V of Holland built this hall in The Hague around 1295. What does it stand beside today?
        visual: { kind: photo, photo: ridderzaal }
        answer: 0
        options:
          - label: The Dutch parliament
            why: >-
              Right. The Ridderzaal (Hall of Knights) is at the heart of the Binnenhof, where the parliament meets.
              Traditionally the king reads the Speech from the Throne here on Prinsjesdag; during the current
              renovation it is held nearby.
          - label: The royal palace in Amsterdam
            why: The palace on Dam Square in Amsterdam was built as a town hall in the 1600s.
          - label: Utrecht cathedral
            why: Utrecht cathedral was the bishop's church. The counts of Holland lived in The Hague.
          - label: A cloth hall
            why: Holland's cloth halls came later, in Leiden. This was the count's own hall.
      - type: truemyth
        statement: Floris V of Holland was murdered by his own nobles in 1296.
        visual: { kind: map, highlight: [], rivers: [], pins: [muiden] }
        answer: true
        explain: >-
          Nobles kidnapped him and took him to Muiden castle. When peasants tried to rescue him, Gerard van Velsen
          stabbed him to death. Tradition calls Floris "der keerlen god", the god of the common people.
      - type: truemyth
        statement: The duchy of Limburg, won by the duke of Brabant at Worringen in 1288, lay in today's two Limburg provinces.
        visual: { kind: map, highlight: [NL-LI, BE-VLI], rivers: [Maas], pins: [limbourg] }
        answer: false
        explain: >-
          The medieval duchy lay mostly around the small town of Limbourg, east of Liège, with only a sliver in
          today's Limburgs. The province created in 1815 borrowed the old name; in 1839 it was split between the
          Netherlands and Belgium.
      - type: choice
        prompt: Building began in 1321 and ended in 1382. At 112 m it is still the tallest church tower in the Netherlands. Where is it?
        visual: { kind: photo, photo: utrecht-dom }
        answer: 1
        options:
          - label: Amsterdam
            why: Amsterdam's churches are much lower. This tower belonged to a bishop's cathedral.
          - label: Utrecht
            why: Right. The Dom tower stood beside the cathedral of the bishops of Utrecht. A storm in 1674 brought down the nave, leaving the tower alone.
          - label: Bruges
            why: Bruges's belfry is 83 m and belongs to the town, not a cathedral.
          - label: Ghent
            why: Ghent's belfry and cathedral are both lower than 112 m.
      - type: order
        prompt: Put these in order, oldest first.
        items:
          - { label: Brabant wins at Worringen, year: 1288, when: '1288' }
          - { label: Floris V is murdered, year: 1296, when: '1296' }
          - { label: The English win at Sluys, year: 1340, when: '1340' }
          - { label: The Black Death reaches Flanders, year: 1349, when: '1349' }
          - { label: Brabant's Joyous Entry charter, year: 1356, when: '1356' }
          - { label: Flanders passes to Burgundy, year: 1384, when: '1384' }
        explain: The 1300s were years of war, revolt and plague, and they ended with Flanders in the hands of a new dynasty.
      - type: choice
        prompt: In 1384 Count Louis of Male died. His daughter Margaret had married a French prince, so Flanders went to him. Who was he?
        visual: { kind: time-map, map: cloth, year: 1384 }
        answer: 0
        options:
          - label: Philip the Bold, duke of Burgundy
            why: >-
              Right. Over the next 50 years his family gathered most of the Low Countries under one ruler. That is
              the story of the next unit.
          - label: Edward III of England
            why: Edward III wanted Margaret to marry his son, but the French king won her for his own brother, Philip.
          - label: Jacob van Artevelde
            why: Artevelde was a Ghent citizen, not a prince, and he had died in 1345.
          - label: The duke of Brabant
            why: Brabant passed to Burgundy too, but later, in the 1400s.
      - type: sort
        prompt: Whose land was it in the 1300s? Sort these buildings by the lord who ruled where they stand.
        groups: [County of Flanders, County of Holland, Bishop of Utrecht]
        items:
          - { label: The Gravensteen in Ghent, group: 0, photo: gravensteen }
          - { label: The belfry of Bruges, group: 0, photo: bruges-belfry }
          - { label: The Cloth Hall of Ypres, group: 0, photo: ypres-cloth-hall }
          - { label: The Ridderzaal in The Hague, group: 1, photo: ridderzaal }
          - { label: The Dom tower in Utrecht, group: 2, photo: utrecht-dom }
        explain: >-
          Ghent, Bruges and Ypres were the three great cloth towns of Flanders. The counts of Holland built the
