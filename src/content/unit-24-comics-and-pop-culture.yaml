    exercises:
      - type: story
        title: Small countries, big screens
        body: >-
          The Low Countries make small films for small markets, in Dutch and French, and their stars often leave. Yet
          they have won Oscars and Palmes d'Or, made the most famous reality show on earth, and given Hollywood an
          actress born in Brussels and a director from Amsterdam.
        visual: { kind: photo, photo: tuschinski-1973 }
      - type: who
        photo: hepburn-1954
        clues:
          - I was born in Ixelles, in Brussels, in 1929, to a Dutch mother.
          - I spent the war in Arnhem and Velp, studying ballet, and in the Hunger Winter we ate flour made from tulip bulbs.
          - I won an Oscar for my first big film, as a princess on the run in Rome.
        options: [Audrey Hepburn, Chantal Akerman, Monique van de Ven, Sandra Kim]
        answer: 0
        explain: >-
          Audrey Hepburn, who won the Oscar for Roman Holiday in 1954 and starred in Breakfast at Tiffany's. Later she
          worked for UNICEF, remembering the help that came to the Netherlands in 1945.
      - type: truemyth
        statement: Audrey Hepburn is known for certain to have carried messages for the Dutch resistance.
        visual: { kind: photo, photo: hepburn-gerzon }
        answer: false
        explain: >-
          Not known for certain. She danced in secret performances that raised money for the resistance, and a book
          of 2019 says she carried messages too, but in 2016 the Airborne Museum in Oosterbeek found no evidence of it.
          The war years are well documented; her part in the resistance is not.
      - type: panels
        prompt: Put these moments of Dutch film at the Oscars in order, the first first.
        order: true
        panels:
          - { photo: haanstra-oscar, kind: caption, say: "Haanstra wins with a film about glass" }
          - { photo: aanslag-shoot, kind: caption, say: "Rademakers films De Aanslag in Haarlem" }
          - { photo: gorris-1982, kind: caption, say: "Gorris, the first woman to win it" }
        explain: >-
          Haanstra's short documentary Glas won in 1960, and Marleen Gorris was the first woman to win the Oscar for a
          foreign-language film. Fons Rademakers's De Aanslag, from Harry Mulisch's novel of a
          wartime killing in Haarlem, was the first Dutch feature to win, in 1987. Marleen Gorris's Antonia followed in
          1996 and Mike van Diem's Karakter in 1998.
      - type: choice
        prompt: Crowds queue outside the Tuschinski cinema in Amsterdam in 1973. Paul Verhoeven's Turks Fruit, with Rutger Hauer and Monique van de Ven, was on. How did it do?
        visual: { kind: photo, photo: hauer-van-de-ven }
        answer: 1
        options:
          - label: It was banned in the Netherlands
            why: It was seen by more than 3 million people, the biggest Dutch film ever.
          - label: More than 3 million saw it, more than any other Dutch film
            why: >-
              Right. Out of 13 million Dutch people, more than 3 million went, and in 1999 it was voted the best Dutch film
              of the century. It was also nominated for an Oscar. Verhoeven went on to make Soldaat van Oranje, then
              RoboCop and Basic Instinct in Hollywood.
          - label: It flopped, and was rediscovered on television
            why: It was seen by more than 3 million people, the biggest Dutch film ever.
          - label: It was shown only at festivals abroad
            why: It was seen by more than 3 million people, the biggest Dutch film ever.
      - type: truemyth
        statement: The Dardenne brothers' film Rosetta, about a girl who desperately wants a job, made Belgium pass a new law on jobs for young people.
        visual: { kind: photo, photo: dardennes }
        answer: false
        explain: >-
          Mostly a myth, though it is often told. Rosetta, filmed in Seraing, won the Palme d'Or at Cannes in 1999, and a
          plan to get young people into work was soon called the Rosetta plan. But Jean-Pierre Dardenne said the law
          already existed and had only not yet been voted through.
      - type: cause
        prompt: Link each cause to what it led to.
        pairs:
          - [John de Mol puts strangers in a house full of cameras in 1999, Big Brother is sold to dozens of countries]
          - [Fons Rademakers films Mulisch's novel of the war, The Netherlands wins its first Oscar for a feature film]
          - [Turks Fruit makes stars of Rutger Hauer and Paul Verhoeven, Both go on to work in Hollywood]
          - [Hepburn lived through the Hunger Winter as a girl, She works for UNICEF in her later years]
        explain: >-
          Big Brother went on air on 16 September 1999, and its format has since been made in dozens of countries.
          Hauer played in Blade Runner in 1982, and Verhoeven made RoboCop in 1987.
      - type: choice
        prompt: In 2022 film critics voted a Belgian film the greatest film ever made, in the poll of the magazine Sight and Sound. Which?
        visual: { kind: photo, photo: akerman }
        answer: 2
        options:
          - label: Rosetta, by the Dardenne brothers
            why: It was Chantal Akerman's Jeanne Dielman, 23 quai du Commerce, 1080 Bruxelles, of 1975.
          - label: Le Huitième Jour, by Jaco Van Dormael
            why: It was Chantal Akerman's Jeanne Dielman, 23 quai du Commerce, 1080 Bruxelles, of 1975.
          - label: Jeanne Dielman, by Chantal Akerman
            why: >-
              Right. Akerman, from Brussels, made it at 25: three days in the life of a widow in her flat, filmed almost in
              real time. It was the first film by a woman to top the poll, held every ten years since 1952.
          - label: Man Bites Dog, by Rémy Belvaux
            why: It was Chantal Akerman's Jeanne Dielman, 23 quai du Commerce, 1080 Bruxelles, of 1975.
      - type: scrub
        prompt: Drag the slider to the years when The Assault has won its Oscar, but Big Brother is not yet on air.
        map: pop
        start: 1950
        answer: [1987, 1998]
        explain: De Aanslag won in 1987, and Big Brother went on air in Almere in 1999.
