    exercises:
      - type: story
        title: An instrument from Dinant
        body: >-
          Adolphe Sax was born in Dinant on the Meuse in 1814, the son of an instrument maker. In Paris, in 1846, he
          patented a brass instrument played with a reed like a clarinet, and named it after himself. Armies and brass
          bands took it up first. Jazz made it famous, a century later, far from Belgium.
        visual: { kind: sound, sound: sax-jazz, photo: sax-alto }
      - type: truemyth
        statement: The saxophone was invented in New Orleans, for jazz.
        visual: { kind: photo, photo: sax-dinant }
        answer: false
        explain: >-
          Myth. Adolphe Sax patented it in Paris on 28 June 1846, decades before jazz was born. He made it in sizes from
          the tiny sopranino to the huge subcontrabass, and died poor in Paris in 1894. In Dinant, the bridge over the
          Meuse is lined with giant saxophones in the colours of many countries.
      - type: who
        photo: django
        clues:
          - I was born in a caravan in Liberchies, in Belgium, in 1910, into a family of travelling Manouche.
          - At 18 I was badly burned in a fire, and played the guitar for the rest of my life with two fingers of my left hand.
          - In Paris in 1934, with the violinist Stéphane Grappelli, I founded the Quintette du Hot Club de France.
        options: [Django Reinhardt, Toots Thielemans, Jacques Brel, Adolphe Sax]
        answer: 0
        explain: >-
          Django Reinhardt, the first great European jazz musician, photographed in New York in 1946. His gypsy jazz is
          still played at festivals all over the world.
      - type: choice
        prompt: Toots Thielemans, born in Brussels in 1922, played on the soundtrack of Midnight Cowboy and the closing theme of Sesame Street. On what?
        visual: { kind: photo, photo: toots-1961 }
        answer: 3
        options:
          - label: The saxophone
            why: He played the chromatic harmonica, and the guitar, and whistled.
          - label: The accordion
            why: He played the chromatic harmonica, and the guitar, and whistled.
          - label: The trumpet
            why: He played the chromatic harmonica, and the guitar, and whistled.
          - label: The harmonica
            why: >-
              Right, the chromatic harmonica, which he made a jazz instrument. His tune Bluesette of 1962, played on
              guitar and whistled, went round the world. King Albert II made him a baron in 2001, and he died in 2016.
      - type: gap
        prompt: In 1962 Jacques Brel, from Brussels, sang of Belgium as a flat land under a low sky. Pick the missing word in its opening line.
        quote: "Avec la mer du ___ pour dernier terrain vague"
        source: Jacques Brel, Le plat pays, 1962
        visual: { kind: photo, photo: brel-1962 }
        options: [Nord, Sud, Rhin, Ciel]
        answer: 0
        explain: >-
          Nord: with the North Sea for a last waste ground. Brel sang in French, but he also recorded it in Dutch as
          Mijn vlakke land. He moved to France, then to the Marquesas Islands in the Pacific, and is buried there.
      - type: panels
        prompt: The Netherlands has won the Eurovision Song Contest five times. Put each winning song's title with its singers. One title is Belgium's.
        panels:
          - { photo: corry-brokken, say: "Net als toen" }
          - { photo: teddy-scholten, say: "Een beetje" }
          - { photo: teach-in, say: "Ding-a-dong" }
          - { photo: laurence-2019, say: "Arcade" }
        extra: ["J'aime la vie"]
        explain: >-
          Corry Brokken won in 1957, Teddy Scholten in 1959, Lenny Kuhr in 1969, in a tie of four, and Teach-In in 1975.
          Duncan Laurence won with Arcade in 2019. Belgium's one win, J'aime la vie, was sung by Sandra Kim in
          1986, when she was 13.
      - type: sort
        prompt: Sort these musicians by the country they come from.
        groups: [Netherlands, Belgium]
        items:
