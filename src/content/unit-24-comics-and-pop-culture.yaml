          - { label: Lenny Kuhr, group: 0, photo: lenny-kuhr }
          - { label: Django Reinhardt, group: 1, photo: django }
          - { label: Jacques Brel, group: 1, photo: brel-1962 }
          - { label: Stromae, group: 1, photo: stromae }
        explain: >-
          Golden Earring from The Hague had Radar Love in 1973, Shocking Blue a number one in America with Venus in 1970,
          Lenny Kuhr won Eurovision in this dress in 1969, and Tiësto played at the opening of the Athens Olympics in 2004. Django was born in Belgium, Brel in Brussels,
          and Stromae, also from Brussels, sang Alors on danse in 2009.
      - type: pin
        prompt: Since 2005 one of the biggest dance festivals in the world has been held in a Flemish town between Antwerp and Brussels. Pin it.
        place: boom
        explain: >-
          Boom, where Tomorrowland has been held since 2005 in the park of De Schorre. About 10,000 came the first year;
          now it is some 400,000 over two weekends.
