    exercises:
      - type: story
        title: The Games come to Antwerp
        body: >-
          In 1920, two years after the war, Antwerp held the Olympic Games, from 14 August to 12 September. Germany and
          its wartime allies were not invited. For the first time the flag with five rings flew, doves were let go for
          peace, and an athlete swore an oath for all the others.
        visual: { kind: photo, photo: poster-1920 }
      - type: gap
        prompt: The oath was sworn by Victor Boin, a Belgian swimmer, water polo player and fencer, on behalf of all the athletes. Fill the gap.
        quote: We swear. We will take part in the Olympic Games in a spirit of chivalry, for the honour of our country and for the ___ of sport.
        source: The Olympic oath, sworn by Victor Boin at Antwerp, 1920
        visual: { kind: photo, photo: victor-boin }
        options: [glory, love, future, money]
        answer: 0
        explain: >-
          The glory of sport. In 1961 "swear" became "promise", and "our country" became "our teams", to take out the
          nationalism; since 2000 athletes also promise to compete without doping.
      - type: choice
        prompt: Belgium won the football gold in 1920, but the final against Czechoslovakia never finished. Why?
        visual: { kind: photo, photo: belgium-1920 }
        answer: 0
        options:
          - label: The Czechoslovaks walked off at 2–0, angry with the English referee
            why: >-
              Right. After 39 minutes, with Belgium 2–0 up and one of their players sent off, Czechoslovakia left the
              pitch. They were thrown out of the tournament, Belgium got the gold, and Spain beat the Netherlands for
              silver.
          - label: A storm flooded the pitch
            why: The weather held. Czechoslovakia walked off in protest at the referee, at 2–0 down.
          - label: The crowd broke onto the pitch
            why: The crowd stayed put. The Czechoslovak team walked off, at 2–0 down.
          - label: The ball burst and there was no other
            why: Czechoslovakia walked off, angry at the English referee and linesmen.
      - type: choice
        prompt: Beside Amsterdam's Olympic Stadium of 1928 stands this tower. What burned in the bowl at its top, for the first time at any Games?
        visual: { kind: photo, photo: marathon-tower }
        answer: 1
        options:
          - label: A beacon to guide the airships
            why: It held a fire for the Games themselves, the first Olympic flame.
          - label: The Olympic flame
            why: >-
              Right. A fire burned in the Marathon Tower all through the Games of 1928. Locals called its bowl the ashtray
              of the KLM pilots. The torch relay from Greece came later, in 1936.
          - label: Fireworks for the closing night
            why: It held the first Olympic flame, burning all through the Games.
          - label: A lighthouse lamp for the IJ
            why: It held the first Olympic flame, burning all through the Games.
      - type: truemyth
        statement: The Olympic Stadium of Amsterdam itself won an Olympic gold medal.
        visual: { kind: photo, photo: stadium-1928 }
        answer: true
        explain: >-
          True. Until 1948 the Games also gave medals for art, and Jan Wils's stadium, in the brick of the Amsterdam
          School, won the gold for architecture in 1928. In 1987 the city planned to pull it down; it was saved as a
          national monument.
      - type: hunt
        prompt: The stadium from the air, full for the Games of 1928. Find the tower where the first Olympic flame burned.
        photo: stadium-1928
        targets: [[0.08, 0.36, 0.085, 0.32]]
        explain: >-
          On the left, on the long side by the main gate: the Marathon Tower, a tall brick column with its bowl on top.
      - type: who
        photo: blankers-koen
        clues:
          - I was born in Lage Vuursche in 1918, and at the Berlin Games of 1936 I got Jesse Owens's autograph.
          - In London in 1948 I was 30 and the mother of two, and the papers said I was too old.
          - I won the 100 m, the 200 m, the 80 m hurdles and the relay there, the first woman with four golds at one Games.
        options: [Fanny Blankers-Koen, Foekje Dillema, Ireen Wüst, Marianne Vos]
        answer: 0
        explain: >-
          Fanny Blankers-Koen, the Flying Housewife, coached by her husband Jan, seen with her here. She could have won
          more: athletes could enter only three individual events. In 1999 she was named the female athlete of the
          century.
      - type: choice
        prompt: Amsterdam welcomed her home with a carriage behind four white horses, and the city gave her a present, "so she need not run so much". What was it?
        visual: { kind: photo, photo: blankers-home }
        answer: 2
        options:
          - label: A car
            why: It was a bicycle, the most Dutch of presents.
          - label: A house in the Vondelpark
            why: It was a bicycle, "to go through life at a slower pace".
          - label: A bicycle
            why: Right. A new bicycle, "to go through life at a slower pace".
          - label: A horse
