      - type: choice
        prompt: Korfball, played here at the Games of 1928, was invented in Amsterdam in 1902 by a teacher, Nico Broekhuysen. What makes it unlike other ball games?
        visual: { kind: photo, photo: korfball-1928 }
        answer: 0
        options:
          - label: Each team has four men and four women, playing together
            why: >-
              Right. Broekhuysen took the idea from a Swedish game, ringboll, and used a basket on a pole 3.5 m high. Each
              player guards an opponent of the same sex. It was shown at the Games of 1920 and 1928.
          - label: It is played on ice
            why: It is played on a field or in a hall, by teams of four men and four women.
          - label: The ball may not touch the ground
            why: What sets it apart is the teams, four men and four women together.
          - label: There is no goal
            why: There is a goal, a basket on a pole. The teams are four men and four women.
      - type: story
        title: Heysel, 29 May 1985
        body: >-
          Before the European Cup final between Juventus and Liverpool at the Heysel stadium in Brussels, Liverpool
          fans charged at Juventus fans in a section meant for neutrals. People fleeing were crushed against an old
