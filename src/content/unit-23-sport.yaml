      - type: story
        title: Everyone on the ice
        body: >-
          In the hard winters of the Little Ice Age the whole of Holland went out on the ice, rich and poor, to work and
          to play. Tour Avercamp's winter of about 1608, and zoom in on the games.
        visual: { kind: painting, painting: avercamp-ice }
      - type: hunt
        prompt: Hendrick Avercamp painted these kolf players on the ice around 1625. Find what the man in the tall hat is about to hit.
        photo: avercamp-kolf
        targets: [[0.65, 0.83, 0.06, 0.07]]
        explain: >-
          The ball, at the end of his club. Kolf players drove the ball across the ice, or along a court, towards a
          post.
      - type: truemyth
        statement: Golf grew out of kolf, the Dutch game played on the ice.
        visual: { kind: photo, photo: avercamp-kolf }
        answer: false
        explain: >-
          Unproven, so treat it as a myth. Kolf and golf are both games of hitting a ball with a club, and Scottish
          merchants traded with the Low Countries, so many believe they are linked. But kolf aims at a post, not a hole,
          and no document shows one game turning into the other.
      - type: story
        title: The Tour of the Eleven Towns
        body: >-
          The Elfstedentocht is about 200 km on natural ice, past the eleven towns of Friesland. It can only be skated
          when the ice is at least 15 cm thick all the way, so it has been held only 15 times since 1909. Step along
          the route.
        visual: { kind: route, route: elfsteden }
      - type: ride
        prompt: From Stavoren, the far southwest, the skaters turn north. Tap the next three towns, in order.
        route: elfsteden
        show: [stavoren]
        ask: [hindeloopen, workum, bolsward]
        explain: >-
          Hindeloopen, Workum and Bolsward, then on to Harlingen on the Wadden Sea. Skaters collect a stamp in each town,
          and at secret checkpoints, and must finish before midnight.
      - type: ride
        prompt: After Franeker the skaters head for the last town, in the far northeast, and back. Tap it.
        route: elfsteden
        show: [franeker]
        ask: [dokkum]
        explain: >-
          Dokkum. On the way there and back the skaters pass Bartlehiem twice, a hamlet with a bridge where the crowds
          gather.
      - type: choice
        prompt: The first Elfstedentocht, 2 January 1909. Only 23 of 48 who signed up came to the start, after a thaw. How long did the winner, Minne Hoekstra, take?
        visual: { kind: photo, photo: elfsteden-1909 }
        answer: 2
        options:
          - label: About 6 hours
            why: Even the winners of 1985 and 1997, on better skates, needed nearly 7 hours. In 1909 it took 13 hours 50 minutes.
          - label: Two days
            why: He finished the same day, in 13 hours 50 minutes.
          - label: 13 hours 50 minutes
            why: >-
              Right. Hoekstra, from Warga, beat the next man by three minutes. The idea of the tour came from Pim Mulier,
              a Frisian who brought football and other English sports to the Netherlands.
          - label: 30 minutes
            why: That would be 400 km an hour. He took 13 hours 50 minutes.
      - type: choice
        prompt: The twelfth Elfstedentocht, in 1963, is remembered as the hell of '63. It was −18 °C, with drifting snow and an east wind. Of 10,000 skaters, how many finished?
        visual: { kind: photo, photo: paping }
        answer: 0
        options:
          - label: '69'
            why: >-
              Right. Reinier Paping, seen here, won in 10 hours 59 minutes. Then it did not freeze hard enough again for
              22 years.
          - label: About 2,000
            why: Only 69 finished. Most gave up in the cold and snow.
          - label: About 5,000
            why: Only 69 finished.
          - label: None
            why: Sixty-nine did, led by Reinier Paping.
      - type: pick
        prompt: Which of these are among the eleven towns? Pick all that belong.
        visual: { kind: photo, photo: elfsteden-monument }
        items:
          - { label: Sneek }
          - { label: Heerenveen }
          - { label: Harlingen }
          - { label: Dokkum }
          - { label: Drachten }
          - { label: Franeker }
          - { label: Joure }
          - { label: Sloten }
        answers: [0, 2, 3, 5, 7]
        explain: >-
          Sneek, Harlingen, Dokkum, Franeker and Sloten, the smallest town of Friesland. Heerenveen, Drachten and Joure are
          bigger than some of the eleven, but never had town rights, so the route passes them by.
      - type: cause
        prompt: Link each cause to what it led to.
        pairs:
          - [In 1956 five skaters cross the line hand in hand, No winner is named and shared finishes are banned]
          - [The ice must be 15 cm thick all the way, Mild winters have kept the race away since 1997]
          - [The klapschaats lets the blade stay on the ice longer, World records tumble at the Olympics of Nagano in 1998]
          - [Thialf in Heerenveen opens its artificial ice in 1967, Skaters can train without waiting for a hard winter]
        explain: >-
          The klapschaats, or clap skate, with its blade on a hinge at the front, was worked out at the Vrije Universiteit
          in Amsterdam by Gerrit Jan van Ingen Schenau, from 1979. Dutch women won with it in 1996–97, and soon everyone
          had to have one. Thialf got a roof in 1986.
      - type: who
        photo: wust
        clues:
          - I won my first Olympic gold at Turin in 2006, aged 19, then the youngest Dutch Olympic champion ever.
          - I won gold at five Winter Olympics in a row, the first athlete to do that in events for one person.
          - My 13 Olympic medals are more than any other speed skater's.
        options: [Ireen Wüst, Sven Kramer, Ard Schenk, Marianne Vos]
        answer: 0
        explain: >-
          Ireen Wüst, six times Olympic champion, from 2006 to 2022, when she stopped. Ard Schenk had won three golds at
          one Games, Sapporo in 1972.
      - type: choice
        prompt: In 1986 a skater called W. A. van Buren finished the Elfstedentocht. Who was he?
        visual: { kind: route, route: elfsteden, at: 13 }
        answer: 3
        options:
          - label: The winner, skating under a false name
            why: The winner was Evert van Benthem, for the second year running. Van Buren was the crown prince.
          - label: A skater from Canada
            why: Van Buren is an old name of the House of Orange. It was the crown prince.
          - label: The organiser's son
            why: It was the crown prince, Willem-Alexander, under a name the royal family uses.
          - label: Crown Prince Willem-Alexander
            why: >-
              Right. He skated the tour as W. A. van Buren, a name the House of Orange has used before. He is king since
