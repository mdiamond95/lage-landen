    exercises:
      - type: story
        title: A house with no walls
        body: >-
          In 1924 Truus Schröder, a widow with three children, asked the furniture maker Gerrit Rietveld for a house
          in Utrecht with as few fixed walls as possible. He built it out of lines and flat planes in grey, white and
          the primary colours of De Stijl, like a Mondrian you can walk into. She lived in it until 1985. Tap a
          part, or walk along the front.
        visual: { kind: facade, facade: schroder }
      - type: choice
        prompt: Upstairs, the Schröder house is one open space. How do its people get rooms of their own at night?
        visual: { kind: facade, facade: schroder, focus: upstairs }
        answer: 0
        options:
          - label: They slide and swing panels across to make bedrooms
            why: >-
              Right. In the day the upper floor is one room full of light; at night sliding and revolving panels close
              off bedrooms. The house is on the UNESCO list since 2000.
          - label: They hang curtains from the ceiling
            why: Rietveld built panels that slide and swing.
          - label: They sleep downstairs
            why: The bedrooms are upstairs, made with sliding panels.
          - label: Each child had a cabin in the garden
            why: The rooms are made with sliding panels upstairs.
      - type: choice
        prompt: Michel de Klerk built Het Schip in Amsterdam from 1917 to 1920, with a school and a post office inside. Who was it built for?
        visual: { kind: photo, photo: het-schip }
        answer: 0
        options:
          - label: Working families, by a socialist housing association, under the Housing Act of 1901
            why: >-
              Right. The Housing Act set higher standards, and associations like Eigen Haard built homes with light,
              air and water for working people. Het Schip had 102 homes. Its rounded brick and playful towers are the
              Amsterdam School.
          - label: A shipping company's directors
            why: The name comes from its shape. It was workers' housing.
          - label: The navy
            why: The name comes from its shape. It was workers' housing.
          - label: Rich merchants on the canals
            why: It is in a working-class district, the Spaarndammerbuurt.
      - type: gap
        prompt: In 1932 the Swiss-French architect Le Corbusier saw the Van Nelle factory in Rotterdam, where coffee, tea and tobacco were packed. Fill the gap in what he called it.
        quote: the most beautiful spectacle of the modern ___
        source: Le Corbusier, on the Van Nelle factory, 1932
        visual: { kind: photo, photo: van-nelle }
        options: [age, world, city, factory]
        answer: 0
        explain: >-
          "The most beautiful spectacle of the modern age." Built from 1925 to 1931 by Brinkman and Van der Vlugt, of
          concrete, steel and glass, the factory let in light everywhere. It is on the UNESCO list since 2014.
      - type: truemyth
        statement: The Atomium was built to stand for only six months.
        visual: { kind: photo, photo: atomium-1957 }
        answer: true
        explain: >-
          True. It was made for the World's Fair of 1958 in Brussels, an iron crystal blown up 165 billion times, and
          was meant to come down afterwards. It stayed, and since 2006 its nine spheres shine in stainless steel.
      - type: scrub
        prompt: Drag the slider to the years after Rotterdam's old centre was bombed, before its new shopping street opened.
        map: buildings
        start: 1931
        answer: [1940, 1952]
        explain: >-
          German bombers destroyed the centre of Rotterdam on 14 May 1940. The city chose to rebuild it as a modern
          city, and the Lijnbaan opened in 1953.
      - type: choice
        prompt: The Lijnbaan opened in Rotterdam in 1953, in the city rebuilt after the bombing. What was new about it?
        visual: { kind: photo, photo: lijnbaan }
        answer: 0
        options:
          - label: It was a shopping street built for people on foot, with no cars
            why: >-
              Right. Jo van den Broek and Jaap Bakema designed it, low shops along a car-free street with homes behind.
              It has been called the first purpose-built pedestrian street in Europe.
          - label: It was the first street with electric lights
            why: Streets had electric light long before 1953. It was built for walkers.
          - label: It was the first covered market
            why: It is an open street, without cars.
          - label: It was built of wood
            why: It is concrete, glass and brick. What was new was the lack of cars.
      - type: choice
        prompt: Wipe between 1885 and 1931. What has changed in the buildings on the map?
        visual: { kind: compare, map: buildings, years: [1885, 1931] }
        answer: 0
        options:
          - label: New styles have arrived, Art Nouveau around 1900 and then modern buildings of brick, concrete and glass
            why: >-
              Right. In 1885 the newest buildings, like the Rijksmuseum and the Palace of Justice, copied old styles. By
              1931 Horta's houses, the Beurs, the Schröder house, Van Nelle and Hilversum town hall stand on the map.
          - label: Nothing; architects still copy the past
            why: Look at the new marks of 1931.
          - label: The old towers have all been pulled down
            why: The belfries and churches are still there.
          - label: Only Belgium builds anything new
            why: Look at Amsterdam, Utrecht, Rotterdam and Hilversum.
