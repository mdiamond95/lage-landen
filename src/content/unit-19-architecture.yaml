        url: https://en.wikipedia.org/wiki/Palace_of_Justice,_Brussels
      - title: "Wikipedia, Beurs van Berlage"
        url: https://en.wikipedia.org/wiki/Beurs_van_Berlage
    exercises:
      - type: story
        title: A house like a plant
        body: >-
          In 1892 the scientist and professor Émile Tassel asked a young architect for a house in Brussels. What he got,
          finished in 1893, had iron columns where stone should be, rooms opening into each other around a stair
          lit from above, and lines that curl like stems and tendrils. It is counted among the first buildings of a new
          style: Art Nouveau. Tap a part of the front, or walk along it.
        visual: { kind: facade, facade: tassel }
      - type: who
        photo: horta-portrait
        clues:
          - I was born in Ghent in 1861, and helped Alphonse Balat build the royal greenhouses at Laeken.
          - I designed every detail of my houses, down to the carpets, lamps and doorbells.
          - My own house and studio in Saint-Gilles is now a museum.
          - King Albert made me a baron in 1932, and Brussels Central Station opened to my plans after my death.
        options: [Victor Horta, Henry van de Velde, Paul Hankar, Hendrik Petrus Berlage]
        answer: 0
        explain: >-
          Victor Horta. Four of his houses in Brussels, Tassel, Solvay, Van Eetvelde and his own, are on the UNESCO
          list. He died in 1947.
      - type: hunt
        prompt: Inside the Hôtel Tassel, find where an iron column bursts into curling stems.
        photo: tassel-stair
        targets:
          - [0.31, 0.0, 0.17, 0.24]
          - [0.77, 0.0, 0.11, 0.1]
        explain: >-
          The cast-iron column splits at the top into curving branches that hold up the beams, and the same whiplash
          lines run across the walls and the mosaic floor. Iron let Horta make the whole house flow.
      - type: truemyth
        statement: Horta's House of the People, built for the Belgian Workers' Party, still stands in Brussels.
        visual: { kind: photo, photo: maison-du-peuple }
        answer: false
        explain: >-
          Myth. The House of the People, built from 1896 to 1899 around a hall for more than 2,000 people, was
          pulled down in 1965, although more than 700 architects from around the world protested. Some of its iron
          went into a café in Antwerp. A tower block stands on the site.
      - type: odd
        prompt: Three of these are Art Nouveau houses in Brussels. Which is the odd one out?
        items:
          - { label: Hôtel Solvay, photo: solvay-front }
          - { label: Maison Saint-Cyr, photo: saint-cyr }
          - { label: Maison Cauchie, photo: cauchie }
          - { label: Beurs, Amsterdam, photo: beurs-berlage }
        answer: 3
        reasons:
          - It is plain brick with hardly any curves, the start of something new
          - It is the oldest of the four
          - It was built for a king
        reason: 0
        explain: >-
          Hendrik Petrus Berlage's stock exchange in Amsterdam, built from 1898 to 1903, is plain brick, with the
          iron and the walls left honest and bare. It points towards the modern architecture of the 1900s, while
          the three Brussels houses curl and bloom.
      - type: truemyth
        statement: Scaffolding put up on the Palace of Justice in Brussels in the 1980s is still there.
        visual: { kind: photo, photo: palace-justice }
        answer: true
        explain: >-
          True. Repairs began in 1984, and the scaffolding has stayed so long that it rusted and needed repairs of
          its own. It is now set to come down by 2035. The palace, built from 1866 to 1883 by Joseph Poelaert, was
          said to be the largest building of the 1800s.
      - type: choice
        prompt: The Stoclet Palace in Brussels, built from 1905 to 1911 by the Viennese architect Josef Hoffmann, has never been open to the public. Whose mosaics cover its dining-room walls?
        visual: { kind: photo, photo: stoclet }
        answer: 0
        options:
          - label: Gustav Klimt's
            why: >-
              Right. Klimt designed the three mosaic friezes, with their golden tree of life, and they were set in place
              by Leopold Forstner. The house is still owned by the family, and on the UNESCO list since 2009.
          - label: "Victor Horta's"
            why: Horta was an architect, and did not work on the Stoclet Palace.
          - label: "James Ensor's"
            why: Ensor painted in Ostend. The mosaics are Viennese.
          - label: "Piet Mondrian's"
            why: Mondrian painted grids. The mosaics are Viennese.
      - type: scrub
        prompt: Drag the slider to the years when Horta's Hôtel Tassel stands, but his House of the People is not yet finished.
        map: buildings
        start: 1885
        answer: [1893, 1898]
        explain: >-
          The Hôtel Tassel was finished in 1893. Horta built the House of the People from 1896 to 1899.
      - type: cause
        prompt: Link each cause to what it led to.
        pairs:
          - [Iron is strong and slender, Horta opens up a house around a stair lit from above]
          - [The Workers' Party wants a home of its own, Horta builds the House of the People]
          - [Ernest Solvay's chemical company makes a fortune, His son Armand can pay for a Horta mansion]
          - [Horta designs every detail himself, His houses are works of art down to the doorbell]
        explain: >-
          Art Nouveau in Brussels was paid for by new money, from industry, science and the workers' movement, and
          made possible by iron and glass.

