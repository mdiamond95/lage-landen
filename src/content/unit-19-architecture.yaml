        prompt: Piet Blom built these cube houses in Rotterdam from 1982 to 1984, each tipped on one corner on a pole. What did he want them to be?
        visual: { kind: photo, photo: cube-houses }
        answer: 0
        options:
          - label: A forest, with every house a tree
            why: >-
              Right. Blom called the complex het Blaakse Bos, the Blaak forest: 38 houses on poles, each a tree, with
