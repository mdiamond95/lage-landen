    exercises:
      - type: story
        title: A preacher's son with a brush
        body: >-
          Vincent van Gogh was born in 1853 in Zundert, in Brabant, the son of a preacher. He was an art dealer,
          a teacher and a lay preacher before he began to paint, at 27. He painted for only ten years, and sold
          almost nothing. Today he is the most famous Dutch painter after Rembrandt. Drag the slider through his ten
          years, from dark Brabant to the bright south. Unit 18 follows him all the way.
        visual: { kind: series, series: van-gogh }
      - type: who
        photo: van-gogh-self
        clues:
          - I was born in Zundert in 1853, and worked for an art dealer in The Hague, London and Paris.
          - My brother Theo, an art dealer too, sent me money every month.
          - I painted peasants in Nuenen, then moved to Paris and on to Arles, in the south of France.
          - I died in 1890, aged 37, at Auvers-sur-Oise.
        options: [Vincent van Gogh, George Hendrik Breitner, Jozef Israëls, Hendrik Willem Mesdag]
        answer: 0
        explain: >-
          Vincent van Gogh, in a self-portrait painted in Paris in 1887. He painted over 35 self-portraits, many
          because he could not pay a model.
      - type: hunt
        prompt: Van Gogh painted The Potato Eaters in Nuenen in 1885. Find the only light in the room.
        photo: potato-eaters
        targets: [[0.34, 0.12, 0.2, 0.25]]
        explain: >-
          An oil lamp hangs above the table. Van Gogh wanted to show people who had dug the earth with the same
          hands they now put in the dish, and so had honestly earned their food.
      - type: pin
        prompt: Pin Nuenen, the village near Eindhoven where Van Gogh painted The Potato Eaters.
        place: nuenen
        okKm: 20
        fullKm: 8
        explain: >-
          Nuenen, in Brabant, where his father was the preacher. Van Gogh lived there from 1883 to 1885.
      - type: scrub
        prompt: In 1885 Van Gogh took the train from Brabant to Antwerp, and then to Paris. Drag the slider to the first stage when a railway runs through Eindhoven.
        map: rails
        start: 1839
        answer: [1866, 1914]
        explain: >-
          The state line from Breda to Eindhoven and Venlo was finished in 1866, and another ran from Eindhoven to
          Hasselt in Belgium.
      - type: odd
        prompt: Three of these are by Van Gogh. Which is the odd one out, and why?
        items:
          - { label: Sunflowers, photo: sunflowers }
          - { label: Wheatfield with Crows, photo: wheatfield-crows }
          - { label: The Starry Night, photo: starry-night }
          - { label: Girl in a White Kimono, photo: breitner-kimono }
        answer: 3
        reasons:
          - It was painted by George Hendrik Breitner in Amsterdam
          - It was painted before 1850
          - It was painted in Belgium
        reason: 0
        explain: >-
          Breitner painted Geesje Kwak, a young seamstress, in a kimono in 1894; Japanese prints were the
          fashion. Van Gogh loved them too. The other three he painted in France between 1888 and 1890.
      - type: choice
        prompt: Hendrik Willem Mesdag painted the sea at Scheveningen again and again. In 1881 he and his team painted a picture 14 m high that runs right round a room. What is it?
        visual: { kind: photo, photo: panorama-mesdag }
        answer: 1
        options:
          - label: The Night Watch
            why: That is Rembrandt's, from 1642.
          - label: The Panorama Mesdag, a view of Scheveningen beach and village
            why: >-
              Right, about 120 m round, still in its own building in The Hague. You stand on a dune in the middle
              and look out at the sea, the fishing boats and the village of 1881.
          - label: A map of the railways
            why: It is a painting of the coast.
          - label: The ceiling of the Rijksmuseum
            why: It is in The Hague.
      - type: match
        prompt: Match each painter to what he is known for.
        pairs:
          - [Hendrik Willem Mesdag, The sea at Scheveningen]
          - [Jozef Israëls, Fishermen's families and the poor]
          - [George Hendrik Breitner, Amsterdam streets in rain and snow]
          - [Anton Mauve, "Sheep, beaches and quiet landscapes"]
        explain: Painters of the Hague School and their younger friends. Mauve, a cousin by marriage, gave Van Gogh his first painting lessons.
      - type: choice
        prompt: Jo van Gogh-Bonger, Theo's widow, inherited hundreds of Vincent's paintings when Theo died in 1891. What did she do?
        visual: { kind: photo, photo: jo-bonger }
        answer: 3
        options:
          - label: Sold them all at once to pay debts
            why: She sold slowly and with care, and kept many.
          - label: Burned the ones she disliked
            why: She did not.
          - label: Gave them to the Rijksmuseum
            why: The family kept them; they are now in the Van Gogh Museum, opened in 1973.
          - label: Spent her life making him known, and published his letters to Theo
            why: >-
              Right. She lent paintings to exhibitions, sold some to museums, and in 1914 published the letters.
              Without her, Vincent might have been forgotten.
      - type: truemyth
        statement: Van Gogh sold only one painting in his lifetime.
        visual: { kind: photo, photo: van-gogh-self }
        answer: false
        explain: >-
          A myth, though not far off. The Red Vineyard was sold in Brussels in 1890, but he also sold or traded
          a few other works, and drawings to his uncle. Hardly anyone bought his art while he lived.
