        url: https://en.wikipedia.org/wiki/Christiaan_Eijkman
      - title: "Wikipedia, Leo Baekeland"
        url: https://en.wikipedia.org/wiki/Leo_Baekeland
    exercises:
      - type: story
        title: The Nobel years
        body: >-
          When the Nobel Prizes began in 1901, the first in chemistry went to Jacobus van 't Hoff, and the second in
          physics to Hendrik Lorentz and Pieter Zeeman. By 1913 five Dutch scientists had won prizes in physics and
          chemistry. Lorentz, at Leiden, explained light as the work of tiny electric charges, and his equations lie
          under Einstein's relativity. Einstein, here with him in Leiden in 1921, visited him often and admired him
          above anyone.
        visual: { kind: photo, photo: einstein-lorentz }
      - type: choice
        prompt: On 10 July 1908 the laboratory of Heike Kamerlingh Onnes in Leiden made a gas liquid for the first time, and was for a while the coldest place on Earth. Which gas?
        visual: { kind: photo, photo: helium-liquefier }
        answer: 0
        options:
          - label: Helium
            why: >-
              Right, at 4.2 degrees above absolute zero. In 1911, cooling mercury in it, he found that its electrical
              resistance vanished: superconductivity. He won the Nobel Prize in 1913.
          - label: Oxygen
            why: Oxygen was made liquid in 1877. Leiden was first with helium, the hardest of all.
          - label: Hydrogen
            why: James Dewar did that in London in 1898. Leiden was first with helium, the hardest of all.
          - label: Nitrogen
            why: Nitrogen was made liquid in 1883. Leiden was first with helium, the hardest of all.
      - type: truemyth
        statement: Of the 29 scientists in this photo of the Solvay conference in Brussels in 1927, 17 were or became Nobel Prize winners.
        visual: { kind: photo, photo: solvay-1927 }
        answer: true
        explain: >-
          True. Ernest Solvay, who made a fortune from soda, paid for the conferences from 1911. In 1927 Einstein and
          Niels Bohr argued over quantum mechanics here. Lorentz chaired it, and Marie Curie, front row, had won two Nobel
          Prizes.
      - type: gap
        prompt: In 1927 Georges Lemaître, a priest and professor at Leuven, worked out that the universe is expanding. In 1931 he went further, in a letter to Nature. Fill the gap.
        quote: "If we go back in the course of time we must find fewer and fewer quanta, until we find all the energy of the universe packed in a few or even in a unique ___."
        source: Georges Lemaître, The beginning of the world from the point of view of quantum theory, Nature, 1931
        visual: { kind: photo, photo: lemaitre-statue }
        options: [quantum, star, galaxy, cloud]
        answer: 0
        explain: >-
          A single quantum, which he later called the primeval atom. In 1949 the English astronomer Fred Hoyle, who did
          not believe it, called the idea the Big Bang on the radio, and the name stuck.
      - type: choice
        prompt: Adolphe Quetelet of Ghent measured thousands of people to find the "average man". Which number, still used by doctors, did he invent?
        visual: { kind: photo, photo: quetelet }
        answer: 1
        options:
          - label: The IQ
            why: The intelligence test came from France in 1905. Quetelet's number is weight divided by height squared.
          - label: The body mass index, weight divided by height squared
            why: >-
              Right. He worked it out in the 1830s, as the Quetelet index; it was renamed the body mass index in 1972.
              He also founded the observatory in Brussels.
          - label: Blood pressure
            why: Quetelet's number is weight divided by height squared, the body mass index.
          - label: The birth rate
            why: Quetelet's number is weight divided by height squared, the body mass index.
      - type: choice
        prompt: From 1895 Paul Otlet and Henri La Fontaine set out to list every book and article ever published, on index cards, in Brussels. How far did they get?
        visual: { kind: photo, photo: otlet-desk }
        answer: 2
        options:
          - label: About 10,000 cards
            why: Far more. By 1934 they had about 15 million cards.
          - label: They gave up within a year
            why: They kept at it for decades. By 1934 they had about 15 million cards.
          - label: About 15 million cards
            why: >-
              Right. People could send in a question by post and get copies of the cards back. Otlet dreamed of a network
              of screens linking the world's knowledge, and is called a forerunner of the web. La Fontaine won the Nobel
              Peace Prize in 1913.
          - label: Every book in the world
            why: Nobody could. By 1934 they had about 15 million cards.
      - type: choice
        prompt: All four of these Dutch professors won Nobel Prizes. Christiaan Eijkman, bottom right, won his in 1929 for work in Batavia, in the Dutch East Indies. What did he find?
        visual: { kind: photo, photo: nobel-four }
        answer: 3
        options:
          - label: The cause of malaria
            why: That was Ronald Ross, in India. Eijkman found that beriberi came from a lack in the diet.
          - label: A cure for smallpox
            why: Eijkman found that beriberi came from a lack in the diet, which led to the discovery of vitamins.
          - label: The first antibiotic
            why: Eijkman found that beriberi came from a lack in the diet, which led to the discovery of vitamins.
          - label: That beriberi comes from a lack in the diet
            why: >-
              Right. Chickens fed on polished white rice fell ill, and got better on rice with its husk. The missing
              substance was later called vitamin B1. He shared the prize with Frederick Hopkins, an English discoverer of
              vitamins.
      - type: odd
        prompt: Which of these is the odd one out?
        items:
          - { label: Pieter Zeeman, photo: zeeman }
          - { label: Heike Kamerlingh Onnes, photo: kamerlingh-onnes }
          - { label: Willem Einthoven, photo: einthoven-ecg }
          - { label: Georges Lemaître, photo: lemaitre-statue }
        answer: 3
        reasons:
          - He never won a Nobel Prize.
          - He worked in Amsterdam.
          - He was a doctor.
        reason: 0
        explain: >-
          Lemaître, a Belgian, never won a Nobel Prize, though his idea of the expanding universe is one of the biggest
          of the century. Zeeman won in physics in 1902, Kamerlingh Onnes in physics in 1913, and Einthoven in medicine in
          1924, for recording the beating of the heart.
      - type: sort
        prompt: Sort these by the university where they studied or taught.
        groups: [Leuven, Leiden]
        items:
          - { label: Erasmus, group: 0, photo: erasmus-massys }
          - { label: Vesalius, group: 0, photo: vesalius-portrait }
          - { label: Mercator, group: 0, photo: mercator-hogenberg }
          - { label: Boerhaave, group: 1, photo: boerhaave }
          - { label: Clusius, group: 1, photo: clusius }
          - { label: Lorentz, group: 1, photo: lorentz }
        explain: >-
          Erasmus lived in Leuven from 1517 to 1521, Vesalius and Mercator studied there. Boerhaave, Clusius and Lorentz
          taught at Leiden. Leuven was the university of the south, Leiden the first of the north.
      - type: who
        photo: baekeland
        clues:
          - I was born in Ghent in 1863, the son of a shoemaker, and studied chemistry at its university.
          - I moved to New York, and invented a photo paper that could be printed by lamplight. I sold it to Kodak in 1899.
          - In 1907 I made the first plastic that kept its shape when heated, and named it after myself.
        options: [Leo Baekeland, Ernest Solvay, Zénobe Gramme, Adolphe Sax]
        answer: 0
        explain: >-
          Leo Baekeland. Kodak paid him about 750,000 dollars for his Velox paper. His Bakelite went into telephones,
          radios and light switches: the start of the age of plastics.
      - type: cause
        prompt: Link each cause to what it led to.
        pairs:
          - [Kamerlingh Onnes cools mercury in liquid helium, Its electrical resistance vanishes]
          - [Zeeman puts a flame between strong magnets, The lines of its light split as Lorentz had predicted]
          - [Lemaître reads how fast distant galaxies move away, He concludes that the universe is expanding]
          - [Ernest Solvay grows rich from making soda, He pays for the Solvay conferences in Brussels]
        explain: >-
          Zeeman found his effect in 1896, and the prize of 1902 went to both. Lemaître's paper of 1927 came out in a
          little-read Belgian journal; it became famous only when it was translated into English in 1931.
