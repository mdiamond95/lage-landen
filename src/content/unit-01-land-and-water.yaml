id: unit-01
number: 1
title: Land and water
era: Geography
summary: Where the Low Countries are, the three rivers that made them, and how people kept the sea out.
lessons:
  - id: u1-l1
    title: Two countries, one delta
    icon: map
    sources:
      - title: CBS, population growth 2026 (Netherlands)
        url: https://www.cbs.nl/en-gb/news/2026/06/population-growth-slows-for-third-consecutive-year
      - title: NBTC, the Netherlands vs Holland
        url: https://www.holland.com/global/tourism/getting-around/information/netherlands-vs-holland
      - title: Statbel, structure of the population (Belgium)
        url: https://statbel.fgov.be/en/themes/population/structure-population
    exercises:
      - type: story
        title: The Low Countries
        body: >-
          The Netherlands and Belgium sit where three big rivers, the Rhine, the Maas and the Scheldt,
          reach the North Sea. "Nederland" literally means "low land". For most of history the whole
          area was one patchwork of counties and duchies called the Low Countries. North and south were split
          by war in the late 1500s, reunited in 1815, and split again when Belgium broke away in 1830.
        visual: { kind: map, highlight: [NLD, BEL], rivers: [Rhine, Waal, Lek, Nederrijn, IJssel, Maas, Schelde] }
      - type: choice
        prompt: Which is the flag of Belgium?
        answer: 1
        options:
          - art: flag-nl
            why: Red, white and blue stripes running sideways belong to the Netherlands.
          - art: flag-be
            why: Belgium's black, yellow and red stripes stand upright.
          - art: flag-lu
            why: That's Luxembourg. It looks like the Dutch flag, but its blue is lighter.
          - art: flag-de
            why: Germany's black, red and gold stripes run sideways.
      - type: region
        prompt: Tap the Netherlands.
        layer: countries
        answer: [NLD]
        explain: The Netherlands is the northern of the two, with a long North Sea coast and the big IJsselmeer lake.
      - type: pin
        prompt: Pin Amsterdam, the capital of the Netherlands.
        place: amsterdam
        explain: Amsterdam is the capital, but the government, parliament and the king's working palace are in The Hague.
      - type: pin
        prompt: Pin Brussels, the capital of Belgium.
        place: brussels
        explain: Brussels is Belgium's capital. It is also home to the main EU institutions and NATO's headquarters.
      - type: truemyth
        statement: '"Holland" is just another name for the whole Netherlands.'
        answer: false
        explain: >-
          Holland is only two of the 12 provinces, North Holland and South Holland. They were the
          richest part of the Dutch Republic, which is why the name stuck abroad.
      - type: region
        prompt: Shade the two provinces that make up Holland.
        layer: provinces
        answer: [NL-NH, NL-ZH]
        explain: North Holland (with Amsterdam) and South Holland (with The Hague and Rotterdam) run along the coast.
      - type: pin
        prompt: Pin The Hague, the seat of the Dutch government.
        place: the-hague
        explain: The Hague sits on the coast in South Holland, about 50 km southwest of Amsterdam.
      - type: match
        prompt: Match each city to what it is known for.
        pairs:
          - [Amsterdam, Capital of the Netherlands]
          - [The Hague, Seat of the Dutch government]
          - [Brussels, Capital of Belgium and the EU's main seat]
          - [Antwerp, Belgium's biggest port]
      - type: truemyth
        statement: Belgium has more people than the Netherlands.
        visual: { kind: map, highlight: [NLD, BEL], rivers: [], pins: [] }
        answer: false
        explain: >-
          The Netherlands has about 18 million people and Belgium about 11.9 million. The Netherlands
          is also larger, about 41,500 km² including its water, against Belgium's 30,700 km².

  - id: u1-l2
    title: Three rivers
    icon: river
    sources:
      - title: Rijkswaterstaat, the Rhine and Maas river areas
        url: https://www.rijkswaterstaat.nl/en/projects/iconic-structures/room-for-the-river
      - title: Port of Rotterdam, facts and figures
        url: https://www.portofrotterdam.com/en/experience-online/facts-and-figures
      - title: Livius.org, Traiectum ad Mosam (Maastricht)
        url: https://livius.org/articles/place/traiectum-ad-mosam-maastricht
    exercises:
      - type: story
        title: Rhine, Maas and Scheldt
        body: >-
          The Rhine flows in from Germany at Lobith and splits into the Waal, the Nederrijn-Lek and the
          IJssel. The Maas (Meuse in French) comes up from France through Namur, Liège and Maastricht.
          The Scheldt rises in France and runs past Ghent and Antwerp to the sea in Zeeland.
        visual: { kind: map, highlight: [NLD, BEL], rivers: [Rhine, Waal, Lek, Nederrijn, IJssel, Maas, Schelde], pins: [lobith, antwerp, liege] }
      - type: choice
        prompt: Which river is highlighted?
        visual: { kind: map, highlight: [], rivers: [Schelde] }
        answer: 2
        options:
          - label: Rhine
            why: The Rhine comes in from Germany in the east, well north of this river.
          - label: Maas
            why: The Maas runs further east, through Liège and Maastricht.
          - label: Scheldt
            why: Right. The Scheldt runs from France through Ghent and Antwerp.
          - label: IJssel
            why: The IJssel is a Rhine branch flowing north to the IJsselmeer.
      - type: pin
        prompt: Pin the spot where the Rhine enters the Netherlands.
        place: lobith
        okKm: 35
        explain: The Rhine crosses the border at Lobith, near Arnhem and Nijmegen. Dutch river levels are measured there.
      - type: choice
        prompt: Which river is highlighted?
        visual: { kind: map, highlight: [], rivers: [Maas] }
        answer: 1
        options:
          - label: Scheldt
            why: The Scheldt is the westernmost of the three, through Ghent and Antwerp.
          - label: Maas
            why: Right. The Maas (Meuse) runs through Namur, Liège and Maastricht.
          - label: Waal
            why: The Waal is the main branch of the Rhine, running east to west through Nijmegen.
          - label: IJssel
            why: The IJssel flows north from the Rhine to the IJsselmeer.
      - type: pin
        prompt: Pin Antwerp, the big port city on the Scheldt.
        place: antwerp
        explain: Antwerp lies about 80 km up the Scheldt from the sea, which shelters its port from storms.
      - type: truemyth
        statement: Maastricht is named after a crossing over the Maas.
        visual: { kind: map, highlight: [], rivers: [Maas], pins: [maastricht] }
        answer: true
        explain: The town grew up where a Roman road crossed the Maas by a bridge. Its medieval Latin name, Traiectum ad Mosam, means "the crossing on the Maas".
      - type: match
        prompt: Match each river to a city on its banks.
        pairs:
          - [Maas, Liège]
          - [Scheldt, Antwerp]
          - [Waal, Nijmegen]
          - [IJssel, Deventer]
      - type: choice
        prompt: This waterway leads from the North Sea into the largest port in Europe, lined with harbour basins and oil tanks. Which port is it?
        visual: { kind: photo, photo: port-rotterdam }
        answer: 0
        options:
          - label: Rotterdam
            why: Rotterdam, near the mouths of the Rhine and Maas, handles more cargo than any other port in Europe.
          - label: Antwerp
            why: Antwerp-Bruges is a close second, not first.
          - label: Hamburg
            why: Hamburg is Germany's biggest port, but smaller than Rotterdam.
          - label: Amsterdam
            why: Amsterdam has a busy port, but it is far smaller than Rotterdam's.
      - type: region
        prompt: Shade Zeeland, the "sea land" where the Scheldt meets the sea.
        layer: provinces
        answer: [NL-ZE]
        explain: Zeeland is a cluster of former islands in the southwest, between the Scheldt and Maas estuaries.
      - type: pin
        prompt: Pin Rotterdam.
        place: rotterdam
        explain: Rotterdam grew up on the Nieuwe Maas. Despite its name, it now carries mostly Rhine water to the sea.

  - id: u1-l3
    title: Below sea level
    icon: wave
    sources:
      - title: PBL Netherlands Environmental Assessment Agency, flood-prone area
        url: https://www.pbl.nl/en/correction-wording-flood-risks-for-the-netherlands-in-ipcc-report
      - title: UNESCO, Mill Network at Kinderdijk-Elshout
        url: https://whc.unesco.org/en/list/818
      - title: UNESCO, Droogmakerij de Beemster
        url: https://whc.unesco.org/en/list/899
    exercises:
      - type: story
        title: A country that should be under water
        body: >-
          About a quarter of the Netherlands lies below sea level, and almost 60% could flood from
          the sea or the rivers without dikes, dunes and pumps. Drag the slider to raise the water and
          see what the dike is holding back.
        visual: { kind: polder-slider }
      - type: choice
        prompt: Which picture shows a terp?
        answer: 1
        options:
          - photo: afsluitdijk
            why: That's a dike, a long wall of earth and stone that keeps the water out. This one is the Afsluitdijk.
          - photo: terp-hogebeintum
            why: Right. A terp is a mound people piled up so their farm stayed dry at high tide. Hogebeintum's is almost 9 m high, with a church on top.
          - photo: polder-beemster
            why: That's a polder, low land drained into a grid of ditches. This is the Beemster from the air.
          - photo: kinderdijk
            why: Those are drainage windmills at Kinderdijk, which pumped water out of the polders.
      - type: order
        prompt: Put these in order, oldest first.
        items:
          - { label: First terps built in Friesland, year: -500, when: about 500 BCE }
          - { label: First sea dikes, year: 1000, when: about 1000 }
          - { label: Beemster lake drained, year: 1612, when: '1612' }
          - { label: Kinderdijk windmills built, year: 1740, when: 1738 to 1740 }
          - { label: Haarlemmermeer pumped dry by steam, year: 1852, when: 1849 to 1852 }
        explain: People first lived on mounds, then joined them with dikes, then drained whole lakes with windmills and later steam.
      - type: pin
        prompt: The lowest point in the Netherlands is in the Zuidplaspolder, just northeast of Rotterdam. Pin it.
        place: zuidplaspolder
        okKm: 30
        explain: Near Nieuwerkerk aan den IJssel the land is 6.76 m below sea level. It was a lake until windmills drained it between 1825 and 1840.
      - type: choice
        prompt: What did these windmills at Kinderdijk do?
        visual: { kind: photo, photo: kinderdijk }
        answer: 1
        options:
          - label: Ground grain into flour
            why: Some windmills did, but polder mills had another job.
          - label: Lifted water out of the polder
            why: Right. Each mill lifted water from the low polder into higher canals that led to the rivers.
          - label: Made electricity
            why: Electricity came centuries later. These mills drove scoop wheels or screws.
          - label: Sawed timber for ships
            why: Sawmills existed, especially along the Zaan, but polder mills pumped water.
      - type: pin
        prompt: Pin Kinderdijk, where 19 windmills, most built around 1740, still stand.
        place: kinderdijk
        explain: Kinderdijk lies east of Rotterdam where the Lek and Noord rivers meet. It became a UNESCO site in 1997.
      - type: truemyth
        statement: Schiphol, Amsterdam's airport, is built on the bottom of a former lake.
        visual: { kind: map, highlight: [], rivers: [], pins: [schiphol, amsterdam] }
        answer: true
        explain: The Haarlemmermeer was pumped dry between 1849 and 1852. Schiphol's runways lie about 3 m below sea level.
      - type: choice
        prompt: Steam pumping stations like the Cruquius emptied a whole lake between 1849 and 1852. Which lake?
        visual: { kind: photo, photo: cruquius }
        answer: 2
        options:
          - label: The Beemster
            why: The Beemster was drained much earlier, in 1612, by 43 windmills.
          - label: The Zuiderzee
            why: The Zuiderzee was closed off by the Afsluitdijk in 1932, and only parts of it were drained.
          - label: The Haarlemmermeer
            why: Right. Three steam stations, the Cruquius, the Leeghwater and the Lynden, pumped out about 800 million m³ of water.
          - label: The IJsselmeer
            why: The IJsselmeer is still a lake. It is what the Zuiderzee became after 1932.
      - type: choice
        prompt: This marker on the Vaalserberg stands where the Netherlands, Belgium and Germany meet, at the highest point of the European Netherlands. Belgium's highest point is 694 m. How high is this one?
        visual: { kind: photo, photo: drielandenpunt }
        answer: 0
        options:
          - label: 322 m
            why: Right. The Vaalserberg, in the far southeast, reaches 322 m.
          - label: 694 m
            why: That's Belgium's Signal de Botrange, in the Ardennes.
          - label: 1,050 m
            why: Nothing in the Low Countries comes close to that.
          - label: 98 m
            why: Higher than that. The southeast tip of Limburg is hilly.
      - type: pin
        prompt: Now pin the Vaalserberg, where the Netherlands, Belgium and Germany meet.
        place: vaalserberg
        okKm: 30
        explain: The Vaalserberg is just south of Vaals, near Aachen. A marker on top shows where the three countries meet.

  - id: u1-l4
    title: Holding back the sea
    icon: shield
    sources:
      - title: Watersnoodmuseum, the 1953 flood
        url: https://watersnoodmuseum.nl/en/exhibitions/1835-1
      - title: Rijkswaterstaat, Eastern Scheldt barrier
        url: https://www.rijkswaterstaat.nl/en/projects/iconic-structures/eastern-scheldt-barrier
      - title: Rijkswaterstaat, Maeslant barrier
        url: https://www.rijkswaterstaat.nl/en/projects/iconic-structures/maeslant-barrier
      - title: Rijkswaterstaat, 40 years of the Oosterscheldekering (in Dutch)
        url: https://www.rijkswaterstaat.nl/nieuws/archief/40-jaar-oosterscheldekering-van-dam-naar-stormvloedkering
      - title: UNESCO, Wadden Sea
        url: https://whc.unesco.org/en/list/1314
      - title: Schultz, The story of the Dutch boy who prevented a flooding disaster (Water History, 2019)
        url: https://doi.org/10.1007/s12685-019-00237-0
    exercises:
      - type: story
        title: The night of 31 January 1953
        body: >-
          A storm surge broke through the dikes of Zeeland and South Holland. In the Netherlands 1,836
          people died, and hundreds more died in England and Belgium. The country answered with the Delta
          Works, a chain of dams and barriers that took about 40 years to finish.
        visual: { kind: photo, photo: flood-1953-rilland }
      - type: choice
        prompt: The hatched areas on this map flooded in 1953. Which province took the worst of it?
        visual: { kind: photo, photo: flood-1953-map }
        answer: 0
        options:
          - label: Zeeland
            why: Right. Most of Zeeland's islands went under, from Schouwen-Duiveland to Zuid-Beveland.
          - label: Friesland
            why: Friesland is in the far north, well away from the map. The storm hit the southwest hardest.
          - label: Limburg
            why: Limburg is inland, in the southeast. River floods hit it in 1993 and 1995, not 1953.
          - label: North Holland
            why: North Holland lies north of the map and mostly held out. The southwest took the worst of it.
      - type: choice
        prompt: This map opens in 1953. Press play to watch the Delta Works go up. Which was the last to be finished?
        visual: { kind: time-map, map: water, year: 1953 }
        answer: 3
        options:
          - label: The Veerse Gatdam
            why: The Veerse Gatdam was the first sea arm closed, in 1961.
          - label: The Haringvlietdam
            why: The Haringvlietdam closed in 1971, with sluices to let the rivers out.
          - label: The Oosterscheldekering
            why: The Oosterschelde barrier opened in 1986, but one more barrier came after it.
          - label: The Maeslantkering
            why: Right. The Maeslantkering, finished in 1997, guards the waterway to Rotterdam with two swinging gates.
      - type: scrub
        prompt: Drag the slider to a year when the Haringvliet is dammed but the Oosterschelde is still open to the sea.
        map: water
        start: 1953
        answer: [1971, 1985]
        explain: >-
          The Haringvlietdam closed in 1971. The Oosterschelde was to be dammed too, but fishermen and nature
          groups fought the plan, so it got a barrier with gates instead, finished in 1986.
      - type: choice
        prompt: Which picture shows a storm surge barrier?
        answer: 3
        options:
          - photo: afsluitdijk
            why: That's the Afsluitdijk, a closed dam with only sluices and locks to let water through.
          - photo: kinderdijk
            why: Those are drainage windmills at Kinderdijk.
          - photo: terp-hogebeintum
            why: That's the terp at Hogebeintum, a dwelling mound.
          - photo: oosterscheldekering
            why: Right. The Oosterscheldekering's 62 steel gates stay open for the tides and close only in storms.
      - type: pin
        prompt: Pin the Maeslantkering, which guards the waterway to Rotterdam where it meets the sea at Hoek van Holland.
        place: maeslantkering
        okKm: 25
        explain: Its two gates, each about 210 m long, lie in docks on either bank and swing shut only when a storm surge threatens.
      - type: order
        prompt: Put these in order, oldest first.
        items:
          - { label: North Sea flood, year: 1953, when: '1953' }
          - { label: The Delta Act is passed, year: 1958, when: '1958' }
          - { label: The Veerse Gat is dammed, year: 1961, when: '1961' }
          - { label: The Oosterschelde barrier opens, year: 1986, when: '1986' }
          - { label: The Maeslantkering protects Rotterdam, year: 1997, when: '1997' }
        explain: The Delta Works took about 40 years, from the first barrier in 1958 to the last in 1997.
      - type: truemyth
        statement: The story of the boy who saved his town by plugging a leaking dike with his finger is an old Dutch folk tale.
        visual: { kind: photo, photo: hansje-brinker }
        answer: false
        explain: >-
          No old Dutch source tells it. It was first printed abroad, in French by 1848, and became world-famous
          through an American novel, Hans Brinker, or The Silver Skates (1865), where English children read it from
          a schoolbook. The boy has no name there. This statue at Spaarndam went up in 1950, for the tourists who
          came looking for him.
      - type: match
        prompt: Match each structure to its job.
        pairs:
          - [Afsluitdijk, Closes off the IJsselmeer]
          - [Oosterscheldekering, Storm barrier with 62 gates]
          - [Maeslantkering, Swinging gates guarding Rotterdam]
          - [Polder mill, Lifts water out of low land]
      - type: cause
        prompt: Link each cause to its effect.
        pairs:
          - [The North Sea flood of 1953, The Delta Works are built]
          - [Fishermen and scientists fear for the shellfish, The Oosterschelde gets a barrier that stays open]
          - [Ships must still reach Rotterdam from the sea, The Maeslantkering's gates close only in storms]
        explain: >-
          Each disaster or worry shaped the next piece of work. The Oosterschelde was first meant to get a closed
          dam, but in 1976 the government chose gates that stay open, so the barrier kept most of the tide and its
          mussels and oysters.
      - type: truemyth
        statement: Belgium's coast is more than 200 km long.
        visual: { kind: map, highlight: [BE-VWV], rivers: [], pins: [] }
        answer: false
        explain: Belgium's coast is only about 67 km, from De Panne to Knokke-Heist, all of it in West Flanders, and lined with dunes and seawalls.
      - type: truemyth
        statement: The Wadden Sea, north of Friesland and Groningen, is a UNESCO World Heritage site.
        answer: true
        explain: The Wadden Sea, shared with Germany and Denmark, is the world's largest unbroken system of tidal sand and mud flats.

  - id: u1-l5
    title: Land from the sea
    icon: polder
    sources:
      - title: Rijkswaterstaat, the Afsluitdijk
        url: https://www.rijkswaterstaat.nl/en/projects/iconic-structures/the-afsluitdijk
      - title: Rijkswaterstaat, 100 years of the Zuiderzee Act (in Dutch)
        url: https://www.rijkswaterstaat.nl/water/waterbeheer/bescherming-tegen-het-water/100-jaar-zuiderzeewet
      - title: CBS, New land, what the IJsselmeer polders brought the Netherlands (in Dutch)
        url: https://www.cbs.nl/nl-nl/achtergrond/2018/24/nieuw-land-wat-de-ijsselmeerpolders-nederland-brachten
      - title: Nationaal Park Nieuw Land, Flevoland's history
        url: https://www.nationaalparknieuwland.nl/en/the-park/flevolands-history
      - title: TU Delft heritage, the Delta honorary doctors
        url: https://erfgoed.tudelft.nl/en/publications/delta-eredotors
      - title: Rijksmonumentenregister, Afsluitdijk monument (in Dutch)
        url: https://monumentenregister.cultureelerfgoed.nl/monumenten/pdf/510384
    exercises:
      - type: story
        title: Closing the Zuiderzee
        body: >-
          Until 1932 a shallow arm of the North Sea, the Zuiderzee, reached deep into the middle of the
          Netherlands. After a flood in 1916 the country decided to shut it off with a dam and drain new land
          behind it. Press play to watch the sea turn into a lake and the lake into polders.
        visual: { kind: time-map, map: water }
      - type: choice
        prompt: Look at the map in 1932. What did the Afsluitdijk do to the Zuiderzee?
        visual: { kind: time-map, map: water, year: 1932 }
        answer: 1
        options:
          - label: Drained it completely
            why: The dam only closed it off. Draining came polder by polder, and much of the lake is still water.
          - label: Turned it into a freshwater lake, the IJsselmeer
            why: Right. Cut off from the sea and fed by the IJssel, the water slowly turned fresh. It is now a big store of fresh water.
          - label: Joined it to the Rhine
            why: The IJssel, a Rhine branch, already flowed into it. The dam cut it off from the North Sea.
          - label: Made it deeper for ships
            why: Ships pass the dam through locks, but the dam was built for safety and new land.
      - type: scrub
        prompt: Drag the slider to a year when the Afsluitdijk is closed but the Noordoostpolder is still under water.
        map: water
        answer: [1932, 1941]
        explain: >-
          The dam closed in 1932 and the Noordoostpolder fell dry in 1942, during the German occupation. In
          between, the new IJsselmeer was all water apart from the Wieringermeer.
      - type: pin
        prompt: Pin the Afsluitdijk, the 32 km dam that turned the salty Zuiderzee into a freshwater lake.
        place: afsluitdijk
        okKm: 25
        explain: The Afsluitdijk runs from North Holland to Friesland. Behind it, the Zuiderzee became the IJsselmeer.
      - type: gap
        prompt: Where the last gap in the Afsluitdijk was closed, on 28 May 1932, a monument with a lookout tower stands on the dam. Fill the gap in its inscription.
        quote: A people that lives builds for its ___.
        source: Inscription on the Afsluitdijk monument by W.M. Dudok, 1933, in English
        visual: { kind: photo, photo: afsluitdijk }
        options: [future, children, safety, country]
        answer: 0
        explain: >-
          "Een volk dat leeft bouwt aan zijn toekomst." The bronze letters stand above a relief of three dike
          workers. Nobody knows for certain who wrote the line.
      - type: who
        photo: lely-statue
        clues:
          - I was an engineer, and three times the Dutch minister in charge of public works.
          - In 1891 I drew up a plan to close off the Zuiderzee with a dam and drain polders behind it.
          - After the flood of 1916, parliament finally turned my plan into law.
          - I died in 1929, before the dam was finished, but Flevoland's capital is named after me.
        options: [Cornelis Lely, Jan Leeghwater, Hendrik Lorentz, Johan van Veen]
        answer: 0
        explain: >-
          Cornelis Lely. His statue looks out over the Afsluitdijk. The physicist Hendrik Lorentz worked out how the
          dam would change the tides, and the sluices in it are named after him.
      - type: region
        prompt: Shade Flevoland, a province made almost entirely of land pumped dry from the Zuiderzee.
        layer: provinces
        answer: [NL-FL]
        explain: >-
          Flevoland is the Noordoostpolder, dry in 1942, and the Flevopolder, which fell dry in two halves in 1957
          and 1968. It became a province in 1986.
      - type: pin
        prompt: Pin Lelystad, the capital of Flevoland, built on what was seabed until 1957.
        place: lelystad
        explain: Lelystad lies on the west side of the Flevopolder, where the Houtribdijk to Enkhuizen begins.
      - type: order
        prompt: Put these in order, oldest first.
        items:
          - { label: Law to close off the Zuiderzee, year: 1918, when: '1918' }
          - { label: The Wieringermeer falls dry, year: 1930, when: '1930' }
          - { label: Afsluitdijk completed, year: 1932, when: '1932' }
          - { label: The Noordoostpolder falls dry, year: 1942, when: '1942' }
          - { label: Flevoland becomes a province, year: 1986, when: '1986' }
        explain: The Zuiderzee works took about 70 years, from the law of 1918 to the new province of 1986.
      - type: truemyth
        statement: Every polder planned in the Zuiderzee was drained in the end.
        visual: { kind: time-map, map: water, year: 1997 }
        answer: false
        explain: >-
          The last one, the Markerwaard, was never built. The Houtribdijk of 1975 cut off its lake, the
          Markermeer, but the polder was put off and finally dropped. The lake is now a nature and water reserve.
      - type: choice
        prompt: Drag the line to wipe from 1916 to 1997. A whole new province has appeared, drained from the old Zuiderzee. Which?
        visual: { kind: compare, map: water, years: [1916, 1997] }
        answer: 0
        options:
          - label: Flevoland
            why: >-
              Right. Its polders were drained in 1957 and 1968, and in 1986 it became the twelfth province, on land
