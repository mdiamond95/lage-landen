id: unit-13
number: 13
title: Industry and empire
era: 1835 to today
summary: In 1835 the first train on the continent runs from Brussels to Mechelen, and the coal country of Wallonia makes Belgium the first industrial nation on the mainland, at a hard price for its miners. King Leopold II takes the Congo as his own colony, and rules it by terror for rubber until Belgium takes it over in 1908. The Belgian Congo is run by the state, the Church and the companies until independence in 1960, and within months its first prime minister, Patrice Lumumba, is murdered. Belgium is still arguing over how to remember it all.
note: >-
  Three lessons of this unit tell of Leopold II's Congo Free State, where people were held hostage, mutilated and
  killed to force them to gather rubber, of forced labour and people put on show in the Belgian Congo, and of the
  murder of Patrice Lumumba in 1961. They are told plainly, without celebrations, and without the most graphic
  photographs of the time.
lessons:
  - id: u13-l1
    title: The first trains on the continent
    icon: train
    sources:
      - title: "Wikipedia, Rail transport in Belgium"
        url: https://en.wikipedia.org/wiki/Rail_transport_in_Belgium
      - title: "Pasinomie, the railway law of 1 May 1834 (in French)"
        url: https://beta.unionisme.be/pasinomie/1834/L18340501.pdf
      - title: "Wikipedia, Ligne 25: Brussels to Mechelen and Antwerp (in French)"
        url: https://fr.wikipedia.org/wiki/Ligne_25_(Infrabel)
      - title: "Wikipedia, Le Belge, the first locomotive built in Belgium (in French)"
        url: https://fr.wikipedia.org/wiki/Le_Belge_(locomotive)
      - title: "Wikipedia, John Cockerill"
        url: https://en.wikipedia.org/wiki/John_Cockerill_(industrialist)
      - title: "Wikipedia, Antwerpen-Centraal railway station"
        url: https://en.wikipedia.org/wiki/Antwerpen-Centraal_railway_station
    exercises:
      - type: story
        title: 5 May 1835
        body: >-
          Five years after the revolution, the new kingdom wanted a way to move goods from the port of Antwerp to
          Germany without paying the Dutch. Its answer was the railway. On 5 May 1835 three trains left the Allée
          Verte in Brussels for Mechelen, the first passenger trains on the continent of Europe. Press play to see
          the network grow.
        visual: { kind: time-map, map: industry, year: 1835 }
      - type: who
        photo: cockerill
        clues:
          - I was born in Lancashire, England, in 1790, and came to Verviers as a boy with my father, who built machines for spinning wool.
          - In 1817 I bought the old summer palace of the prince-bishops of Liège at Seraing, and filled it with furnaces.
          - The Dutch king William I was my partner, and owned half the works.
          - In 1835 my works built Le Belge, the first locomotive made in Belgium.
        options: [John Cockerill, George Stephenson, Ernest Solvay, Henri De Gorge]
        answer: 0
        explain: >-
          John Cockerill. Seraing grew into one of the biggest ironworks in Europe, making engines, rails, ships and
          locomotives. He died in Warsaw in 1840, on a journey to sell his machines in Russia, and the company still
          carries his name.
      - type: choice
        prompt: Why was the new kingdom in such a hurry to build a railway from Antwerp towards Germany?
        visual: { kind: photo, photo: first-train-1835 }
        answer: 1
        options:
          - label: The king wanted a fast way to his summer palace
            why: The lines were planned for trade, not for the court.
          - label: Its trade to the Rhine had to pass through the Netherlands
            why: >-
              Right. The Dutch held the mouth of the Scheldt and the rivers to Germany, and until 1839 they did not
              even recognise Belgium. A railway from Antwerp over Liège to Prussia went around them.
          - label: Canals were forbidden by the new constitution
            why: Belgium kept digging canals too, such as the canal from Charleroi to Brussels.
          - label: Britain paid for it
            why: The state paid for its own lines, with money it borrowed.
      - type: gap
        prompt: The law of 1 May 1834 planned the state's network. Fill the gap in its first article.
        quote: There shall be built in the kingdom a system of railways having as its central point ___, and running east to the border of Prussia by Leuven, Liège and Verviers; north to Antwerp; west to Ostend by Dendermonde, Ghent and Bruges; and south to Brussels and towards the borders of France through Hainaut.
        source: The Belgian railway law of 1 May 1834, article 1 (translated from the French)
        visual: { kind: photo, photo: rail-medal-1835 }
        options: [Mechelen, Brussels, Antwerp, Leuven]
        answer: 0
        explain: >-
          Mechelen lies almost halfway between Brussels and Antwerp, on flat land, so four lines could run out of it
          to the four points of the compass. A medal was struck for the opening of the first line in 1835.
      - type: pin
        prompt: Pin Mechelen, the hub of the first state railway.
        place: mechelen
        explain: >-
          Mechelen is between Brussels and Antwerp. The state set up its railway workshops there, and trains are still
          repaired in Mechelen today.
      - type: truemyth
        statement: The engines that pulled the first trains in 1835 were built in Belgium.
        visual: { kind: photo, photo: le-belge }
        answer: false
        explain: >-
          Myth. The three engines, the Arrow, the Elephant and the Stephenson, were built in England, where the first
          railways had run ten years before. Le Belge, in this picture, was the first to be built in Belgium, by Cockerill at
          Seraing, at the end of 1835.
      - type: scrub
        prompt: Drag the slider to the first stage when a train could leave Belgium for Prussia.
        map: industry
        answer: [1843, 1869]
        explain: >-
          On 24 October 1843 the line from Liège over the hills by Verviers reached Aachen, one of the first railways
          in the world to cross a border. Lines to France, beyond Mons and Kortrijk, had opened the year before.
      - type: choice
        prompt: Wipe from 1835 to 1870. Which of these had no railway in 1835, but was joined to Brussels by 1870?
        visual: { kind: compare, map: industry, years: [1835, 1870] }
        answer: 0
        options:
          - label: Luxembourg
            why: >-
              Right. A private company, the Grande Compagnie du Luxembourg, built the line from Brussels through Namur
              and the Ardennes to Arlon and Luxembourg, finished in 1859.
          - label: Mechelen
            why: Mechelen was on the very first line, in 1835.
          - label: Brussels
            why: The first train left from Brussels.
      - type: choice
        prompt: Antwerp's Central Station opened in 1905, with a great dome over its hall. What is it often called?
        visual: { kind: photo, photo: antwerp-central-hall }
        answer: 2
        options:
          - label: The glass palace
            why: That name belongs to other buildings.
          - label: The king's gate
            why: Leopold II pushed for the station, but that is not its nickname.
          - label: The railway cathedral
            why: >-
              Right. The architect Louis Delacenserie built it from 1895 to 1905. Under it, tracks now run on three
              levels, so trains to the Netherlands can pass straight through.
          - label: The iron church
            why: Close, but no.
      - type: order
        prompt: Put these in order.
        items:
          - { label: The railway law, year: 1834, when: '1834' }
          - { label: The first train, Brussels to Mechelen, year: 1835, when: '1835' }
          - { label: The line reaches Antwerp, year: 1836, when: '1836' }
          - { label: The line from Liège reaches Prussia, year: 1843, when: '1843' }
          - { label: Antwerp Central opens, year: 1905, when: '1905' }
        explain: >-
          By 1914 Belgium had one of the densest railway networks on earth, and light railways, the vicinal, ran out
          to almost every village.

  - id: u13-l2
    title: Coal country
    icon: pick
    sources:
      - title: "UNESCO, Major Mining Sites of Wallonia"
        url: https://whc.unesco.org/en/list/1344/
      - title: "Wikipedia, Grand-Hornu"
        url: https://en.wikipedia.org/wiki/Grand-Hornu
      - title: "Wikipedia, Belgian strike of 1886"
        url: https://en.wikipedia.org/wiki/Belgian_strike_of_1886
      - title: "Wikipedia, Belgian general strike of 1893"
        url: https://en.wikipedia.org/wiki/Belgian_general_strike_of_1893
      - title: "Van Gogh Museum, Van Gogh in the Borinage"
        url: https://www.vangoghmuseum.nl/en/art-and-stories/vincents-life-1853-1890/early-years
      - title: "Wikipedia, Constantin Meunier"
        url: https://en.wikipedia.org/wiki/Constantin_Meunier
      - title: "Wikipedia, Marcinelle mining disaster"
        url: https://en.wikipedia.org/wiki/Marcinelle_mining_disaster
      - title: "Wikipedia, Italian immigration to Belgium"
        url: https://en.wikipedia.org/wiki/Italian_immigration_to_Belgium
    exercises:
      - type: story
        title: The black country
        body: >-
          A seam of coal runs under the south of Belgium, from the Borinage near Mons through Charleroi to Liège.
          Around it grew collieries, ironworks and glassworks, and by the middle of the 1800s Belgium was the most
          industrial country on the continent. Men, women and children worked underground for long days and low
          pay. This is Grand-Hornu, a colliery that came with a whole town for its miners.
        visual: { kind: photo, photo: grand-hornu }
      - type: pin
        prompt: Pin Grand-Hornu, the colliery town near Mons.
        place: grand-hornu
        explain: >-
          Grand-Hornu is in the Borinage, west of Mons. Henri De Gorge built its workshops and hundreds of workers'
          houses from 1810 to 1830, with gardens, a school and a library. The pits closed in 1954.
      - type: choice
        prompt: Mining companies like Bois-du-Luc built whole villages for their workers, with a church, a school, shops and a hospital. What was in it for the company?
        visual: { kind: photo, photo: bois-du-luc }
        answer: 1
        options:
          - label: The houses were paid for by the state
            why: The companies built them with their own money.
          - label: Workers stayed close, stayed on, and could be watched
            why: >-
              Right. Skilled miners were hard to find. A house near the pit kept them from leaving, and a man who went
              on strike could lose his home as well as his job.
          - label: The law forbade miners to live in towns
            why: There was no such law.
          - label: The villages were built for visitors
            why: They were built for the miners and their families.
      - type: odd
        prompt: All four are old collieries, on the UNESCO World Heritage list since 2012. Which is the odd one out, and why?
        items:
          - { label: Grand-Hornu, photo: grand-hornu }
          - { label: Bois-du-Luc, photo: bois-du-luc }
          - { label: Bois du Cazier, photo: bois-du-cazier }
          - { label: Blegny, photo: blegny }
        answer: 3
        reasons:
          - It is near Liège; the other three are in Hainaut
          - It was never a coal mine
          - It is in the Netherlands
        reason: 0
        explain: >-
          Blegny, northeast of Liège, closed in 1980, the last colliery of its province, and visitors can still go
          down. Grand-Hornu, Bois-du-Luc and the Bois du Cazier lie along the coal seam in Hainaut, from Mons to
          Charleroi.
      - type: truemyth
        statement: Vincent van Gogh lived among the miners of the Borinage, and it was there that he decided to become an artist.
        visual: { kind: photo, photo: van-gogh-miners }
        answer: true
        explain: >-
          True. He came in 1879 as a lay preacher, gave away his clothes and slept on straw, and the church dismissed
          him for it. At Cuesmes, in the summer of 1880, he decided to become an artist. His first drawings were of
          the miners going to work.
      - type: choice
        prompt: The sculptor Constantin Meunier went down into the coal country in the 1880s, and from then on made statues like this hammerer. What was new about them?
        visual: { kind: photo, photo: meunier-hammerer }
        answer: 0
        options:
          - label: They made heroes of ordinary workers
            why: >-
              Right. Statues had shown kings, saints and gods. Meunier gave a puddler, a dock worker and a miner the
              dignity of an ancient statue, and his works stand in parks and museums across Europe.
          - label: They were the first statues cast in steel
            why: They were cast in bronze, as statues had been for centuries.
          - label: They were made by the miners themselves
            why: Meunier made them, after drawing the workers he met.
          - label: They were made for the mine owners' gardens
            why: Many were bought by the state and by museums.
      - type: scrub
        prompt: Drag the slider to the stage when strikes and riots swept the coal country.
        map: industry
        answer: [1886, 1913]
        explain: >-
          In March 1886 a meeting in Liège turned into strikes that spread to Charleroi. Glassworks were burned, the
          army fired on crowds, and several dozen people were killed. Parliament's inquiry led to the first laws on
          child labour and wages.
      - type: choice
        prompt: In April 1893 some 200,000 workers went on strike across Belgium. What did they want?
        visual: { kind: photo, photo: laermans-strike }
        answer: 2
        options:
          - label: An eight-hour day
            why: That came only in 1921.
          - label: The end of child labour
            why: The first limits on child labour had come in 1889.
          - label: The vote for every man
            why: >-
              Right. Until then only about one man in ten could vote. On 18 April parliament gave the vote to every man
              over 25, but with extra votes for owners and the educated. One man, one vote came in 1919, and women
              could vote for parliament from 1948.
          - label: Higher prices for coal
            why: The strikers were workers, not mine owners.
      - type: truemyth
        statement: Most of the 262 miners who died in the fire at the Bois du Cazier, at Marcinelle in 1956, were Belgians.
        visual: { kind: photo, photo: marcinelle-1956 }
        answer: false
        explain: >-
          Myth. 136 of the dead were Italians, and 95 were Belgians. The others came from ten more countries. A coal
          wagon sticking out of a lift cage tore through an oil pipe and power cables nearly a kilometre down, and
          the mine caught fire, on 8 August 1956. King Baudouin,
          in this picture, came to the pit. Only 13 men came up alive.
      - type: choice
        prompt: Why were so many Italians working in Belgian mines in 1956?
        visual: { kind: photo, photo: marcinelle-memorial }
        answer: 1
        options:
          - label: Belgian law forbade Belgians to work underground
            why: There was no such law; many Belgians still worked down the mines.
          - label: Italy sent workers, and Belgium paid in coal
            why: >-
              Right. In 1946 the two countries agreed that Italy would send 50,000 miners, and Belgium would sell Italy
              cheap coal for each one. Many families stayed, and today some 450,000 Belgians have Italian roots.
          - label: The mines belonged to Italian companies
            why: They were Belgian companies.
          - label: They had fled a war
            why: They came for work, after the Second World War.
      - type: cause
        prompt: Link each cause to its effect.
        pairs:
          - [Coal lies close under Hainaut and Liège, Belgium becomes the first industrial country on the continent]
          - [Wages are cut in the slump of the 1880s, The strikes and riots of March 1886]
          - [The general strike of April 1893, Every man gets a vote]
          - [Belgium is short of miners after the war, Italy sends workers in exchange for coal]
        explain: >-
          Coal made Wallonia rich for more than a century. The last colliery in Belgium closed in 1992, and the old
          industrial towns are still recovering.

  - id: u13-l3
    title: Leopold's Congo
    icon: chain
    note: >-
      This lesson tells how people in the Congo Free State were held hostage, mutilated and killed to force them to
      gather rubber. It does not show the photographs of victims.
    sources:
      - title: "Wikipedia, Congo Free State"
        url: https://en.wikipedia.org/wiki/Congo_Free_State
      - title: "Wikipedia, Atrocities in the Congo Free State"
        url: https://en.wikipedia.org/wiki/Atrocities_in_the_Congo_Free_State
      - title: "Wikipedia, Leopold II of Belgium"
        url: https://en.wikipedia.org/wiki/Leopold_II_of_Belgium
      - title: "Wikipedia, Henry Morton Stanley"
        url: https://en.wikipedia.org/wiki/Henry_Morton_Stanley
      - title: "Wikipedia, Casement Report"
        url: https://en.wikipedia.org/wiki/Casement_Report
      - title: "Wikipedia, Alice Seeley Harris"
        url: https://en.wikipedia.org/wiki/Alice_Seeley_Harris
      - title: "Adam Hochschild, King Leopold's Ghost (1998)"
        url: https://en.wikipedia.org/wiki/King_Leopold%27s_Ghost
    exercises:
      - type: story
        title: A colony of his own
        body: >-
          The Congo basin, at the heart of Africa, was home to hundreds of peoples and to old kingdoms such as the
          Kongo, the Kuba, the Luba and the Lunda. Belgium had no wish for a colony, but its king did. Press play to
          see what Leopold II made of the Congo.
        visual: { kind: time-map, map: congo, year: 1876 }
      - type: who
        photo: leopold-ii-bassano
        clues:
          - I was born in Brussels in 1835, and became king at thirty.
          - In 1876 I invited explorers to my palace, and said I wanted to bring civilisation to Africa and end the slave trade there.
          - The great powers let me have a land 76 times the size of my kingdom, as my own property. I never went there.
          - Its profits paid for arches, parks and galleries in Brussels and Ostend.
        options: [Leopold II, Leopold I, Albert I, Baudouin]
        answer: 0
        explain: >-
          Leopold II, the second king of the Belgians, who reigned from 1865 to 1909. He called his colony the Congo
          Free State. It was free only in name.
      - type: choice
        prompt: Wipe from 1877 to 1885. Who owns the new state on the map?
        visual: { kind: compare, map: congo, years: [1877, 1885] }
        answer: 1
        options:
          - label: Belgium
            why: Belgium's parliament allowed its king to rule it, but it was not Belgium's.
          - label: King Leopold II himself
            why: >-
              Right. From 1 July 1885 the Congo Free State was the king's personal property, accepted by the powers
              that met in Berlin in 1884 and 1885. Its capital was Boma, near the mouth of the river.
          - label: The kingdom of Kongo
            why: The old kingdom's lands were split between the Free State and Portuguese Angola.
          - label: Britain and France together
            why: They held colonies around it, but let Leopold have the Congo, as a buffer between them.
      - type: choice
        prompt: From 1879 to 1884 the explorer Henry Morton Stanley worked for Leopold in the Congo. What did he do for him?
        visual: { kind: photo, photo: stanley }
        answer: 2
        options:
          - label: He mapped the river for the British navy
            why: He was working for the king of the Belgians, not for Britain.
          - label: He fought the slave traders of Zanzibar
            why: That came later, and was done by the Free State's army.
          - label: He built stations and a road, and got chiefs to sign away their land
            why: >-
              Right. Stanley built a road around the rapids and posts along the river, and collected hundreds of
              treaties. Most of the chiefs could not read them, and could not have known that they were giving away
              their land and their labour.
          - label: He ran the first railway
            why: The railway around the rapids opened in 1898.
      - type: scrub
        prompt: Drag the slider to a stage when the Free State forced villages to deliver rubber.
        map: congo
        answer: [1892, 1907]
        explain: >-
          From 1891 and 1892 the state claimed all "vacant" land and everything it produced, and gave huge areas to
          companies such as ABIR. The bicycle and the car had made rubber precious, and each village had to bring in
          its quota of wild rubber from the forest.
      - type: choice
        prompt: Soldiers of the Force Publique were ordered to account for every bullet they fired, so that none were wasted on hunting. What were they made to bring back?
        visual: { kind: photo, photo: boma-1899 }
        answer: 1
        options:
          - label: The empty cartridges
            why: Cartridges were not what officers asked for.
          - label: The hands of the people they had shot
            why: >-
              Right. Soldiers cut off hands as proof, and sometimes from the living too. Women and children were held
              hostage until the men came back with enough rubber, and villages that fell short were burned.
          - label: A written report signed by a chief
            why: Few chiefs could write, and the officers wanted proof they could see.
          - label: Ivory
            why: Ivory was traded, but it was not the proof asked for.
      - type: choice
        prompt: Historians still argue about how many people died in the Free State, from killings, hunger, flight and disease. Why is it so hard to know?
        visual: { kind: photo, photo: red-rubber }
        answer: 0
        options:
          - label: No one had counted the people before, and the state's papers were burned
            why: >-
              Right. There was no census before 1885, and in 1908 Leopold had the Free State's archives burned. Some
              historians think the population fell by millions, perhaps by as much as half; others argue for less.
              Nobody doubts that it was a catastrophe.
          - label: Belgium has never allowed historians into its archives
            why: Belgian archives are open; the trouble is that the Free State's own papers were destroyed.
          - label: The Congo was too big to visit
            why: Missionaries, officials and traders travelled all over it.
          - label: Nobody died, so there is nothing to count
            why: The killings were confirmed by Leopold's own commission in 1905.
      - type: truemyth
        statement: Leopold's Congo was mocked in British cartoons while he was still king.
        visual: { kind: photo, photo: punch-rubber-coils }
        answer: true
        explain: >-
          True. This cartoon, "In the Rubber Coils", appeared in Punch in 1906. It shows a Congolese man caught by a
          snake with Leopold's head. By then the Free State was a scandal around the world.
      - type: odd
        prompt: Three of these people exposed what was happening in the Free State. Which is the odd one out, and why?
        items:
          - { label: Roger Casement, photo: casement }
          - { label: E. D. Morel, photo: morel }
          - { label: Alice Seeley Harris, photo: alice-seeley-harris }
          - { label: Henry Morton Stanley, photo: stanley }
        answer: 3
        reasons:
          - He worked for Leopold; the other three campaigned against him
          - He never went to Africa
          - He was a Belgian minister
        reason: 0
        explain: >-
          Roger Casement, the British consul, wrote the report of 1904 that confirmed the killings. E. D. Morel, a
          shipping clerk who noticed that ships came from the Congo full of rubber and went back carrying guns,
          founded the Congo Reform Association. Alice Seeley Harris photographed the victims, and her pictures were
          shown at hundreds of meetings in Britain and America.
      - type: order
        prompt: Put these in order.
        items:
          - { label: Leopold's geographical conference in Brussels, year: 1876, when: '1876' }
          - { label: The Congo Free State begins, year: 1885, when: '1885' }
          - { label: The railway around the rapids opens, year: 1898, when: '1898' }
          - { label: Casement's report, year: 1904, when: '1904' }
          - { label: Belgium takes over the colony, year: 1908, when: '1908' }
        explain: >-
          Twenty-three years of the king's rule. Leopold died a year after he lost the colony, in December 1909,
          and crowds booed his funeral procession.

  - id: u13-l4
    title: The Belgian Congo
    icon: cross
    note: >-
      This lesson tells of forced labour in the Belgian Congo, and of Congolese people put on show in Belgium at
      exhibitions in 1897 and 1958.
    sources:
      - title: "Wikipedia, Belgian Congo"
        url: https://en.wikipedia.org/wiki/Belgian_Congo
      - title: "Wikipedia, Ruanda-Urundi"
        url: https://en.wikipedia.org/wiki/Ruanda-Urundi
      - title: "Wikipedia, East African campaign (World War I)"
        url: https://en.wikipedia.org/wiki/East_African_campaign_(World_War_I)
      - title: "Wikipedia, Simon Kimbangu"
        url: https://en.wikipedia.org/wiki/Simon_Kimbangu
      - title: "Wikipedia, Shinkolobwe"
        url: https://en.wikipedia.org/wiki/Shinkolobwe
      - title: "Wikipedia, Expo 58"
        url: https://en.wikipedia.org/wiki/Expo_58
      - title: "Wikipedia, Human zoo"
        url: https://en.wikipedia.org/wiki/Human_zoo
