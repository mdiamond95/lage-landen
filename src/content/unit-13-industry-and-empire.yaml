        url: https://www.africamuseum.be/en/about_us/history_renovation
    exercises:
      - type: story
        title: From the king to the country
        body: >-
          In 1908, under pressure from abroad, Belgium took the Congo from its king. Forced rubber collecting was
          wound down, but the Congolese still had no say in how they were ruled. For fifty years the colony was run
          by the state, the Catholic missions and the big companies, the "colonial trinity".
        visual: { kind: time-map, map: congo, year: 1908 }
      - type: gap
        prompt: Before he handed over the Congo, Leopold had the Free State's archives burned for eight days. Fill the gap in what he is said to have told an aide.
        quote: I will give them my Congo, but they have no right to know what I ___ there.
        source: Leopold II in 1908, as told by his aide Gustave Stinglhamber (translated from the French)
        visual: { kind: photo, photo: leopold-statue-brussels }
        options: [did, saw, spent, built]
        answer: 0
        explain: >-
          The furnaces of the Free State offices in Brussels burned for days. Much of what we know comes from the
          papers of missionaries, consuls and the king's own commission of inquiry.
      - type: choice
        prompt: Wipe from 1908 to 1923. What else is Belgium ruling by 1923?
        visual: { kind: compare, map: congo, years: [1908, 1923] }
        answer: 2
        options:
          - label: Angola
            why: Angola, to the south, stayed Portuguese until 1975.
          - label: The French Congo
            why: The land north of the river stayed French.
          - label: Ruanda-Urundi, today Rwanda and Burundi
            why: >-
              Right. Belgian troops took it from German East Africa in 1916, and the League of Nations gave it to
              Belgium to run as a mandate. It became Rwanda and Burundi in 1962.
          - label: Nothing; the map does not change
            why: Look east of the great lakes.
      - type: choice
        prompt: In September 1916 Congolese soldiers of the Force Publique marched into Tabora, after a long campaign in the First World War. Where is Tabora?
        visual: { kind: photo, photo: tabora-1916 }
        answer: 1
        options:
          - label: In Belgium, near the Yser front
            why: Congolese soldiers fought in Africa; a few Congolese volunteers fought in Belgium.
          - label: In German East Africa, today Tanzania
            why: >-
              Right. While Belgium itself was occupied, its colonial army beat the Germans in East Africa. Tens of
              thousands of Congolese carriers were forced to carry its supplies, and thousands of them died.
          - label: In the Congo, on the river
            why: It was outside the Congo, to the east of Lake Tanganyika.
          - label: In South Africa
            why: Much further north than that.
      - type: who
        photo: kimbangu
        clues:
          - I was born in the lower Congo in 1887 or 1889, and baptised by Baptist missionaries.
          - In 1921 crowds came to my village of Nkamba, saying I healed the sick.
          - The colonial authorities sentenced me to death. King Albert changed it to prison for life.
          - I died in prison in Élisabethville in 1951. The church named after me now has millions of members.
        options: [Simon Kimbangu, Patrice Lumumba, Joseph Kasa-Vubu, Paul Panda Farnana]
        answer: 0
        explain: >-
          Simon Kimbangu. He preached for only a few months, but the colony saw an African prophet with a following
          as a threat, and sent thousands of his followers into exile in other parts of the colony. The Kimbanguist Church is one of the largest
          churches founded in Africa.
      - type: sort
        prompt: The colony was run by a "colonial trinity". Sort each into the state, the missions or the companies.
        visual: { kind: photo, photo: congo-classroom }
        groups: [The state, The missions, The companies]
        items:
          - { label: The governor-general in Léopoldville, group: 0 }
          - { label: The Force Publique, group: 0 }
          - { label: Most of the primary schools, group: 1 }
          - { label: 'Lovanium, the first university, opened in 1954', group: 1 }
          - { label: The Union Minière copper mines of Katanga, group: 2 }
          - { label: The palm oil plantations of Lever, group: 2 }
        explain: >-
          The state left most schooling to the Catholic missions, which taught in local languages and kept
          secondary school for the few. At independence in 1960 only a handful of Congolese had a university degree.
      - type: choice
        prompt: Copper made the Union Minière one of the richest companies in the world. In the early years, how did the mines of Katanga find their workers?
        visual: { kind: photo, photo: kisanga-workers }
        answer: 3
        options:
          - label: They paid more than any job in Europe
            why: Wages were low, and many workers died of disease in the camps.
          - label: Workers came from Belgium
            why: Belgians ran the mines; the miners were Africans.
          - label: The mines used machines and needed few workers
            why: The mines needed tens of thousands of men.
          - label: Recruiters brought in men from far away, often under pressure from chiefs and officials
            why: >-
              Right. Men were recruited from across the Congo and from Ruanda-Urundi, like the workers in this picture
              of the late 1920s. Forced labour, for roads, crops and carrying, went on in the colony until the 1950s.
      - type: truemyth
        statement: Most of the uranium for the first American atomic bombs came from a mine in the Belgian Congo.
        visual: { kind: photo, photo: shinkolobwe }
        answer: true
        explain: >-
          True. The Shinkolobwe mine in Katanga had the richest uranium ore known. In 1940 the head of the Union
          Minière, Edgar Sengier, had more than a thousand tonnes of it shipped to New York, out of the reach of the
          Germans, and sold it to the Manhattan Project in 1942.
      - type: truemyth
        statement: In 1897 Congolese men, women and children were put on show in a park at Tervuren, near Brussels, and seven of them died there.
        visual: { kind: photo, photo: tervuren-1897 }
        answer: true
        explain: >-
          True. For the world's fair of 1897 a "Congolese village" was built in the park, and more than a million
          visitors came to stare. Seven of the Congolese died of cold and illness, and are buried in the churchyard at
          Tervuren. The exhibition grew into the Museum of the Belgian Congo.
      - type: choice
        prompt: At Expo 58 in Brussels the colony had grand pavilions, and again a "Congolese village" with people living in it on show. What happened in July 1958?
        visual: { kind: photo, photo: expo58-congo }
        answer: 0
        options:
          - label: The Congolese protested at being stared at and insulted, and went home
            why: >-
              Right. Visitors threw coins and bananas at them, and some shouted at them as if they were animals. The
              village was closed. For many Congolese who came to the fair, it was the first time they met Congolese
              from other regions, and some went home talking of independence.
          - label: The village won a prize for its architecture
            why: The village was not admired; it was a scandal.
          - label: King Baudouin moved into it for a week
            why: He did not.
          - label: It was moved to the Congo
            why: It was simply closed.

  - id: u13-l5
    title: Independence and Lumumba
    icon: flag
    note: >-
      This lesson ends with the murder of Patrice Lumumba, the Congo's first prime minister, in January 1961.
    sources:
      - title: "Wikipedia, Patrice Lumumba"
        url: https://en.wikipedia.org/wiki/Patrice_Lumumba
      - title: "Wikipedia, Belgo-Congolese Round Table Conference"
        url: https://en.wikipedia.org/wiki/Belgo-Congolese_Round_Table_Conference
      - title: "Wikipedia, Congo Crisis"
        url: https://en.wikipedia.org/wiki/Congo_Crisis
      - title: "Wikipedia, Assassination of Patrice Lumumba"
        url: https://en.wikipedia.org/wiki/Assassination_of_Patrice_Lumumba
      - title: "Lumumba's speech of 30 June 1960, English translation (Marxists Internet Archive)"
        url: https://www.marxists.org/subject/africa/lumumba/1960/06/independence.htm
      - title: "Belgian Chamber of Representatives, the Lumumba inquiry, 2001 (in French and Dutch)"
        url: https://www.lachambre.be/FLWB/PDF/50/0312/50K0312006.pdf
    exercises:
      - type: story
        title: Dipenda
        body: >-
          On 4 January 1959 a banned meeting in Léopoldville turned into riots. The army fired, and officially 49
          Africans were killed; others put the toll far higher. Nine days later King Baudouin promised independence,
          "without fatal delay but also without thoughtless haste". It came much faster than anyone in Brussels had
          planned.
        visual: { kind: time-map, map: congo, year: 1959 }
      - type: who
        photo: lumumba-brussels
        clues:
          - I was born in Kasai in 1925, and worked as a postal clerk in Stanleyville.
          - In 1958 I founded a party for the whole Congo, not for one people or region.
          - Arrested after riots in 1959, I was let out of prison to fly to the talks in Brussels.
          - On independence day I answered the king with a speech that shocked Belgium.
        options: [Patrice Lumumba, Joseph Kasa-Vubu, Moïse Tshombe, Joseph-Désiré Mobutu]
        answer: 0
        explain: >-
          Patrice Lumumba, leader of the Mouvement National Congolais. His party won the most seats in the elections
          of May 1960, and he became the Congo's first prime minister at 34.
      - type: choice
        prompt: At the Round Table in Brussels in January 1960, Belgium and the Congolese leaders fixed the day of independence. How far off was it?
        visual: { kind: photo, photo: round-table }
        answer: 1
        options:
          - label: Five years
            why: Belgium had hoped for a slow handover, but the Congolese leaders stood together and refused.
          - label: Five months, on 30 June 1960
            why: >-
              Right. The date was agreed on 27 January 1960. A country of some 14 million people had to hold
              elections, form a government and take over an army and a civil service run by Belgians, in five months.
          - label: Five weeks
            why: Not quite so fast.
          - label: Thirty years
            why: A Belgian professor had suggested thirty years in 1955, which now seemed far too long.
      - type: voices
        prompt: On 30 June 1960, in Léopoldville, King Baudouin and Patrice Lumumba spoke at the independence ceremony. Read them side by side. On what do they disagree most?
        voices:
          - who: King Baudouin
            when: 30 June 1960, at the Palace of the Nation in Léopoldville (translated from the French)
            text: >-
              The independence of the Congo is the crowning of the work conceived by the genius of King Leopold II,
              undertaken by him with tenacious courage and continued by Belgium with perseverance.
            photo: baudouin-1960
          - who: Patrice Lumumba, prime minister
            when: 30 June 1960, at the same ceremony, unannounced (translated from the French)
            text: >-
              No Congolese worthy of the name will ever be able to forget that it was by fighting that it has been won,
              a day-to-day fight, an ardent and idealistic fight, a fight in which we were spared neither privation nor
              suffering, and for which we gave our strength and our blood.
            photo: lumumba-signs
        options:
          - Whether independence was a gift from Belgium or won by the Congolese
          - Whether the Congo should have a king
          - Whether the capital should stay in Léopoldville
          - Whether Belgium should keep its soldiers there
        answer: 0
        explain: >-
          The king praised Leopold II and warned the Congolese not to spoil the future with hasty reforms. Lumumba,
          who was not on the programme, spoke of "the humiliating slavery that was imposed on us by force". Belgian
          ministers were furious.
      - type: scrub
        prompt: Drag the slider to the stage when the Congo became independent and Katanga broke away.
        map: congo
        answer: [1960, 1961]
        explain: >-
          Within a week of independence the army mutinied against its Belgian officers, and Belgium sent in
          paratroopers. On 11 July Katanga, the copper province, declared itself independent.
      - type: choice
        prompt: Moïse Tshombe led Katanga's breakaway in July 1960. Who backed him?
        visual: { kind: photo, photo: tshombe }
        answer: 2
        options:
          - label: The United Nations
            why: The UN sent troops to end the breakaway, which they did in January 1963.
          - label: Lumumba's government
            why: Lumumba's government fought to keep Katanga in the Congo.
          - label: Belgian officers and the Union Minière
            why: >-
              Right. Belgian officers trained and led Katanga's army, and the copper company paid its taxes to
              Tshombe instead of to the government in Léopoldville.
          - label: The Soviet Union
            why: Lumumba asked the Soviet Union for help, not Tshombe.
      - type: choice
        prompt: In September 1960 the army chief of staff, Joseph-Désiré Mobutu, announced he was "neutralising" the politicians. What became of him?
        visual: { kind: photo, photo: mobutu-1960 }
        answer: 1
        options:
          - label: He was killed in the fighting
            why: He lived until 1997.
          - label: He seized power in 1965 and ruled for 32 years
            why: >-
              Right. Backed by the United States and Belgium in the Cold War, Mobutu renamed the country Zaire in 1971
              and grew immensely rich while it grew poor. He was overthrown in 1997.
          - label: He went into exile in Belgium
            why: Not until he was overthrown, decades later; he died in exile in Morocco.
          - label: He gave power back to Lumumba
            why: He had Lumumba arrested.
      - type: truemyth
        statement: Lumumba was shot in Katanga in January 1961, with Belgian officers present.
        visual: { kind: time-map, map: congo, year: 1961 }
        answer: true
        explain: >-
          True. Lumumba and two of his ministers, Maurice Mpolo and Joseph Okito, were flown to Katanga and shot on 17
          January 1961 by a firing squad under a Belgian officer. A Belgian policeman later dug up the bodies and
          dissolved them in acid. In 2001 an inquiry of the Belgian parliament found that Belgium bore a "moral
          responsibility" for the murder.
      - type: order
        prompt: Put these in order.
        items:
          - { label: Lumumba founds the MNC, year: 1958, when: '1958' }
          - { label: The riots in Léopoldville, year: 1959, when: '1959' }
          - { label: Independence, year: 1960, when: '1960' }
          - { label: Lumumba is murdered, year: 1961, when: '1961' }
          - { label: Mobutu takes power, year: 1965, when: '1965' }
        explain: >-
          Seven years from the first national party to a dictatorship that lasted until 1997.

  - id: u13-l6
    title: Statues, museums and apologies
    icon: candle
    sources:
      - title: "Wikipedia, Equestrian statue of Leopold II, Ostend"
        url: https://en.wikipedia.org/wiki/Equestrian_statue_of_Leopold_II,_Ostend
      - title: "Wikipedia, List of statues of Leopold II of Belgium"
        url: https://en.wikipedia.org/wiki/List_of_statues_of_Leopold_II_of_Belgium
      - title: "Wikipedia, Royal Museum for Central Africa"
        url: https://en.wikipedia.org/wiki/Royal_Museum_for_Central_Africa
      - title: "Brussels Times, Belgium acknowledges its role in the murder of Lumumba (5 February 2002)"
        url: https://www.brusselstimes.com/belgium-unlocked/363758/today-in-history-belgium-acknowledges-role-in-assassinating-congolese-leader-lumumba
      - title: "Belga, Lumumba's remains returned: De Croo apologises (20 June 2022)"
        url: https://www.belganewsagency.eu/lumumbas-remains-returned-belgian-prime-minister-de-croo-apologises
      - title: "VRT NWS, Belgium returns Mr Lumumba's tooth to Congo (20 June 2022)"
        url: https://www.vrt.be/vrtnws/en/2022/06/20/belgium-returns-mr-lumumbas-tooth-to-congo/
    exercises:
      - type: story
        title: Everything passes, except the past
        body: >-
          For a long time Belgian schoolbooks praised Leopold II as the builder king who brought civilisation to the
          Congo. Since the 1990s, books, museums and protests have made the country face what happened there. These
          words hang in the AfricaMuseum at Tervuren.
        visual: { kind: photo, photo: africamuseum-past }
      - type: truemyth
        statement: In 2004 activists sawed off the hand of one of the African figures on Leopold II's statue in Ostend.
        visual: { kind: photo, photo: leopold-statue-ostend }
        answer: true
        explain: >-
          True. A group calling itself De Stoete Ostendenoare cut off the bronze hand of one of the kneeling Congolese,
          as a reminder of the hands cut off for rubber. They offered to return it if a truthful sign was put up by the
          statue. Years later the hand was handed over at the AfricaMuseum.
      - type: choice
        prompt: In June 2020 the town of Ekeren, near Antwerp, took down this statue of Leopold II after it was set on fire. What set off the wave of protests against his statues that summer?
        visual: { kind: photo, photo: leopold-statue-ekeren }
        answer: 1
        options:
          - label: The sixtieth anniversary of independence
            why: That fell on 30 June 2020, but the protests had started weeks earlier.
          - label: The murder of George Floyd in the United States, and the Black Lives Matter protests
            why: >-
              Right. About 10,000 people marched in Brussels on 7 June 2020. Statues of Leopold II were painted red in
              Brussels, Ghent and Antwerp, and some were taken down. A petition to remove all of them gathered tens of
              thousands of names.
          - label: A new law banning colonial statues
            why: No such law was passed; each town decided for itself.
          - label: A visit by the Congolese president
            why: The protests did not start with a visit.
      - type: pin
        prompt: Pin Tervuren, the home of the AfricaMuseum.
        place: tervuren
        explain: >-
          Tervuren is just east of Brussels, where Leopold II built the Palace of the Colonies for the fair of 1897.
          The museum that grew out of it opened in 1910.
      - type: choice
        prompt: The AfricaMuseum at Tervuren reopened in December 2018, after five years of work. What changed most?
        visual: { kind: photo, photo: africamuseum }
        answer: 3
        options:
          - label: It moved to Kinshasa
            why: It is still at Tervuren.
          - label: It now shows only the animals of Africa
            why: It still shows the history and cultures of Central Africa, as well as its nature.
          - label: It gave every object back to the Congo
            why: Returning objects is being discussed, and a few have been returned, but most are still there.
          - label: It tells the colony's story critically, with African voices
            why: >-
              Right. Africans living in Belgium helped make the new displays. The old statues praising the colony, of
              Belgians bringing civilisation, were moved to a room of their own, with a comment beside them.
      - type: gap
        prompt: In 2001 an inquiry found that Belgium bore a moral responsibility for the murder of Lumumba. Fill the gap in what the foreign minister, Louis Michel, then told parliament.
        quote: The government believes it should offer the family of Patrice Lumumba and the Congolese people its profound and sincere regrets and its ___ for the pain inflicted upon them.
        source: Louis Michel, foreign minister, in the Chamber of Representatives, 5 February 2002 (translated from the French)
        visual: { kind: photo, photo: lumumba-mausoleum }
        options: [apologies, thanks, help, money]
        answer: 0
        explain: >-
          The government went further than the inquiry, saying that members of the Belgian government of the time
          bore "an irrefutable part of the responsibility". Lumumba's widow, Pauline Opango, watched it on television.
      - type: voices
        prompt: Read these side by side. Which of them says sorry?
        voices:
          - who: King Philippe
            when: 30 June 2020, in a letter to the Congolese president, Félix Tshisekedi
            text: >-
              I wish to express my deepest regrets for these wounds of the past, the pain of which is today revived by
              the discrimination still all too present in our societies.
            photo: philippe
          - who: King Philippe
            when: 8 June 2022, in the parliament in Kinshasa
            text: >-
              This regime was one of unequal relations, unjustifiable in itself, marked by paternalism, discrimination
              and racism. It led to violence and humiliation.
          - who: Alexander De Croo, prime minister
            when: 20 June 2022, at the Egmont Palace in Brussels, with Lumumba's family
            text: >-
              I would like, in the presence of his family, to present in my turn the apologies of the Belgian
              government.
        options:
          - Only the prime minister, for the murder of Lumumba
          - Only the king, for the whole colonial past
          - All three of them
          - None of them
        answer: 0
        explain: >-
          The king expressed regret and condemned the colonial system, but he did not apologise; a formal apology
          could open the way to claims for damages. De Croo apologised for the Belgian government's part in Lumumba's
          death, as his own government had in 2002.
      - type: choice
        prompt: On 30 June 2022 something was buried in this memorial in Kinshasa, after Belgium handed it to Lumumba's family. What was it?
        visual: { kind: photo, photo: lumumba-mausoleum }
        answer: 2
        options:
          - label: The flag of independence day
            why: It was something far more personal.
          - label: The letter Lumumba wrote to his wife from prison
            why: That letter is famous, but it was not what Belgium returned.
          - label: A tooth, all that was left of him
            why: >-
              Right. The policeman who destroyed the bodies kept a tooth, and boasted of it decades later. Belgian
              courts seized it from his daughter, and in 2022 it was handed to Lumumba's children at the Egmont
              Palace in Brussels, and taken home.
          - label: His statue from Brussels
            why: Brussels named a square after him in 2018; nothing was moved from it.
      - type: choice
        prompt: In 2020 Belgium's parliament set up a special commission on the colonial past, with historians and witnesses. How did it end, in December 2022?
        visual: { kind: photo, photo: leopold-statue-brussels }
        answer: 1
        options:
          - label: With a national day of remembrance
            why: That was proposed, but nothing was agreed.
          - label: Without agreement, over whether to apologise
            why: >-
              Right. After two and a half years of hearings, the parties could not agree on its recommendations,
              above all on a formal apology, and the commission ended without a report being adopted. The statue of
              Leopold II on the Place du Trône in Brussels still stands.
          - label: With all of Leopold's statues taken down
            why: Most of them are still standing, some with a sign added beside them.
          - label: With payments to every Congolese family
            why: No reparations were agreed.
