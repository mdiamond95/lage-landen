    exercises:
      - type: story
        title: A prince from Ghent
        body: >-
          On 24 February 1500 a boy was born in Ghent: Charles, grandson of Mary of Burgundy and Maximilian. By
          luck and a string of deaths, he inherited the Low Countries, Spain, its lands in America and Italy, and
          Austria. Elected emperor in 1519, he was the most powerful ruler in Europe, and he spoke French as his
          first language.
        visual: { kind: photo, photo: charles-v-young }
      - type: choice
        prompt: Charles inherited Spain through his mother. Who was she?
        visual: { kind: family-tree, tree: burgundy, hide: joanna }
        answer: 0
        options:
          - label: Joanna of Castile
            why: >-
              Right. Joanna was the daughter of Ferdinand and Isabella, the rulers who sent Columbus west. After her
              husband Philip died in 1506, she was declared unfit to rule and kept shut away.
          - label: Mary of Burgundy
            why: Mary was Charles's grandmother, on his father's side.
          - label: Margaret of Austria
            why: Margaret was his aunt, who brought him up in Mechelen.
          - label: Isabella of Portugal
            why: Isabella of Portugal was Philip the Good's wife, Charles's great-great-grandmother. Charles did marry another Isabella of Portugal, in 1526.
      - type: who
        photo: margaret-austria
        clues:
          - My parents were Maximilian of Austria and Mary of Burgundy.
          - I was promised to a French king as a child, and widowed twice before I turned 25.
          - I ruled the Netherlands for many years from my palace in Mechelen.
          - I brought up my nephew, the future Charles V.
        options: [Margaret of Austria, Mary of Burgundy, Joanna of Castile, Jacqueline of Bavaria]
        answer: 0
        explain: >-
          Margaret of Austria. Her court in Mechelen was full of books, music and paintings. Bernard van Orley
          painted her in a widow's white headdress.
      - type: pin
        prompt: Charles grew up at his aunt Margaret's court. Pin Mechelen.
        place: mechelen
        fullKm: 10
        okKm: 25
        explain: Mechelen lies between Brussels and Antwerp. For a few decades it was the capital of the Netherlands.
      - type: scrub
        prompt: Charles V took the far north of the Netherlands bit by bit. Drag the slider to a year when Friesland is his.
        map: burgundy
        start: 1500
        answer: [1524, 1555]
        explain: >-
          Friesland accepted Charles in 1524 after years of war. Utrecht and Overijssel followed in 1528,
          Groningen and Drenthe in 1536, and Guelders in 1543.
      - type: truemyth
        statement: After Ghent refused a tax and rebelled in 1539, Charles made its leaders beg for mercy with nooses around their necks.
        visual: { kind: map, highlight: [], rivers: [Schelde], pins: [ghent] }
        answer: true
        explain: >-
          In 1540 they had to walk in white shirts with a noose around the neck, and the city lost its old rights.
          People from Ghent are still nicknamed stroppendragers, noose-bearers, and the noose has become a proud
          symbol of the city.
      - type: truemyth
        statement: The Seventeen Provinces were often drawn as a lion on maps, the Leo Belgicus.
        visual: { kind: photo, photo: leo-belgicus }
        answer: true
        explain: >-
          The first lion map was printed in 1583. The lion was on the coats of arms of many of the provinces, so
          it stood for them all.
      - type: truemyth
        statement: Charles V said, "I speak Spanish to God, Italian to women, French to men and German to my horse."
        visual: { kind: photo, photo: charles-v-titian }
        answer: false
        explain: >-
          No one has found the saying in any source from his lifetime. It turns up in many versions with the
          languages swapped around, and it is pinned on other rulers too. His own first language was French.
      - type: choice
        prompt: In Brussels on 25 October 1555, a tired Charles V gave up the Netherlands to his son. On whose shoulder did he lean?
        visual: { kind: photo, photo: abdication }
        answer: 0
        options:
          - label: The young William of Orange
            why: >-
              Right. William was 22 and a favourite at court. Within a few years he would lead the revolt against
              Charles's son, Philip II. That is the story of the next unit.
          - label: Philip II
            why: Philip received the lands that day, but Charles leaned on a young nobleman.
          - label: Erasmus
            why: Erasmus had died in 1536.
          - label: Margaret of Austria
            why: Margaret had died in 1530.
      - type: order
        prompt: Put these in order, oldest first.
        items:
          - { label: Charles is born in Ghent, year: 1500, when: '1500' }
          - { label: He becomes king of Spain, year: 1516, when: '1516' }
          - { label: He is elected emperor, year: 1519, when: '1519' }
          - { label: Ghent is humbled, year: 1540, when: '1540' }
          - { label: The Pragmatic Sanction, year: 1549, when: '1549' }
          - { label: He gives up the Netherlands in Brussels, year: 1555, when: '1555' }
        explain: Charles was the last ruler to hold all of the Low Countries together. Within 30 years of his abdication they split apart.
      - type: match
        prompt: Match each land to the year it joined Charles V's Netherlands.
        pairs:
          - [Friesland, '1524']
          - [Utrecht and Overijssel, '1528']
          - [Groningen and Drenthe, '1536']
          - [Guelders, '1543']
      - type: choice
        prompt: Drag the line to wipe from 1384, when Burgundy held only Flanders, to the Seventeen Provinces of 1549. How did most of these lands come to Burgundy and the Habsburgs?
        visual: { kind: compare, map: burgundy, years: [1384, 1549] }
        answer: 0
        options:
          - label: By marriage, inheritance and purchase, more than by war
            why: >-
              Right. Philip the Good bought Namur, inherited Brabant and Limburg from a cousin, and made his cousin
              Jacqueline hand over Holland, Zeeland and Hainaut. Charles V took the north-east last, partly by war.
          - label: By great battles against France
            why: The wars with France were fought over Burgundy itself and Artois, not most of these lands.
          - label: By a vote of their towns
            why: The towns had to swear to each new prince, but they did not choose him.
          - label: As a gift from the pope
            why: The pope gave no lands here.
      - type: odd
        prompt: Which painting is the odd one out?
        items:
          - { label: The Ghent Altarpiece, photo: ghent-altarpiece }
          - { label: The Arnolfini Portrait, photo: arnolfini }
          - { label: The Descent from the Cross, photo: descent-cross }
          - { label: Charles V at Mühlberg, photo: charles-v-titian }
        answer: 3
        reasons:
          - It was painted by an Italian, more than a century later
          - It is painted in oils
          - It hangs in the Prado in Madrid
        reason: 0
        explain: >-
          Titian of Venice painted Charles V in 1548. The other three are by the Flemish Primitives, painted in the
          1430s. All four are oil paintings, and the Descent from the Cross hangs in the Prado too.
