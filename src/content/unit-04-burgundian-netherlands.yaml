    exercises:
      - type: story
        title: Market of the world, again
        body: >-
          Bruges's waterway to the sea silted up, and the town quarrelled with its rulers. Trade moved to Antwerp,
          on the deep Scheldt. Portuguese ships brought pepper from India, German merchants brought silver and copper, and
          English cloth came to be finished and dyed. By 1560 about 100,000 people lived in Antwerp.
        visual: { kind: map, highlight: [], rivers: [Schelde], pins: [antwerp, bruges] }
      - type: pin
        prompt: Pin Antwerp, the great port of the 1500s.
        place: antwerp
        explain: Antwerp lies on the Scheldt, about 80 km from the open sea, yet deep enough for the biggest ships of the day.
      - type: choice
        prompt: Antwerp's Bourse, built from 1531, was the first building made just for this. What?
        visual: { kind: photo, photo: antwerp-bourse }
        answer: 2
        options:
          - label: A royal palace
            why: It was built by the city for merchants, not for a ruler.
          - label: A cloth hall
            why: Cloth halls sold one product. This building was for every kind of deal.
          - label: Trading, for merchants of every nation
            why: >-
              Right. Merchants met in its courtyard to deal in goods, bills and loans. Later exchanges in London
              and Amsterdam copied it.
          - label: A church for foreign sailors
            why: It was a place of business, not worship.
      - type: gap
        prompt: The Bourse of 1531 was open to foreigners as well as Antwerp's own traders. Fill the gap in its Latin motto.
        quote: In usum negotiatorum cuiuscumque nationis ac linguae, for the use of merchants of every nation and ___
        source: Motto of the Antwerp Bourse, 1531, in Latin with an English rendering
        visual: { kind: photo, photo: antwerp-bourse }
        options: [tongue, faith, guild, city]
        answer: 0
        explain: >-
          Lingua means tongue, or language. Italians, Portuguese, Germans and English all traded here. The
          building burned in 1583 and again in 1858, and the motto on today's Bourse is a restoration.
      - type: choice
        prompt: Read the chart. How did the number of people in Antwerp change between 1500 and 1568?
        visual: { kind: chart, chart: antwerp-amsterdam, until: 1568 }
        answer: 1
        options:
          - label: It stayed about the same
            why: Follow the red line. It climbs steeply.
          - label: It roughly doubled
            why: >-
              Right. From about 46,000 around 1500 to about 100,000 at a count in 1568. Antwerp was one of the
              biggest cities north of the Alps.
          - label: It halved
            why: Antwerp's fall came later, after the war reached it.
          - label: It grew ten times over
            why: That would be nearly half a million people. Antwerp roughly doubled.
      - type: truemyth
        statement: In the 1500s, pepper from India reached Antwerp on Portuguese ships.
        visual: { kind: map, highlight: [], rivers: [Schelde], pins: [antwerp] }
        answer: true
        explain: >-
          After Vasco da Gama sailed around Africa to India, the king of Portugal sold his spices through Antwerp.
          The first cargo of pepper arrived in 1501.
      - type: choice
        prompt: Finished in 1521, this tower is 123 m tall, the tallest church tower in the Benelux. Where is it?
        visual: { kind: photo, photo: antwerp-cathedral }
        answer: 0
        options:
          - label: Antwerp
            why: >-
              Right. It is the north tower of the Cathedral of Our Lady. A south tower was planned too but never
              built.
          - label: Utrecht
            why: Utrecht's Dom tower is 112 m. Antwerp's is taller.
          - label: Mechelen
            why: Mechelen's St Rumbold's tower stopped at about 97 m; its spire was never built.
          - label: Brussels
            why: Brussels's tallest Gothic tower is on its town hall, at about 96 m.
      - type: who
        photo: erasmus
        clues:
          - I was born in Rotterdam in the late 1460s.
          - I wrote In Praise of Folly, mocking greedy monks and foolish princes.
          - I inspired a college in Leuven that taught Latin, Greek and Hebrew.
          - I wrote a book on how to be a good Christian prince for the young Charles V.
        options: [Erasmus, Thomas More, Gerard Mercator, Andreas Vesalius]
        answer: 0
        explain: >-
          Desiderius Erasmus, the best-known scholar in Europe in his day. Hans Holbein the Younger painted him in
          1523.
      - type: pin
        prompt: The first university in the Low Countries opened here in 1425. Pin Leuven.
        place: leuven
        explain: Leuven lies about 25 km east of Brussels. Its university, founded by the duke of Brabant, is still one of the biggest in Europe.
      - type: truemyth
        statement: Thomas More's book Utopia opens in Antwerp, and it was first printed in Leuven.
        visual: { kind: map, highlight: [], rivers: [], pins: [antwerp, leuven] }
        answer: true
        explain: >-
          More started it while on a mission to Flanders in 1515. In the book he meets the traveller who describes
          Utopia in Antwerp, through his friend Pieter Gillis. Dirk Martens printed it in Leuven in 1516.
      - type: region
        prompt: Antwerp gives its name to a Belgian province. Shade it.
        layer: provinces
        answer: [BE-VAN]
        explain: The province of Antwerp. In the Middle Ages the area was the margraviate of Antwerp, part of the duchy of Brabant.
      - type: order
        prompt: Put these in order, oldest first.
        items:
          - { label: Leuven University is founded, year: 1425, when: '1425' }
          - { label: The first printing press in the Southern Netherlands, at Aalst, year: 1473, when: '1473' }
          - { label: The first Portuguese pepper reaches Antwerp, year: 1501, when: '1501' }
          - { label: Erasmus publishes In Praise of Folly, year: 1511, when: '1511' }
          - { label: Utopia is printed in Leuven, year: 1516, when: '1516' }
          - { label: Antwerp's Bourse is built, year: 1531, when: '1531' }
        explain: Trade, printing and new ideas grew up together in the cities of Brabant and Flanders.

