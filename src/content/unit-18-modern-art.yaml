    exercises:
      - type: story
        title: A tree turns into lines
        body: >-
          Piet Mondriaan, from Amersfoort, began as a painter of polders, windmills and trees in the manner of the
          Hague School. Over thirty-five years he took away everything but straight lines and pure colour, and his
          grids of red, yellow and blue became some of the best-known pictures of the twentieth century. Drag the
          slider and watch the tree disappear.
        visual: { kind: series, series: mondrian }
      - type: scrub
        prompt: Mondrian came home on a visit in 1914 and could not get back to Paris. Drag the slider to a stage when he is stuck in Laren.
        map: moderns
        start: 1908
        answer: [1914, 1918]
        explain: >-
          The First World War kept him in the neutral Netherlands, in the artists' village of Laren, from 1914 to 1919.
          There he met Theo van Doesburg and Bart van der Leck, and his painting turned to flat planes of colour.
      - type: choice
        prompt: Mondrian painted Composition 10 in 1915, out of short black lines like plus and minus signs. What did they start out as?
        visual: { kind: photo, photo: mondrian-pier }
        answer: 0
        options:
          - label: A pier running out into the sea, and the waves around it
            why: >-
              Right. From sketches of the sea and a pier, he kept only the rhythm of upright and flat strokes, inside an
              oval. Its full name is Pier and Ocean. It hangs in the Kröller-Müller Museum.
          - label: A city map of Amsterdam
            why: No streets here. Think of the coast.
          - label: Musical notes
            why: The music came later, in New York. This is the sea.
          - label: A field of tulips
            why: There are no flowers. It is the sea.
      - type: gap
        prompt: In November 1918 the artists of De Stijl published a manifesto, signed by Mondriaan, Van Doesburg and five others. Fill the gap in its first point.
        quote: "There is an old and a new consciousness of time. The old is connected with the ___. The new is connected with the universal."
        source: Manifest I of De Stijl, in De Stijl, November 1918
        visual: { kind: photo, photo: stijl-manifesto }
        options: [individual, nation, church, machine]
        answer: 0
        explain: >-
          The individual against the universal: after the slaughter of the world war, they wanted an art without
          personal feelings, made of the simplest things, straight lines and pure colours. Among the signers was a
          Belgian sculptor, Georges Vantongerloo.
      - type: choice
        prompt: Theo van Doesburg, here as a soldier during the mobilisation of the First World War, founded De Stijl in Leiden in 1917. What did it stand for?
        visual: { kind: photo, photo: doesburg-soldier }
        answer: 0
        options:
          - label: One style for everything, paintings, buildings and furniture, made of straight lines and flat colour
            why: >-
              Right. De Stijl means The Style. Painters, architects and a furniture maker worked together; Van Doesburg
              edited the magazine, and spread its ideas in Germany, until his death in 1931.
          - label: A return to Golden Age painting
            why: "They wanted the opposite: an art for the new age."
          - label: Painting only landscapes of Holland
            why: They gave up landscapes for lines and colour.
          - label: Art for the army
            why: He was a conscript, not an army painter.
      - type: choice
        prompt: In this room of about 1919 stands an armchair made by Gerrit Rietveld, a furniture maker from Utrecht. Later painted red and blue, it became famous. What was new about it?
        visual: { kind: photo, photo: stijl-interior }
        answer: 0
        options:
          - label: It was put together from plain, standard lengths of wood, so it could be made in numbers
            why: >-
              Right. Rietveld wanted furniture anyone could make from standard timber. He painted it red, blue, yellow
              and black in 1923, and the Red and Blue Chair became the best-known object of De Stijl.
          - label: It was carved from a single tree trunk
            why: It is made of many straight boards and rails.
          - label: It was the first chair made of steel
            why: It is wood.
          - label: It was covered in gold leaf
            why: Plain wood, later painted in flat colours.
      - type: who
        photo: mondrian-1922
        clues:
          - I was born in Amersfoort in 1872 and painted windmills and trees in the manner of the Hague School.
          - When I moved to Paris in 1912 I dropped a letter from my name.
          - I helped found De Stijl, and painted only straight black lines and red, yellow and blue.
          - I died in New York in 1944, with my last painting unfinished.
        options: [Piet Mondrian, Theo van Doesburg, Gerrit Rietveld, Bart van der Leck]
        answer: 0
        explain: Piet Mondrian, photographed in 1922 for the magazine De Stijl.
      - type: truemyth
        statement: Mondrian and Van Doesburg fell out over a diagonal line.
        visual: { kind: photo, photo: doesburg-counter }
        answer: true
        explain: >-
          True. From 1924 Van Doesburg tilted his lines at 45 degrees in what he called counter-compositions, like this
          one. For Mondrian only upright and level lines would do, and he broke with De Stijl. He did paint canvases
          turned on their point, but even in those his lines stayed upright and level.
      - type: odd
        prompt: Three of these are by Mondrian. Which is the odd one out, and why?
        items:
          - { label: Tableau I, 1921, photo: mondrian-1921 }
          - { label: Composition with red, blue and yellow, 1930, photo: mondrian-1930 }
          - { label: Counter-composition V, 1924, photo: doesburg-counter }
          - { label: Broadway Boogie Woogie, 1942 to 1943, photo: mondrian-broadway }
        answer: 2
        reasons:
          - Its lines run on the diagonal; it is by Van Doesburg
          - It is the only one with red in it
          - It was painted in New York
        reason: 0
        explain: >-
          Van Doesburg's counter-compositions tilt the grid; Mondrian's lines stay upright and level, even in New York,
          where they turned into rows of little coloured blocks.
      - type: choice
        prompt: Mondrian painted Broadway Boogie Woogie in New York in 1942 and 1943. What is it named after?
        visual: { kind: photo, photo: mondrian-broadway }
        answer: 0
        options:
          - label: A New York street and the fast piano jazz he loved
            why: >-
              Right. Mondrian loved jazz and dancing. The grid of Manhattan's streets and the beat of boogie-woogie piano
              turned his black lines into rows of small coloured blocks. It hangs in the Museum of Modern Art in New York.
          - label: A ship he sailed to America on
            why: Broadway is a street. Think of music.
          - label: A Dutch folk dance
            why: Boogie-woogie is American jazz.
          - label: A musical in a Broadway theatre
            why: It is the street and the music, not a show.
      - type: choice
        prompt: Mondrian died in 1944 with Victory Boogie Woogie unfinished. In the late 1990s it was bought for the Netherlands. What was unusual about the purchase?
        visual: { kind: photo, photo: mondrian-victory }
        answer: 0
        options:
          - label: It cost 80 million guilders, paid by the central bank to mark the coming of the euro
            why: >-
              Right. About €35 million, then the most a Dutch museum had ever paid for a work of art. The price was
              questioned in parliament. It has hung in the museum in The Hague since 1998.
          - label: It was swapped for a Rembrandt
            why: Money changed hands, a great deal of it.
          - label: It was found in a farmhouse attic
            why: It came from an American collector.
          - label: It was bought by a football club
            why: The money came from a bank.
      - type: choice
        prompt: In January 1966 these dresses were shown in the Netherlands. Who designed them, after Mondrian's paintings?
        visual: { kind: photo, photo: ysl-mondrian }
        answer: 0
        options:
          - label: Yves Saint Laurent, in Paris
            why: >-
              Right. His Mondrian dresses of 1965 were knitted in blocks of colour with black lines. Mondrian's grid has
              been on everything since, from cans to trainers.
          - label: Mondrian himself
            why: He had died twenty years before.
          - label: Gerrit Rietveld
            why: Rietveld made furniture and houses, not dresses.
          - label: Coco Chanel
            why: It was a younger Paris designer.
      - type: choice
        prompt: Wipe between 1908 and 1917. In 1917, where are the artists of De Stijl working?
        visual: { kind: compare, map: moderns, years: [1908, 1917] }
        answer: 0
        options:
          - label: In Leiden, Laren and Utrecht
            why: >-
              Right. Van Doesburg in Leiden, Mondrian in Laren, Rietveld in Utrecht: all in the neutral Netherlands,
              while Belgium was occupied. In 1908 Mondriaan was still an Amsterdam painter, spending summers in Domburg.
          - label: In Paris
            why: The war kept them at home. Look at the map of 1917.
          - label: In Brussels and Antwerp
            why: Belgium was at war and occupied. They were in the north.
          - label: In Domburg only
