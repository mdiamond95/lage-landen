      - type: choice
        prompt: Wipe between 1890 and 1973 on the map. By 1973, which museums hold the modern art of the Low Countries?
        visual: { kind: compare, map: moderns, years: [1890, 1973] }
        answer: 0
        options:
          - label: The Stedelijk and the Van Gogh Museum in Amsterdam, the Gemeentemuseum in The Hague and the Kröller-Müller
            why: >-
              Right. In 1890 the new art had only a yearly show in Brussels, Les XX. By 1973 four museums in the
              Netherlands showed it, and Belgium's great museums in Antwerp, Brussels and Ghent had their Ensors and Khnopffs.
          - label: Only the Rijksmuseum
            why: Look again at the museum marks of 1973.
          - label: Only museums in Paris
            why: The marks are in the Netherlands.
          - label: None yet
            why: Look at the museum marks on the map of 1973.
      - type: story
        title: A walk through the KMSKA
        body: >-
          Not every great museum began with one collector. The collection of Antwerp's Royal Museum of Fine Arts,
          the KMSKA, founded in 1810, began with the paintings of the city's old painters' guild, and grew with
          gifts and purchases for two centuries. Walk through it, from Van Eyck to Rik Wouters, and zoom in.
        visual: { kind: walk, walk: kmska }
      - type: choice
        prompt: >-
          Memling's three panels of angels around God the Father, almost seven metres wide, were made for the high
          altar of a Benedictine abbey far from Flanders. In which country?
        visual: { kind: photo, photo: memling-angels }
        answer: 0
        options:
          - label: Spain
            why: >-
              Right. They were set up over the high altar of the abbey church of Santa María la Real at Nájera, in
              northern Spain, in 1494, the year Memling died in Bruges.
          - label: Italy
            why: Italian bankers bought Flemish paintings too, but these went further west.
          - label: England
            why: Not England. These angels went south.
          - label: Poland
            why: That was Memling's Last Judgement, captured at sea and taken to Gdańsk. These went south.
