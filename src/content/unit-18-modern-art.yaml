id: unit-18
number: 18
title: Modern art
era: 1880 to 1973
summary: In 1880 a failed preacher in the Borinage decided to become an artist. Within ten years Vincent van Gogh had turned the dark colours of the Hague School into the blazing yellows of Arles. In Ostend, James Ensor filled his paintings with masks; in Brussels, Les XX showed the newest art in Europe. Piet Mondrian turned a tree into a grid of lines and colour, René Magritte painted a pipe and wrote that it was not one, and M. C. Escher drew stairs that climb for ever. Learn to tell their styles apart, one painting at a time.
note: Two lessons in this unit touch on mental illness, self-harm and suicide, and on the murder of a Jewish artist and his family in the Holocaust.
lessons:
  - id: u18-l1
    title: Learning to paint
    icon: pencil
    sources:
      - title: "Van Gogh Museum, Congregation Leaving the Reformed Church in Nuenen"
