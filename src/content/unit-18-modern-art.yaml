  - id: u18-l5
    title: Pictures that play tricks
    icon: bowler
    note: This lesson mentions the murder of Escher's teacher and his family in the Holocaust.
    sources:
      - title: "Wikipedia, René Magritte"
        url: https://en.wikipedia.org/wiki/Ren%C3%A9_Magritte
      - title: "Wikipedia, The Treachery of Images"
        url: https://en.wikipedia.org/wiki/The_Treachery_of_Images
