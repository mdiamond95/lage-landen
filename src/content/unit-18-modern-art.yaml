            box: [0.35, 0.65, 0.25, 0.25]
          - photo: potato-eaters
            title: Vincent van Gogh, The Potato Eaters, 1885
            group: 2
            tell: Real peasants at a real table, in the earthy browns of the Hague School. Nothing is dreamt.
