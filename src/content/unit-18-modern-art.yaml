        explain: >-
          Symbolists such as Khnopff and Toorop painted ideas and dreams; pointillists such as Seurat and Van
          Rysselberghe built pictures from dots; the realists of the Hague School painted what was in front of them.
      - type: choice
        prompt: Léon Spilliaert, from Ostend like Ensor, drew himself in 1907, at 26. What fills his pictures?
        visual: { kind: photo, photo: spilliaert-self }
        answer: 0
        options:
          - label: Night, the empty promenade and the sea, lonely figures
            why: >-
              Right. Spilliaert worked in dark washes of ink: empty halls, the promenade at night, women waiting by the
              sea. He could not sleep, and walked Ostend at night.
          - label: Bright beach crowds in summer
            why: His Ostend is empty and dark.
          - label: Masks and skeletons, like Ensor's
            why: That is Ensor. Spilliaert's world is quiet and empty.
          - label: Battles of the Great War
            why: He drew the town and the sea, not battles.
      - type: choice
        prompt: Rik Wouters, the leading young painter in Belgium, painted himself with a black patch over one eye in 1915. Why the patch?
        visual: { kind: photo, photo: wouters-eyepatch }
        answer: 0
        options:
          - label: He had cancer and had lost an eye
            why: >-
              Right. Wouters was a soldier in 1914; after the fall of Antwerp he was held in camps in the neutral
              Netherlands, at Amersfoort and Zeist. Cancer took his eye, and he died in Amsterdam in July 1916, at 33.
          - label: He was wounded in battle at the Yser
            why: He was interned in the Netherlands, far from the Yser. It was an illness.
          - label: It was a pirate costume for the carnival
            why: There was nothing to celebrate. He was ill.
          - label: He was copying a portrait by Ensor
            why: It is his own face, and his own illness.
