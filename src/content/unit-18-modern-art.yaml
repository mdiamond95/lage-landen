    exercises:
      - type: story
        title: A collector and her painter
        body: >-
          Helene Müller, the daughter of a German industrialist, married the Dutch businessman Anton Kröller. In 1907
          her art teacher, Henk Bremmer, suggested she start a collection. She bought Van Gogh when he was still
          cheap and little known, and modern art from Seurat to Mondrian. Her collection, and the one Theo's family
          kept, are why so many Van Goghs are in the Netherlands today.
        visual: { kind: photo, photo: kroller-couple }
      - type: choice
        prompt: How many Van Gogh paintings did Helene Kröller-Müller buy?
        visual: { kind: photo, photo: vg-cafe-terrace }
        answer: 0
        options:
          - label: More than 90, and about 185 drawings
            why: >-
              Right. For a time it was the largest Van Gogh collection in the world. This café terrace in Arles, from
              September 1888, is one of them.
          - label: Three
            why: Many more. She bought them by the dozen.
          - label: Every one he ever painted
            why: He painted about 850. Theo's family kept the largest share.
          - label: None; she bought only drawings
            why: She bought paintings and drawings.
      - type: choice
        prompt: Van Gogh was proud of this café terrace. What did he tell his sister about it?
        visual: { kind: photo, photo: vg-cafe-terrace }
        answer: 0
        options:
          - label: '"Now there''s a painting of night without black"'
            why: >-
              Right. He wrote it to his sister Willemien in September 1888. The night sky is deep blue and violet, with
              stars, and the terrace glows yellow under a gas lamp.
          - label: That he painted it in one hour
            why: He wrote about the colour, not the speed.
          - label: That Gauguin painted the sky
            why: Gauguin only arrived in October. It is all Van Gogh's.
          - label: That he had sold it for a good price
            why: He sold almost nothing. He wrote about the colour of the night.
      - type: choice
        prompt: In 1935 the Kröllers gave their whole collection to the nation, on one condition. What was it?
        visual: { kind: photo, photo: kroller-entrance }
        answer: 0
        options:
          - label: That a museum be built for it on their estate on the Veluwe
            why: >-
              Right. The Kröller-Müller Museum opened in 1938 at Otterlo, in what is now the Hoge Veluwe National Park,
              in a building by the Belgian architect Henry van de Velde. Helene ran it until her death in 1939.
          - label: That it be shown in the Rijksmuseum
            why: She wanted a museum of its own.
          - label: That it never be lent abroad
            why: The collection has travelled. The condition was a building.
          - label: That their name be painted on every frame
            why: Their name is on the museum.
      - type: pin
        prompt: Pin Otterlo, the village on the Veluwe where the Kröller-Müller Museum stands.
        place: otterlo
        fullKm: 10
        okKm: 25
        explain: >-
          Otterlo, between Arnhem and Apeldoorn, in the woods and sand drifts of the Hoge Veluwe National Park.
      - type: choice
        prompt: On 2 June 1973 Queen Juliana came to open the Van Gogh Museum in Amsterdam. Who is welcoming her?
        visual: { kind: photo, photo: vgm-1973 }
        answer: 0
        options:
          - label: Vincent Willem van Gogh, Theo's son, the baby of the Almond Blossom
            why: >-
              Right. He inherited the family collection in 1925 and placed it in a foundation in 1962, so the state
              could build a museum for it. The building was designed by Gerrit Rietveld.
          - label: The painter's grandson
            why: Vincent had no children. This is his nephew.
          - label: Gerrit Rietveld, the architect
            why: Rietveld died in 1964, before it was built.
          - label: The mayor of Arles
            why: It is a Van Gogh, but not from Arles.
      - type: truemyth
        statement: In 1991 thieves took 20 paintings from the Van Gogh Museum, among them The Potato Eaters, and they were never found.
        visual: { kind: photo, photo: potato-eaters }
        answer: false
        explain: >-
          Myth. The thieves got away, but all twenty paintings were found in an abandoned car about 35 minutes
          later, some of them damaged. Two others, stolen in 2002, took fourteen years to come back.
      - type: style
        prompt: Hague School, Impressionism, Symbolism or De Stijl? Name the style of each painting.
        groups: [Hague School, Impressionism, Symbolism, De Stijl]
        items:
          - photo: vg-nuenen-church
            title: Vincent van Gogh, Leaving church in Nuenen, 1884 to 1885
            group: 0
            tell: The browns, greys and soft light of the Hague School, which Van Gogh learned from Mauve.
            box: [0.05, 0.3, 0.9, 0.6]
          - photo: breitner-kimono
            title: George Hendrik Breitner, Girl in a White Kimono, 1894
            group: 1
            tell: "Loose, quick brushstrokes, a model caught in a passing moment: Amsterdam's answer to the Paris Impressionists."
            box: [0.25, 0.1, 0.55, 0.6]
          - photo: spilliaert-self
            title: Léon Spilliaert, Self-portrait, 1907
            group: 2
            tell: "A pale, staring face in a cold, grey-blue room: a mood of unease more than a likeness, the world of the Symbolists."
            box: [0.38, 0.45, 0.28, 0.22]
          - photo: mondrian-1930
            title: Piet Mondrian, Composition II with red, blue and yellow, 1930
            group: 3
            tell: Only upright and level black lines, white, and red, yellow and blue.
            box: [0.0, 0.0, 0.7, 0.7]
          - photo: doesburg-counter
            title: Theo van Doesburg, Counter-composition V, 1924
            group: 3
            tell: The lines and flat colour planes of De Stijl, with Van Doesburg's twist, the diagonal.
            box: [0.05, 0.05, 0.9, 0.85]
        explain: >-
          In forty years painting in the Low Countries went from the grey light of the Hague School, through the
          quick brush of the Impressionists and the dreams of the Symbolists, to the pure lines of De Stijl.
      - type: match
        prompt: Match each painting to where you can see it today.
        pairs:
          - [Café Terrace at Night, "Kröller-Müller Museum, Otterlo"]
