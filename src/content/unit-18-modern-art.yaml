        url: https://en.wikipedia.org/wiki/M._C._Escher
      - title: "Wikipedia, Samuel Jessurun de Mesquita"
        url: https://en.wikipedia.org/wiki/Samuel_Jessurun_de_Mesquita
      - title: "Escher in Het Paleis, Samuel Jessurun de Mesquita, 1944"
        url: https://escherinhetpaleis.nl/escher-today/samuel-jessurun-de-mesquita-1944/?lang=en
      - title: "Wikipedia, Penrose stairs"
        url: https://en.wikipedia.org/wiki/Penrose_stairs
      - title: "Wikipedia, Tessellation"
        url: https://en.wikipedia.org/wiki/Tessellation
    exercises:
      - type: story
        title: Two boys born in 1898
        body: >-
          In 1898 René Magritte was born in Lessines, in Hainaut, and Maurits Cornelis Escher in Leeuwarden, in
          Friesland. Both grew up to make pictures that play tricks: Magritte painted ordinary things, a pipe, an
          apple, a bowler hat, in impossible places; Escher drew worlds where water flows uphill. Their works are
          still under copyright, so this lesson shows the men and their places.
        visual: { kind: time-map, map: moderns, year: 1898 }
      - type: who
        photo: magritte-1961
        clues:
          - I was born in Lessines, in Hainaut, in 1898, and drew wallpaper and posters for a living.
          - In 1927 I moved to Paris to be near the Surrealist poets, but I came home to Brussels in 1930.
          - I painted a pipe and wrote under it that it is not a pipe.
          - Men in bowler hats fill my paintings, and I died in Brussels in 1967.
        options: [René Magritte, Paul Delvaux, James Ensor, M. C. Escher]
        answer: 0
        explain: >-
          René Magritte in 1961. He dressed like a bank clerk, in a suit and bowler hat, and painted at home, not in
          a bohemian studio.
      - type: pin
        prompt: Pin Lessines, the town in Hainaut where Magritte was born.
        place: lessines
        fullKm: 10
        okKm: 25
        explain: >-
          Lessines, on the Dender, a town of stone quarries. The family moved to Châtelet, near Charleroi, and then to
          Charleroi itself, before Magritte went to the academy in Brussels in 1916.
      - type: gap
        prompt: In 1929, in Paris, Magritte painted a pipe so real you could pick it up, and painted these words under it. Fill the gap.
        quote: "Ceci n'est pas une ___."
        source: René Magritte, The Treachery of Images, 1929, words painted under the picture
        options: [pipe, pomme, porte, photo]
        answer: 0
        explain: >-
          "This is not a pipe." And it isn't: it is a picture of a pipe. You cannot fill it or smoke it. Magritte spent
          his life on the gap between things, their pictures and their names.
      - type: choice
        prompt: From 1930 to 1954 Magritte and his wife Georgette lived on the ground floor of a house on this street in Jette, in Brussels. What is the house today?
        visual: { kind: photo, photo: magritte-house }
        answer: 0
        options:
          - label: A museum of his life and work
            why: >-
              Right. The René Magritte Museum opened in the house in 1999. A bigger Magritte Museum, with some 200 of
              his works, opened on the Place Royale in central Brussels in 2009.
          - label: The headquarters of the Surrealists
            why: The Surrealists met there, but today it is a museum.
          - label: A bowler hat shop
            why: He wore bowler hats, but the house is a museum.
          - label: Torn down for a motorway
            why: It is still standing.
      - type: truemyth
        statement: After the war, short of money, Magritte painted fake Picassos.
        visual: { kind: photo, photo: magritte-chatelet }
        answer: true
        explain: >-
          True, it seems, though the evidence is one man's word. In 1988 his old friend Marcel Mariën wrote that in
          1947 and 1948 Magritte painted fakes in the manner of Picasso, Braque and De Chirico, and printed false
          banknotes with his brother Paul; Mariën sold them. This house in Châtelet is where the young Magritte
          lived with his family.
      - type: pin
        prompt: Pin Leeuwarden, the Frisian town where Escher was born.
        place: leeuwarden
        fullKm: 10
        okKm: 30
        explain: >-
          Leeuwarden, the capital of Friesland. Escher was born in a house that is now part of the Princessehof, a
          museum of ceramics. His family moved to Arnhem when he was five.
      - type: choice
        prompt: Samuel Jessurun de Mesquita, here in a self-portrait of 1917, taught Escher at the school in Haarlem. What did he do for him?
        visual: { kind: photo, photo: mesquita-self }
        answer: 0
        options:
          - label: He talked him into giving up architecture for graphic art
            why: >-
              Right. Escher had come to Haarlem in 1919 to study architecture. Mesquita saw his woodcuts and steered him to
              graphic art. In February 1944 Mesquita, his wife and their son were arrested in Amsterdam; he and his wife
              were murdered in Auschwitz, their son in Theresienstadt. Escher went to the ransacked house, saved what
              prints he could, and later helped show them at the Stedelijk Museum.
          - label: He taught him to paint in oils
            why: Mesquita was a printmaker, and Escher made prints all his life.
          - label: He took him to the Alhambra
            why: Escher went to Spain after school, without him.
          - label: He sold his prints in America
            why: Escher's fame in America came much later.
      - type: choice
        prompt: In 1922 and again in 1936 Escher spent days copying the tiled walls of the Alhambra in Granada. What did he learn from them?
        visual: { kind: photo, photo: alhambra-tiles }
        answer: 0
        options:
          - label: How a few shapes can cover a flat surface with no gaps and no overlaps
            why: >-
              Right. Mathematicians call it a tessellation. The Moorish tiles used patterns; Escher filled the plane
              with lizards, fish and birds that lock together.
          - label: How to carve marble
            why: Escher made woodcuts and lithographs. He was after the patterns.
          - label: How to draw in perspective
            why: The tiles are flat patterns. He learned about filling a surface.
          - label: How to mix bright paint
            why: Most of his prints are black and white.
      - type: choice
        prompt: Each of these tiles began as a square. Its top edge was bent into a wavy curve, up on one side and down on the other. What has to happen to the bottom edge, so the tiles still lock together?
        visual: { kind: art, art: tessellation }
        answer: 0
        options:
          - label: It gets exactly the same curve, so the tile below fits into it like a jigsaw
            why: >-
              Right. Whatever bulges out of one edge is cut out of the opposite edge, and the same on the left and
              right. Every tile then fits its neighbours exactly. Escher worked out his lizards this way, on squared paper.
          - label: It stays straight
            why: Then a gap would open under every bulge, and the tiles would overlap under every dip.
          - label: It gets the curve turned upside down
            why: Then the bumps of one tile would run into the bumps of the tile below.
          - label: The tile is turned upside down
            why: These tiles are only moved, never turned.
      - type: who
        photo: escher-1971
        clues:
          - I was born in Leeuwarden in 1898, in a house that is now a museum of ceramics.
          - I lived in Rome until 1935, and left when my son had to wear a fascist uniform at school.
          - I filled the plane with interlocking lizards, fish and birds.
          - I drew stairs that climb for ever and water that flows uphill, and died in 1972.
        options: [M. C. Escher, Samuel Jessurun de Mesquita, René Magritte, Piet Mondrian]
        answer: 0
        explain: >-
          M. C. Escher in November 1971, a few months before his death. Mathematicians loved his work long before
          the art world did: in 1954 the Stedelijk Museum showed his prints to a congress of mathematicians.
      - type: truemyth
        statement: Escher drew his staircase that climbs for ever after a drawing sent to him by two British scientists.
        visual: { kind: photo, photo: escher-paleis }
        answer: true
        explain: >-
          True. Lionel Penrose and his son Roger, who had seen Escher's prints in Amsterdam in 1954, published an
          impossible triangle and an endless staircase in 1958 and sent Escher a copy. He drew monks climbing the
          stairs in Ascending and Descending (1960) and used the triangle in Waterfall (1961). Both hang in Escher in
          Het Paleis, a museum in a royal palace in The Hague, opened in 2002.
      - type: sort
        prompt: In 1937 both men lived in Brussels. Magritte or Escher? Sort the facts.
        visual: { kind: time-map, map: moderns, year: 1937 }
        groups: [Magritte, Escher]
        items:
          - { label: Born in Lessines, group: 0 }
          - { label: Born in Leeuwarden, group: 1 }
          - { label: Lived near Paris from 1927 to 1930, group: 0 }
          - { label: Lived in Rome from 1923 to 1935, group: 1 }
          - { label: Painted words under a picture of a pipe, group: 0 }
          - { label: Woodcuts of interlocking animals, group: 1 }
          - { label: Lived in Uccle, Brussels, from 1937 to 1941, group: 1 }
          - { label: Died in Brussels in 1967, group: 0 }
        explain: >-
          Magritte painted in his flat in Jette from 1930; Escher lived in Uccle, at the other end of Brussels, until
          he moved to Baarn in January 1941. There is no sign that they ever met.

