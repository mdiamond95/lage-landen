    exercises:
      - type: story
        title: A late start
        body: >-
          Vincent van Gogh had been an art dealer, a teacher and a preacher among the coal miners of the Borinage
          when, in 1880, at 27, he decided to become an artist. He had almost no training. He taught himself by
          drawing, then painting, and in ten years he went from the dark browns of Brabant to the blazing colours of
          the south of France. Drag the slider along his road.
        visual: { kind: series, series: van-gogh }
      - type: scrub
        prompt: Drag the slider to a stage when Van Gogh is living in The Hague and taking lessons from the painter Anton Mauve.
        map: moderns
        start: 1880
        answer: [1882, 1883]
        explain: >-
          Van Gogh moved to The Hague at the end of 1881 and stayed until September 1883. Mauve, a painter of the
          Hague School married to a cousin of Van Gogh's mother, gave him his first lessons in painting.
      - type: choice
        prompt: Van Gogh drew Sorrow in The Hague in April 1882. Who was his model?
        visual: { kind: photo, photo: vg-sorrow }
        answer: 0
        options:
          - label: Sien Hoornik, a pregnant woman he had taken in with her little daughter
            why: >-
              Right. Sien had worked as a prostitute and was expecting a child. Van Gogh took her in, drew her again
              and again, and wanted to marry her. His family, and Mauve, turned against him for it, and he left her
              in 1883.
          - label: His sister Willemien
            why: His sister lived with their parents in Brabant. The model was a woman he met in The Hague.
          - label: A model from the art academy
            why: Van Gogh could hardly pay models. This was someone who shared his life.
          - label: His mother
            why: His mother lived in Brabant, and was in her sixties.
      - type: choice
        prompt: Anton Mauve, who painted this beach at Scheveningen, gave Van Gogh lessons in 1881 and 1882. How did it end?
        visual: { kind: photo, photo: mauve-ride }
        answer: 0
        options:
          - label: They fell out within months, over Sien and over drawing from plaster casts
            why: >-
              Right. Mauve wanted him to draw from plaster casts, and Van Gogh smashed them. When Mauve heard about Sien
              he broke with him. Still, when Mauve died in 1888, Van Gogh wrote "Souvenir de Mauve" on a painting of
              blossoming peach trees and sent it to his widow.
          - label: Mauve made him his partner
            why: There was no partnership. They quarrelled.
          - label: Van Gogh became famous as Mauve's best pupil
            why: Nobody knew Van Gogh's work while Mauve was alive.
          - label: Mauve sent him to the Paris academy
            why: Van Gogh only went to an academy once, in Antwerp, years later.
      - type: truemyth
        statement: This seascape was stolen from the Van Gogh Museum in 2002 and has never been seen since.
        visual: { kind: photo, photo: vg-sea-1882 }
        answer: false
        explain: >-
          Myth. Thieves did take it, with a painting of churchgoers in Nuenen, in December 2002. In September 2016 the
          Italian police found both in a villa near Naples that belonged to a drug trafficker of the Camorra, and they
          went back to Amsterdam. Van Gogh painted it on the beach at Scheveningen in a storm in August 1882; grains
          of sand blown into the wet paint are still in it.
      - type: voices
        prompt: Van Gogh sent a print of his Potato Eaters to his friend, the painter Anthon van Rappard. Read what each wrote. What divides them?
        voices:
          - who: Vincent van Gogh, to his brother Theo
            when: Nuenen, 30 April 1885
            text: "…these folk, who are eating their potatoes by the light of their little lamp, have tilled the earth themselves … and have thus honestly earned their food."
            photo: potato-eaters
          - who: Anthon van Rappard, to Van Gogh
            when: Utrecht, 24 May 1885
            text: "You'll agree with me that such work isn't intended seriously. … That coquettish little hand of that woman at the back, how untrue! … And why must his arm be a metre too short?"
        answer: 0
        options:
          - Van Gogh cares about what the picture says about peasant life; Rappard judges it by how correctly it is drawn
          - Both think the drawing is too careless
          - They argue about the price of the print
          - Rappard thinks the peasants are too poor to be painted
        explain: >-
          Van Gogh wanted people to feel the hard work in those hands; Rappard saw clumsy, untrue drawing. Van Gogh
          sent the letter back, and their five-year friendship never recovered. The Potato Eaters is now one of the
          most famous paintings in the Van Gogh Museum.
      - type: truemyth
        statement: The little church at Nuenen that Van Gogh painted, where his father preached, was pulled down long ago.
        visual: { kind: then-now, pair: nuenen }
        answer: false
        explain: >-
          A myth. Drag across: it still stands, at the end of a path under the trees. Van Gogh painted it in 1884
          for his mother, who had broken her leg, and added the churchgoers in 1885, after his father died.
      - type: hunt
        prompt: Van Gogh painted his late father's Bible in October 1885, some months after his father died. Find the book that is not a Bible.
        photo: vg-bible
        targets:
          - [0.64, 0.6, 0.28, 0.25]
        explain: >-
          The battered yellow paperback is La joie de vivre, "The joy of living", a novel by Émile Zola, the kind of
          modern book his father, a preacher, disliked. The Bible lies open at the book of Isaiah, and a snuffed-out
          candle stands beside it.
      - type: choice
        prompt: Van Gogh painted this in Antwerp, early in 1886, while he was a student at the art academy. What is it?
        visual: { kind: photo, photo: vg-skull }
        answer: 0
        options:
          - label: A joke about the anatomy drawing he was made to do
            why: >-
              Right. At the academy he had to draw skeletons and plaster casts. A skeleton with a lit cigarette between
              its teeth looks like a student prank. He soon left Antwerp for Paris.
          - label: A warning against smoking, painted for a doctor
            why: Nobody ordered it. It is a student's joke.
          - label: A portrait of his father after his death
            why: It is a skeleton from the academy's drawing class.
          - label: A study for a church altar
            why: Nothing about it is religious.
      - type: choice
        prompt: In Paris in 1887 Van Gogh painted a copy of a Japanese print by Hiroshige. Look at both. What did he add that is not in the print?
        visual: { kind: pair, pair: plum }
        answer: 0
        options:
          - label: A border of Japanese characters, copied from other prints
            why: >-
              Right. He painted a red and orange border and filled it with Japanese characters taken from other prints.
              He could not read them; he liked the way they looked.
          - label: The black tree trunk across the front
            why: That trunk is in Hiroshige's print too. Look at the edges.
          - label: The people behind the fence
            why: Hiroshige's print has the little figures too.
          - label: The red sky
            why: Hiroshige's sky turns red as well. Look at the edges.
      - type: choice
        prompt: Van Gogh copied this Japanese courtesan from the cover of a Paris magazine and set her in a pond with frogs and cranes. Why frogs and cranes?
        visual: { kind: photo, photo: vg-courtesan }
        answer: 0
        options:
          - label: In French slang, both words meant a prostitute
            why: >-
              Right. "Grue", a crane, and "grenouille", a frog, were slang for a prostitute. He copied her from a woodcut
              by Keisai Eisen on the cover of Paris Illustré, in an issue about Japan from May 1886.
          - label: They were Theo's favourite animals
            why: There is no sign of that. It is a joke in French.
          - label: They were in the magazine's picture
            why: The magazine showed only the woman. He added the pond.
          - label: Frogs and cranes stand for Holland
            why: They stand for something else, in Paris slang.
      - type: match
        prompt: Match each place on Van Gogh's road to what he did there.
        pairs:
          - [The Borinage, Preached to the miners and began drawing them]
          - [The Hague, Lessons from Mauve; lived with Sien]
          - [Nuenen, Painted weavers and The Potato Eaters]
          - [Antwerp, A few weeks at the academy]
          - [Paris, Japanese prints and bright colour]
      - type: odd
        prompt: Three of these Van Gogh made in the Netherlands. Which is the odd one out, and why?
        items:
          - { label: Sorrow, photo: vg-sorrow }
          - { label: Still life with Bible, photo: vg-bible }
          - { label: The Potato Eaters, photo: potato-eaters }
          - { label: Flowering plum orchard, photo: vg-plum }
        answer: 3
        reasons:
          - It was painted in Paris, after Japanese prints, in bright flat colour
          - It is a drawing, not a painting
          - It is not by Van Gogh
        reason: 0
        explain: >-
          Sorrow (The Hague, 1882), the Bible (Nuenen, 1885) and The Potato Eaters (Nuenen, 1885) belong to his dark
          Dutch years. In Paris, in 1887, Japanese prints and the young painters around him brought the colour in.

  - id: u18-l2
    title: Colour in the south
    icon: sunflower
    note: This lesson mentions mental illness, self-harm and Van Gogh's death by a gunshot wound, probably by his own hand.
    sources:
      - title: "Van Gogh Museum, Van Gogh's life"
        url: https://www.vangoghmuseum.nl/en/art-and-stories/vincent-van-gogh-faq
      - title: "Vincent van Gogh, The Letters, letter 676 to Theo, 8 September 1888"
        url: https://vangoghletters.org/vg/letters/let676/letter.html
      - title: "Wikipedia, The Yellow House"
        url: https://en.wikipedia.org/wiki/The_Yellow_House
      - title: "Wikipedia, Van Gogh's Chair"
        url: https://en.wikipedia.org/wiki/Van_Gogh%27s_Chair
      - title: "Wikipedia, Bedroom in Arles"
        url: https://en.wikipedia.org/wiki/Bedroom_in_Arles
      - title: "Wikipedia, Self-Portrait with Bandaged Ear"
        url: https://en.wikipedia.org/wiki/Self-Portrait_with_Bandaged_Ear
      - title: "The Guardian, Van Gogh's ear: the true story (Bernadette Murphy and Dr Rey's drawing), 2016"
        url: https://www.theguardian.com/artanddesign/2016/jul/12/van-gogh-ear-mystery-solved-new-evidence-shows-he-cut-off-the-whole-ear
      - title: "Wikipedia, Irises (painting)"
        url: https://en.wikipedia.org/wiki/Irises_(painting)
      - title: "Wikipedia, Almond Blossoms"
        url: https://en.wikipedia.org/wiki/Almond_Blossoms
      - title: "Wikipedia, Portrait of Dr. Gachet"
        url: https://en.wikipedia.org/wiki/Portrait_of_Dr._Gachet
      - title: "Wikipedia, Death of Vincent van Gogh"
        url: https://en.wikipedia.org/wiki/Death_of_Vincent_van_Gogh
    exercises:
      - type: story
        title: The studio of the south
        body: >-
          In February 1888 Van Gogh left Paris for Arles, in Provence, chasing the light of the south. In May he
          rented four rooms in a yellow house on a square and dreamed of a studio where painters would live and work
          together. Only one came: Paul Gauguin, in October. In the two and a half years he had left, Van Gogh painted
          the pictures the world now knows best.
        visual: { kind: photo, photo: vg-yellow-house }
      - type: scrub
        prompt: Drag the slider to a stage when Van Gogh is in the south of France.
        map: moderns
        start: 1880
        answer: [1888, 1889]
        explain: >-
          Arles from February 1888, then a year in the asylum at Saint-Rémy from May 1889. In May 1890 he moved north
          to Auvers-sur-Oise, near Paris, where he died that July.
      - type: choice
        prompt: With Gauguin living in the Yellow House, Van Gogh painted his own chair and Gauguin's. Look at what lies on Gauguin's seat. What is it?
        visual: { kind: pair, pair: chairs, focus: seat }
        answer: 0
        options:
          - label: A lit candle and two novels
            why: >-
              Right. Van Gogh's own plain rush chair holds his pipe and tobacco, in daylight. Gauguin's armchair stands
              in the night, under a gas lamp, with a candle and modern novels: a portrait of the man of books and
              imagination, without the man.
          - label: A pipe and tobacco
            why: Those lie on Van Gogh's own chair.
          - label: A palette and brushes
            why: Look again. The light on the seat comes from something burning.
          - label: Sunflowers
            why: No flowers on the seat. Look at the flame.
      - type: gap
        prompt: Van Gogh painted the night café near his house, where people slept off their drink. He told Theo what he was after. Fill the gap.
        quote: "I've tried to express the terrible human passions with the red and the ___."
        source: Vincent van Gogh to his brother Theo, Arles, 8 September 1888
        visual: { kind: photo, photo: vg-night-cafe }
        options: [green, blue, yellow, black]
        answer: 0
        explain: >-
          Red walls against a green billiard table and green ceiling: colours that clash on purpose. "The room is
          blood-red and dull yellow, a green billiard table in the centre," he wrote. He painted it over three nights.
      - type: hunt
        prompt: In his bedroom in the Yellow House, Van Gogh hung portraits of two friends above the bed. Find them.
        photo: vg-bedroom
        targets:
          - [0.62, 0, 0.22, 0.15]
        explain: >-
          One is the Belgian painter Eugène Boch, whose sister Anna Boch would buy The Red Vineyard; the other is the
          soldier Paul-Eugène Milliet. Van Gogh painted the bedroom in October 1888 to show rest, in flat, bright colour.
      - type: choice
        prompt: In December 1888 Gauguin painted his friend at work. Why can't this scene have happened as it looks?
        visual: { kind: photo, photo: gauguin-vincent }
        answer: 0
        options:
          - label: Sunflowers don't flower in December
            why: >-
              Right. Van Gogh had painted his sunflowers in August, to decorate Gauguin's room. Gauguin painted him from
              memory and imagination.
          - label: Van Gogh never painted outdoors
            why: He painted outdoors all the time. The problem is the flowers.
          - label: Van Gogh painted left-handed
            why: There is no sign of that. Think about the season.
          - label: Gauguin had already left Arles
            why: Gauguin was still there in December. Think about the flowers.
      - type: truemyth
        statement: On 23 December 1888, after a quarrel with Gauguin, Van Gogh cut off only a small piece of his ear lobe.
        visual: { kind: photo, photo: vg-bandaged }
        answer: false
        explain: >-
          Myth, it seems. For more than a century many believed he cut off only part of the lobe. In 2016 the
          historian Bernadette Murphy found a drawing by Dr Félix Rey, who treated him in Arles, showing that almost
          the whole left ear was cut off. Here the bandage is on his right side because he painted himself in a
          mirror. Gauguin left for Paris, and the two never met again.
      - type: choice
        prompt: In May 1889 Van Gogh asked to be taken into the asylum at Saint-Rémy, near Arles. What did he paint in his first week there?
        visual: { kind: photo, photo: vg-irises }
        answer: 0
        options:
          - label: Irises in the asylum garden
            why: >-
              Right. He called painting "the lightning conductor for my illness". In a year at Saint-Rémy he painted
              about 150 pictures, among them The Starry Night, the view from his window before sunrise.
          - label: A portrait of the director
            why: That came later, if at all. Look at the garden.
          - label: The sea at Saintes-Maries
            why: He painted the sea in 1888, before the asylum.
          - label: Sunflowers in a vase
            why: These are not sunflowers.
      - type: choice
        prompt: In February 1890 Theo and his wife Jo had a son, and named him Vincent. What did the painter make for the baby?
        visual: { kind: photo, photo: vg-almond }
        answer: 0
        options:
          - label: Branches of almond blossom against a blue sky, to hang above the parents' bed
            why: >-
              Right. Almond trees flower early in Provence, a sign of new life. The baby, Vincent Willem van Gogh,
              grew up to found the Van Gogh Museum.
          - label: A cradle he carved himself
            why: He painted something for the baby's room.
          - label: A portrait of the baby
            why: He had not seen the baby yet. He painted a tree in flower.
          - label: A copy of a Japanese print of cranes
            why: It looks Japanese, but it is a branch of blossom.
      - type: choice
        prompt: Dr Paul Gachet looked after Van Gogh in Auvers-sur-Oise in his last weeks. In 1990 a version of this portrait set a record. What was it?
        visual: { kind: photo, photo: vg-gachet }
        answer: 0
        options:
          - label: It sold for $82.5 million, then the highest price ever paid for a painting
            why: >-
              Right. A Japanese businessman, Ryoei Saito, bought it at Christie's in New York in May 1990. The doctor
              holds a sprig of foxglove, the plant that gives the heart drug digitalis.
          - label: It was the first painting sent into space
            why: No painting has been sent into space. It made money history.
          - label: It drew the biggest crowd ever seen at a museum
            why: It was sold, not shown.
          - label: It was the first Van Gogh to go to a museum
            why: Museums had bought Van Goghs long before 1990.
      - type: truemyth
        statement: Everyone agrees on how Van Gogh died.
        visual: { kind: photo, photo: vg-auvers-church }
        answer: false
        explain: >-
          Myth. On 27 July 1890 Van Gogh was wounded by a gunshot in the chest, and he died two days later with Theo
          beside him. He said he had shot himself, and most historians, including the researchers of the Van Gogh
          Museum, accept that. In 2011 two biographers, Steven Naifeh and Gregory White Smith, argued it may have been
          an accident or someone else's doing; the museum's researchers answered them in 2013. Theo died six months
          after his brother.
      - type: cause
        prompt: Link each cause to what it led to.
        pairs:
          - [Japanese prints in Paris, Flat bright colour and strong outlines]
          - [Theo sent him money every month, He could paint full-time without selling]
          - [Gauguin threatened to leave Arles, The night of the ear in December 1888]
          - [Jo van Gogh-Bonger kept the paintings and letters, The world came to know him after his death]
        explain: >-
          Van Gogh sold hardly anything in his life. Theo's money kept him painting, and Theo's widow Jo made him famous,
          lending his paintings to exhibitions and publishing his letters in 1914.

  - id: u18-l3
    title: Masks and the Twenty
    icon: mask
    sources:
      - title: "Wikipedia, James Ensor"
        url: https://en.wikipedia.org/wiki/James_Ensor
      - title: "Wikipedia, Christ's Entry Into Brussels in 1889"
        url: https://en.wikipedia.org/wiki/Christ%27s_Entry_Into_Brussels_in_1889
      - title: "J. Paul Getty Museum, Christ's Entry into Brussels in 1889"
        url: https://www.getty.edu/art/collection/object/103RBA
      - title: "Wikipedia, Les XX"
        url: https://en.wikipedia.org/wiki/Les_XX
      - title: "Wikipedia (Dutch), De oestereetster"
        url: https://nl.wikipedia.org/wiki/De_oestereetster
      - title: "Wikipedia, Henry de Groux"
        url: https://en.wikipedia.org/wiki/Henry_de_Groux
      - title: "Wikipedia, Anna Boch"
        url: https://en.wikipedia.org/wiki/Anna_Boch
      - title: "Royal Museums of Fine Arts of Belgium, Fernand Khnopff, Caresses"
        url: https://fine-arts-museum.be/en/the-collection/artist/khnopff-fernand-1/artwork/caresses
      - title: "Wikipedia, Rik Wouters"
        url: https://en.wikipedia.org/wiki/Rik_Wouters
      - title: "Wikipedia, Léon Spilliaert"
        url: https://en.wikipedia.org/wiki/L%C3%A9on_Spilliaert
    exercises:
      - type: story
        title: A shop full of masks
        body: >-
          James Ensor grew up in Ostend above his parents' souvenir shop, among seashells, Chinese porcelain and the
          masks sold for the town's carnival. Masks never left his paintings. In 1883 he and other young artists who
          were tired of being turned down by the official exhibitions founded their own society in Brussels: Les XX,
          the Twenty. For ten years it showed the newest art in Europe.
        visual: { kind: photo, photo: ensor-masks }
      - type: hunt
        prompt: In 1888 Ensor painted a crowd of thousands marching into Brussels behind a band. The painting is named after one small figure. Find Christ.
        photo: ensor-entry
        targets:
          - [0.41, 0.27, 0.1, 0.19]
        explain: >-
          Christ rides a donkey near the middle, a small figure with a yellow halo, raising a hand in blessing. Nobody
          in the crowd is looking at him. Some say he has Ensor's own face.
      - type: story
        title: Christ's Entry into Brussels in 1889
        body: >-
          Ensor painted it in 1888, on a canvas more than four metres wide, and set the scene a year in the future.
          Since 1987 it has hung in the Getty Museum in Los Angeles. Take the tour.
        visual: { kind: painting, painting: ensor-entry }
      - type: choice
        prompt: What does the big red banner over the crowd say?
        visual: { kind: painting, painting: ensor-entry, focus: banner }
        answer: 0
        options:
          - label: "Vive la sociale: long live the social revolution"
            why: >-
              Right. In the 1880s Belgian workers were striking and marching for the vote. Ensor's Christ arrives not to
              a pious welcome but to a carnival of politics, brass bands and masks.
          - label: Welcome to Brussels
            why: Look at the words again. They are a political slogan.
          - label: Long live the King
            why: The banner cheers on something else.
          - label: Les XX
            why: The banner is a political slogan, not the name of his society.
      - type: truemyth
        statement: Les XX hung Christ's Entry into Brussels in their exhibition of 1889.
        visual: { kind: painting, painting: ensor-entry, focus: masks }
        answer: false
        explain: >-
          Myth. Even his own society turned it down. It was first shown in public in 1929, the year King Albert made
          Ensor a baron. Today it is seen as one of the first great Expressionist paintings.
      - type: who
        photo: ensor-easel
        clues:
          - I was born in Ostend in 1860, to an English father and a Flemish mother who kept a souvenir shop.
          - The carnival masks in that shop fill my paintings.
          - I was a founder of Les XX in 1883, but they would not show my biggest painting.
          - The king made me a baron in 1929, and I died in Ostend in 1949, aged 89.
        options: [James Ensor, Fernand Khnopff, Léon Spilliaert, Rik Wouters]
        answer: 0
        explain: >-
          James Ensor, painting himself at his easel. He spent almost his whole life in Ostend; his house above the shop
          is now a museum.
      - type: choice
        prompt: In 1882 Ensor painted a young woman eating oysters alone at a table laid for a feast. A Brussels exhibition society, L'Essor, turned the painting down. Who was she?
        visual: { kind: photo, photo: ensor-oyster }
        answer: 0
        options:
          - label: His sister Mitche
            why: >-
              Right, his younger sister Mariette, called Mitche. After L'Essor said no, in October 1883 Ensor, Fernand Khnopff,
              Théo van Rysselberghe and other young artists founded Les XX, and each year they invited foreign artists to
              show with them in Brussels. The painting hangs in Antwerp.
          - label: The queen of the Belgians
            why: A queen would not eat alone in a plain dining room. It is someone from his family.
          - label: A model from the Brussels academy
            why: He painted at home in Ostend, and the model was family.
          - label: His mother
            why: His mother ran the shop downstairs. The woman at the table is younger.
      - type: choice
        prompt: In 1887 Les XX showed this huge painting by Georges Seurat, made of tiny dots of pure colour. Which Les XX painter took up the dots?
        visual: { kind: photo, photo: seurat-jatte }
        answer: 0
        options:
          - label: Théo van Rysselberghe
            why: >-
              Right. Van Rysselberghe had met Seurat's friends in Paris and became the leading Belgian painter of dots,
              pointillism, for the next ten years.
          - label: James Ensor
            why: Ensor went his own way, with thick paint and masks.
          - label: Fernand Khnopff
            why: Khnopff painted smooth, dreamlike pictures.
          - label: Vincent van Gogh
            why: Van Gogh tried dots in Paris, but he was not a member of Les XX.
      - type: choice
        prompt: Van Rysselberghe painted Anna Boch, the only woman among Les XX. At their show of 1890 she bought something hardly anyone wanted. What?
        visual: { kind: photo, photo: anna-boch }
        answer: 0
        options:
          - label: The Red Vineyard by Van Gogh
            why: >-
              Right. Six Van Goghs hung at Les XX in 1890. Another member, Henry de Groux, refused to have his work in the
              same room as Van Gogh's and was thrown out of the group. Anna Boch, whose brother Eugène was Van Gogh's
              friend, bought The Red Vineyard.
          - label: The whole exhibition
            why: She bought one painting, by a painter few liked.
          - label: Ensor's Christ's Entry into Brussels
            why: That stayed in Ensor's house for decades.
          - label: A Japanese print collection
            why: She bought a painting by a Dutchman in France.
      - type: choice
        prompt: Fernand Khnopff, a founder of Les XX, painted Caresses in 1896. Who leans her head against the young man?
        visual: { kind: photo, photo: khnopff-caresses }
        answer: 0
        options:
          - label: A sphinx, with a woman's face on the body of a spotted big cat
            why: >-
              Right. Khnopff was a Symbolist: he painted dreams, myths and mysteries. The face is that of his sister
              Marguerite, who appears in many of his pictures.
          - label: His dog
            why: Look at the face. It is a woman's.
          - label: A leopard from the zoo
            why: Look at the face. It is a creature of myth.
          - label: A carnival dancer in a costume
            why: She is not in costume. She is a creature from a Greek myth.
      - type: style
        prompt: Symbolism, pointillism or realism? Name the style of each painting.
        groups: [Symbolism, Pointillism, Realism]
        items:
          - photo: toorop-brides
            title: Jan Toorop, The Three Brides, 1893
            group: 0
            tell: "Long, flowing lines, ghostly figures and bells: a dream of good and evil, not a scene you could see."
            box: [0.25, 0.15, 0.5, 0.55]
          - photo: khnopff-caresses
            title: Fernand Khnopff, Caresses, 1896
            group: 0
            tell: A sphinx from a Greek myth and a young man with half-closed eyes, in still, smooth paint.
            box: [0.1, 0, 0.3, 0.6]
          - photo: anna-boch
            title: Théo van Rysselberghe, Anna Boch, about 1889
            group: 1
            tell: Look closely at the background. It is built of small separate dots of colour, set side by side.
