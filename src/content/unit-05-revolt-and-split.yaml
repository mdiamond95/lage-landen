        url: https://www.journalbelgianhistory.be/en/system/files/article_pdf/BTNG-RBHC,%2008,%201977,%203-4,%20pp%20367-446.pdf
      - title: "Demos (NIDI), the 1622 census of Amsterdam (in Dutch)"
        url: https://publ.nidi.nl/demos/2022/demos-38-08.pdf
      - title: "Encyclopaedia Britannica, Simon Stevin"
        url: https://www.britannica.com/biography/Simon-Stevin
      - title: "Museum De Lakenhal, Leiden cloth"
        url: https://www.lakenhal.nl/en/story/leiden-cloth
    exercises:
      - type: story
        title: The great move north
        body: >-
          The king's new governor, Alexander Farnese, Duke of Parma, won back the south town by town. In 1585, after
          a siege of more than a year, Antwerp surrendered. Its Protestants were given four years to convert or
          leave, and tens of thousands went north, taking their money, skills and contacts with them.
        visual: { kind: time-map, map: revolt, year: 1585 }
      - type: who
        photo: parma
        clues:
          - My mother governed the Netherlands from 1559 to 1567.
          - I was the nephew of Philip II and the grandson of Charles V.
          - I won back Flanders and Brabant for the king, one town at a time.
          - I built a bridge of boats across the Scheldt to starve Antwerp.
        options: ["Alexander Farnese, Duke of Parma", The Duke of Alba, Don John of Austria, Maurice of Nassau]
        answer: 0
        explain: >-
          Alexander Farnese, Duke of Parma, son of Margaret of Parma. He was the best general of his age, and the
          border between the Netherlands and Belgium owes much to how far he got.
      - type: hunt
        prompt: To cut Antwerp off from the sea, Parma built a bridge of ships across the Scheldt. Find the bridge.
        photo: antwerp-siege-bridge
        targets: [[0.21, 0.22, 0.36, 0.40], [0.55, 0.55, 0.25, 0.18]]
        explain: >-
          Finished in February 1585, it closed the river. In April an Italian engineer, Federigo Giambelli, sent
          ships packed with gunpowder, the hellburners, against it. One blew up part of the bridge and killed many
          soldiers, but the bridge was repaired and the siege went on.
      - type: scrub
        prompt: Drag the slider to a year when refugees are pouring north out of Antwerp.
        map: revolt
        answer: [1585, 1608]
        explain: >-
          The great wave came after Antwerp fell in 1585. Most went to Holland and Zeeland, and others to Germany
          and England.
      - type: choice
        prompt: Read the chart. About how many people lived in Antwerp in the 1560s, before the troubles?
        visual: { kind: chart, chart: antwerp-amsterdam }
        answer: 2
        options:
          - label: About 25,000
            why: That is closer to Amsterdam's size at the time.
          - label: About 50,000
            why: That is about what Antwerp had around 1500. By 1568 it had doubled.
          - label: About 100,000
            why: >-
              Right. A count in 1568 found about 100,000 people. By 1589, after the fall, only about 42,000 were
              left.
          - label: About 200,000
            why: Only Paris, and later London, reached that size in northern Europe.
      - type: truemyth
        statement: Amsterdam was already bigger than Antwerp before Antwerp fell in 1585.
        visual: { kind: chart, chart: antwerp-amsterdam }
        answer: false
        explain: >-
          Follow the two lines. Amsterdam had about 30,000 people around 1580, less than a third of Antwerp. It
          overtook Antwerp in the 1590s, and a count in 1622 found almost 105,000.
      - type: cause
        prompt: Link each cause to its effect.
        pairs:
          - [Antwerp falls to Parma, Protestant merchants move to Amsterdam]
          - [The Dutch close the Scheldt, Antwerp's port is cut off from the sea]
          - [Flemish cloth workers flee north, Leiden becomes a great cloth town]
        explain: >-
          The south's loss was the north's gain. The money and skills of Antwerp helped build the Dutch Golden
          Age, which is the next unit.
      - type: pin
        prompt: Many refugees settled in Middelburg, the capital of Zeeland. Pin it.
        place: middelburg
        okKm: 25
        explain: >-
          Middelburg lies on Walcheren. With Amsterdam, Leiden and Rotterdam it was one of the towns that took in
          the most people from the south. In all, perhaps 150,000 came north.
      - type: truemyth
        statement: Amsterdam's famous ring of canals was mostly dug after 1600, to house its fast-growing population.
        visual: { kind: photo, photo: amsterdam-1649 }
        answer: true
        explain: >-
          Compare this map with Amsterdam in the 1530s, a small walled town on the IJ. The city decided to expand
          in 1613. The Herengracht was dug from that year, the Prinsengracht and Keizersgracht soon after, and the
          ring was pushed east in stages until the 1660s.
      - type: match
        prompt: Match each migrant from the south to what they did in the north.
        pairs:
          - [Simon Stevin of Bruges, Engineer to Prince Maurice]
          - [Jodocus Hondius of Wakken, Made maps and globes in Amsterdam]
          - [Willem Usselincx of Antwerp, Pushed for a West India Company]
          - [Vondel's parents from Antwerp, Raised the great Dutch poet Joost van den Vondel]

  - id: u5-l6
