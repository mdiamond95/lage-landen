    exercises:
      - type: story
        title: Princes of Orange at war
        body: >-
          With William dead, his son Maurice of Nassau led the Republic's army. He drilled his soldiers and studied
          siege craft, and in the 1590s he won back the north and east. After a twelve-year truce, Maurice's
          half-brother Frederick Henry pushed the front south. In 1648, at Münster, Spain finally made peace.
        visual: { kind: time-map, map: revolt, year: 1588 }
      - type: who
        photo: maurice
        clues:
          - I was born in 1567, a son of William of Orange.
          - I studied at Leiden, and Simon Stevin taught me mathematics.
          - I drilled my soldiers with the same set moves, a model for armies all over Europe.
          - I beat the Spanish on the beach at Nieuwpoort in 1600.
        options: [Maurice of Nassau, Frederick Henry, William of Orange, Ambrogio Spínola]
        answer: 0
        explain: >-
          Maurice of Nassau, Prince of Orange from 1618. A brilliant soldier, he was a hard politician: in 1619 he
          let the old statesman Johan van Oldenbarnevelt be beheaded.
      - type: hunt
        prompt: In March 1590, Dutch soldiers hid under a load of peat on a barge and were let into Breda's castle. Find the barge.
        photo: breda-peat-barge
        targets: [[0.66, 0.29, 0.32, 0.37]]
        explain: >-
          About seventy men lay under the peat. At night they climbed out and took the castle. The peat barge of
          Breda is the Dutch Trojan horse.
      - type: pin
        prompt: On 2 July 1600, Maurice beat a Spanish army on the dunes and beach near Nieuwpoort, in Flanders. Pin it.
        place: nieuwpoort
        okKm: 25
        explain: >-
          The Battle of the Dunes was a victory, but Maurice had to march back north. Flanders stayed Spanish.
      - type: truemyth
        statement: The siege of Ostend, the last rebel town in Flanders, lasted more than three years.
        visual: { kind: photo, photo: ostend-siege }
        answer: true
        explain: >-
          From July 1601 to September 1604. The Spanish general Ambrogio Spínola finally took it, but by then
          Maurice had won Sluis, on the other side of Bruges.
      - type: scrub
        prompt: Drag the slider to a year when the fighting has stopped for the Twelve Years' Truce.
        map: revolt
        start: 1588
        answer: [1609, 1620]
        explain: >-
          The truce was signed in Antwerp on 9 April 1609. Spain treated the Republic, for the moment, as a free
          country, and the fighting started again in 1621.
      - type: truemyth
        statement: The Eighty Years' War was fought for eighty years without a break.
        visual: { kind: photo, photo: fishing-souls }
        answer: false
        explain: >-
          Adriaen van de Venne painted this in 1614, during the Twelve Years' Truce: Protestants and Catholics
          fish for people's souls from their boats. With twelve years of truce in the middle, the war was fought
          for 68 years.
      - type: hunt
        prompt: Velázquez painted Breda surrendering to the Spanish in 1625. The Dutch commander hands over the key of the town. Find the key.
        photo: surrender-breda
        targets: [[0.49, 0.52, 0.09, 0.09]]
        explain: >-
          Justin of Nassau, a son of William of Orange, bows to the Spanish general Spínola, who stops him from
          kneeling. Frederick Henry took Breda back in 1637.
      - type: region
        prompt: The Republic ruled the lands it won in the south as conquered land, with no vote in the States General. The largest is a province of today. Shade it.
        layer: provinces
        answer: [NL-NB]
        explain: >-
          North Brabant, then called States Brabant. Mostly Catholic, it was ruled from The Hague as one of the
          Generality Lands, with States Flanders and Maastricht, until the old Republic fell in 1795.
      - type: hunt
        prompt: Gerard ter Borch painted the envoys swearing to the peace in Münster's town hall on 15 May 1648, and put himself in the picture, at the far edge of the front row. Find the painter, looking out at you.
        photo: munster-ratification
        targets: [[0.0, 0.42, 0.07, 0.14]]
        explain: >-
          He stands at the far left of the front row. The Dutch envoys raise their hands to swear on the left, the
          Spanish swear on the Gospels on the right. The painting is now in the National Gallery in London.
      - type: choice
        prompt: Look at the map in 1648. Which of these was NOT agreed in the Peace of Münster?
        visual: { kind: time-map, map: revolt, year: 1648 }
        answer: 3
        options:
          - label: Spain recognises the Republic as an independent state
            why: That was agreed. After 80 years, Spain gave up its claim to the north.
          - label: Each side keeps the land it holds
            why: That was agreed, in Brabant, Flanders and Limburg as well as in the East and West Indies.
          - label: The Scheldt stays closed
            why: That was agreed, and it kept Antwerp's port shut off from the sea until the 1790s.
          - label: The southern provinces become an independent country
            why: >-
              Right, that came much later. The south stayed under Spain and then Austria, and Belgium only became
              independent in 1830.
      - type: order
        prompt: Put these in order, oldest first.
        items:
          - { label: The peat barge of Breda, year: 1590, when: '1590' }
          - { label: The Battle of Nieuwpoort, year: 1600, when: '1600' }
          - { label: Ostend surrenders, year: 1604, when: '1604' }
          - { label: The Twelve Years' Truce begins, year: 1609, when: '1609' }
          - { label: Breda surrenders to Spínola, year: 1625, when: '1625' }
          - { label: The Peace of Münster, year: 1648, when: '1648' }
        explain: Eighty years after Heiligerlee, the north was a free republic and the south a Spanish province.
      - type: choice
        prompt: Drag the line to wipe from the two unions of 1579 to the Peace of Münster in 1648. What had the Republic won in the south?
        visual: { kind: compare, map: revolt, years: [1579, 1648] }
        answer: 0
        options:
          - label: Northern Brabant, with 's-Hertogenbosch and Breda
            why: >-
              Right, taken town by town by Maurice and Frederick Henry, with a strip of Flanders and Maastricht. The
              Republic ruled these lands from The Hague, without a vote of their own.
          - label: Antwerp
            why: Antwerp fell to Parma in 1585 and stayed Spanish.
          - label: Ghent and Bruges
            why: Flanders fell to Parma in 1584.
          - label: Luxembourg
            why: Luxembourg stayed Spanish throughout.
      - type: sort
        prompt: By the Peace of Münster in 1648, which side held each town?
        groups: [The Dutch Republic, The Spanish king]
        items:
          - { label: Brielle, group: 0, photo: brielle-1572 }
          - { label: Leiden, group: 0, photo: leiden-relief }
          - { label: Breda, group: 0, photo: surrender-breda }
          - { label: Antwerp, group: 1, photo: antwerp-town-hall }
          - { label: Ostend, group: 1, photo: ostend-siege }
        explain: >-
          Brielle and Leiden went over to the revolt in 1572, and Leiden held out through the siege of 1574. Breda fell to Spain in 1625, as Velázquez
          painted it, but Frederick Henry took it back in 1637. Antwerp fell to Parma in 1585, and Ostend to
          Spinola in 1604 after a siege of three years.
      - type: odd
        prompt: Which of these men is the odd one out?
        items:
          - { label: Philip II, photo: philip-ii }
          - { label: The Duke of Alba, photo: alba }
          - { label: Alexander Farnese, Duke of Parma, photo: parma }
          - { label: William of Orange, photo: william-orange }
        answer: 3
        reasons:
          - He led the revolt against the king
          - He was born in Spain
          - He never set foot in the Netherlands
        reason: 0
        explain: >-
          William of Orange led the rebels. Philip II was the king, and Alba and Parma were his governors and
          generals in the Netherlands.
