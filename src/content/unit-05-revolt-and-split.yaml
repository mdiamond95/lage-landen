id: unit-05
number: 5
title: Revolt and the great split
era: 1555 to 1648
summary: Philip II's harsh rule sparks a revolt led by William of Orange. Eighty years of war split the Seventeen Provinces into a Dutch Republic in the north and a Spanish Netherlands in the south, and Antwerp's people and money move to Amsterdam.
lessons:
  - id: u5-l1
    title: Philip II and the Iconoclastic Fury
    icon: cross
    sources:
      - title: "Canon van Nederland, De Opstand (in Dutch)"
        url: https://www.canonvannederland.nl/nl/opstand
      - title: "Rijksmuseum, Hogenberg, The Iconoclastic Fury in Antwerp's Church of Our Lady, 1566"
        url: https://www.rijksmuseum.nl/en/collection/object/Beeldenstorm-in-de-Onze-Lieve-Vrouwekerk-van-Antwerpen-1566--38044342e7c6effa09f85ae1220bf112
      - title: "Encyclopaedia Britannica, Margaret of Parma"
        url: https://www.britannica.com/biography/Margaret-of-Parma
      - title: "Werner Thomas, The myth of the Spanish Inquisition in the Netherlands, BMGN 1990 (in Dutch)"
        url: https://dbnl.org/tekst/_bij005199001_01/_bij005199001_01_0023.php
      - title: "Historisch Nieuwsblad, Testimonies from the Eighty Years' War (in Dutch)"
        url: https://www.historischnieuwsblad.nl/getuigenissen-uit-de-tachtigjarige-oorlog/
    exercises:
      - type: story
        title: A king far away
        body: >-
          In 1555 Charles V handed the Seventeen Provinces to his son, Philip II, who was also king of Spain. Philip
          left for Spain in 1559 and never came back. Within a dozen years his provinces were at war with him, and
          by 1648 they had split in two for good. Press play to watch the split happen, year by year.
        visual: { kind: time-map, map: revolt }
      - type: who
        photo: philip-ii
        clues:
          - I was born in Valladolid, in Spain, in 1527.
          - My father gave me the Netherlands in Brussels in 1555.
          - I left in 1559 and ruled the Low Countries from Spain for the rest of my life.
          - I built the palace of El Escorial and sent the Armada against England.
        options: [Philip II, Charles V, Don John of Austria, Alexander Farnese]
        answer: 0
        explain: >-
          Philip II. A devout Catholic, he meant to stamp out Protestantism in his lands, and he wanted the proud
          provinces to obey his officials and pay their taxes.
      - type: choice
        prompt: When Philip left in 1559, he made this woman governor of the Netherlands. Who was she?
        visual: { kind: photo, photo: margaret-parma }
        answer: 1
        options:
          - label: Margaret of Austria
            why: Margaret of Austria governed for Charles V, but she had died in 1530.
          - label: Margaret of Parma
            why: >-
              Right. She was Philip's half-sister, a daughter of Charles V born in Oudenaarde in Flanders. She ruled
              from Brussels until 1567.
          - label: Mary of Hungary
            why: Mary of Hungary, Charles V's sister, governed before her, until 1555.
          - label: Mary of Burgundy
            why: Mary of Burgundy had died in 1482.
      - type: truemyth
        statement: Philip II brought the Spanish Inquisition to the Netherlands.
        visual: { kind: photo, photo: philip-ii }
        answer: false
        explain: >-
          A myth, though people at the time feared it, and the rebels' pamphlets said he meant to. Heretics were
          already hunted under harsh laws, the placards, and by inquisitors appointed in Charles V's day. But the
          Spanish Inquisition itself was never set up in the Low Countries.
      - type: gap
        prompt: >-
          In April 1566 about 200 nobles marched into Brussels to ask Margaret of Parma to soften the laws against
          heretics. One of her advisers is said to have sneered at them. Fill the gap.
        quote: Madam, do not be afraid. They are only ___.
        source: A courtier, traditionally the Count of Berlaymont, to Margaret of Parma, 5 April 1566
        options: [beggars, children, Frenchmen, peasants]
        answer: 0
        explain: >-
          "Ce ne sont que des gueux": they are only beggars. The nobles took the insult as a badge of honour. At a
          banquet their leader, Hendrik van Brederode, hung a beggar's bag over his shoulder and toasted "Long
          live the beggars!" The rebels have been called the Geuzen, the Beggars, ever since.
      - type: choice
        prompt: In the summer of 1566, crowds met in fields and dunes outside the towns to hear Protestant preachers in the open air. What were these meetings called?
        visual: { kind: photo, photo: hedge-sermon }
        answer: 2
        options:
          - label: Beggars' feasts
            why: The nobles held a banquet in Brussels, but these open-air meetings had another name.
          - label: Field masses
            why: A mass is a Catholic service. These were Protestant sermons.
          - label: Hedge sermons
            why: >-
              Right: hagenpreken in Dutch. In the dunes of Walcheren about 300 people came to the first big one.
              Out in the fields, the town authorities could not easily stop them.
          - label: Synods
            why: A synod is a church council of ministers, not a crowd in a field.
      - type: pin
        prompt: On 10 August 1566, after a hedge sermon, a crowd smashed the statues in a monastery near Steenvoorde, in Flanders. Today it is in France. Pin Steenvoorde.
        place: steenvoorde
        okKm: 30
        fullKm: 12
        explain: >-
          Steenvoorde lies in French Flanders, between Ypres and Cassel. From there the Iconoclastic Fury spread
          north town by town, reaching Antwerp on 20 August and Groningen within weeks.
      - type: hunt
        prompt: In this print of Antwerp's great church on 20 August 1566, crowds wreck the altars and statues. Find someone pulling a statue down with a rope.
        photo: iconoclasm-antwerp
        targets: [[0.21, 0.44, 0.17, 0.27], [0.52, 0.0, 0.08, 0.13]]
        explain: The print is by Frans Hogenberg, who made hundreds of news prints of the revolt.
      - type: scrub
        prompt: Drag the slider to the year of the Iconoclastic Fury.
        map: revolt
        answer: [1566, 1566]
        explain: >-
          1566, the Wonder Year. It shocked Philip, who decided to send an army to restore order and punish the
          rebels.
      - type: order
        prompt: Put these in order, oldest first.
        items:
          - { label: Charles V hands the Netherlands to Philip, year: 1555, when: '1555' }
          - { label: Philip leaves for Spain, year: 1559, when: '1559' }
          - { label: Cardinal Granvelle is recalled, year: 1564, when: '1564' }
          - { label: The Iconoclastic Fury, year: 1566, when: August 1566 }
          - { label: Alba arrives in Brussels, year: 1567, when: August 1567 }
        explain: In twelve years, distrust of a distant king turned into open defiance.

  - id: u5-l2
    title: Alba and the Council of Blood
    icon: sword
    sources:
      - title: "Encyclopaedia Britannica, Council of Troubles"
        url: https://www.britannica.com/topic/Council-of-Troubles
      - title: "Historisch Centrum Leeuwarden, Ad patibulum (in Dutch)"
        url: https://historischcentrumleeuwarden.nl/images/pdf/Ad_patibulum_-_de_galg.pdf
      - title: "Museum Slag bij Heiligerlee, via Visit Groningen"
        url: https://www.visitgroningen.nl/en/plekken/westerwolde/overnachten-westerwolde/hotels-b-bs-en-meer-in-westerwolde/2706206408/museum-slag-bij-heiligerlee-1
      - title: "Encyclopaedia Britannica, Tenth Penny"
        url: https://www.britannica.com/topic/Tenth-Penny
      - title: "visit.brussels, The Renaissance in Brussels"
        url: https://www.visit.brussels/en/visitors/plan-your-trip/the-renaissance-in-brussels
    exercises:
      - type: story
        title: The iron duke
        body: >-
          In August 1567 the Duke of Alba marched into Brussels with about 10,000 Spanish and Italian veterans.
          Margaret of Parma resigned. Alba set up the Council of Troubles to try everyone involved in the
          disorders of 1566. People soon called it the Council of Blood. In June 1568, two of the country's
          greatest nobles were beheaded on the Grand Place in Brussels, as this print shows.
        visual: { kind: photo, photo: egmont-horne-execution }
      - type: who
        photo: alba
        clues:
          - I was Spain's most famous general, already sixty when I came north.
          - I set up a council that condemned thousands for the troubles of 1566.
          - I had the counts of Egmont and Horne beheaded in Brussels.
          - I wanted a tax of a tenth on every sale, and Holland and Zeeland rose against me in 1572.
        options: [The Duke of Alba, Don John of Austria, The Duke of Parma, Cardinal Granvelle]
        answer: 0
        explain: >-
          Fernando Álvarez de Toledo, Duke of Alba. He went home in 1573, his task a failure. In Dutch history he
          is still the villain of the revolt.
      - type: hunt
        prompt: Find the scaffold where the two counts were beheaded, in the middle of the crowded square.
        photo: egmont-horne-execution
        targets: [[0.31, 0.36, 0.38, 0.42]]
        explain: >-
          The counts were beheaded in front of the Broodhuis, the King's House, on 5 June 1568. Thousands watched,
          and many wept.
      - type: choice
        prompt: This statue in Brussels honours the two counts beheaded in 1568. Who were they?
        visual: { kind: photo, photo: egmont-horne-statue }
        answer: 1
        options:
          - label: William and Louis of Nassau
            why: The Nassau brothers escaped to Germany; Louis was killed in battle in 1574.
          - label: Egmont and Horne
            why: >-
              Right. Lamoral, Count of Egmont, had won great victories for Philip against France. Both counts were
              Catholics loyal to the king, which made their execution all the more shocking.
          - label: Breydel and De Coninck
            why: Breydel and De Coninck led the Bruges rising of 1302. Their statue stands in Bruges.
          - label: Alba and Granvelle
            why: Nobody in Brussels raised a statue to Alba or Granvelle.
      - type: truemyth
        statement: The Council of Troubles sentenced more than a thousand people to death.
        visual: { kind: time-map, map: revolt, year: 1567 }
        answer: true
        explain: >-
          About 1,000 people were executed. Some 12,000 were sentenced in all, most of them in their absence, to
          banishment and the loss of everything they owned, because they had already fled abroad.
      - type: pin
        prompt: In May 1568 an army sent by William of Orange beat Alba's troops at Heiligerlee, in Groningen. Pin it.
        place: heiligerlee
        okKm: 30
        fullKm: 12
        explain: >-
          Heiligerlee, on 23 May 1568, is counted as the start of the Eighty Years' War. The rebels were led by
          William's brothers Louis and Adolf, and Adolf was killed there.
      - type: scrub
        prompt: Drag the slider to a year when the war has begun, but the king still holds all of Holland.
        map: revolt
        answer: [1568, 1571]
        explain: >-
          The fighting began in 1568, but the first invasions failed. Holland and Zeeland only went over to the
          rebels in 1572.
      - type: choice
        prompt: Alba wanted to pay for his army with a new tax. What did it take?
        answer: 2
        options:
          - label: One penny from every household each year
            why: Alba's tax hit every sale, not every household.
          - label: Half of every harvest
            why: No ruler could have collected that much.
          - label: A tenth of the price of every sale, for ever
            why: >-
              Right: the Tenth Penny. Alba proposed it in 1569. Even loyal Catholics turned against him, and it was
              never fully collected.
          - label: All church silver
            why: The rebels melted down church silver, not Alba.
      - type: match
        prompt: Match each person to their part in these years.
        pairs:
          - [Margaret of Parma, Resigned as governor in 1567]
          - [The Count of Egmont, Beheaded in Brussels in 1568]
          - [Louis of Nassau, Led the rebel army at Heiligerlee]
          - [The Duke of Alba, Set up the Council of Troubles]
      - type: order
        prompt: Put these in order, oldest first.
        items:
          - { label: The Iconoclastic Fury, year: 1566, when: '1566' }
          - { label: Alba arrives in Brussels, year: 1567, when: '1567' }
          - { label: Egmont and Horne are beheaded, year: 1568, when: June 1568 }
          - { label: Alba proposes the Tenth Penny, year: 1569, when: '1569' }
          - { label: Alba goes home to Spain, year: 1573, when: '1573' }
        explain: Alba's terror was meant to end the trouble. Instead it turned loyal subjects into rebels.

  - id: u5-l3
    title: William of Orange and the Sea Beggars
    icon: ship
    sources:
      - title: "Scientias, How the Duke of Alba lost his glasses (in Dutch)"
        url: https://scientias.nl/niet-zomaar-een-1-aprilgrap-zo-verloor-de-hertog-van-alva-zijn-bril/
      - title: "Royal House of the Netherlands, Wilhelmus: music, lyrics and customs"
        url: https://www.royal-house.nl/topics/monarchy/national-anthem/music-lyrics-and-customs
      - title: "Museum De Lakenhal, Siege and relief of Leiden"
        url: https://www.lakenhal.nl/en/story/siege-and-relief-of-leiden
      - title: "Canon van Nederland, William of Orange"
        url: https://www.canonvannederland.nl/en/willemvanoranje
      - title: "J.Z. Kannegieter, The nickname 'the Silent', De Gids 1942 (in Dutch)"
        url: https://dbnl.org/tekst/_gid001194201_01/_gid001194201_01_0072.php
      - title: "Museum Prinsenhof Delft, 10 July 1584 (in Dutch)"
        url: https://blog.prinsenhof-delft.nl/10-juli-1584-deel6/
      - title: "J. L. Motley, The Rise of the Dutch Republic, 1855, part 6, chapter 4: the ban and the Apology (Project Gutenberg)"
        url: https://www.gutenberg.org/ebooks/4900
    exercises:
      - type: story
        title: Rebels from the sea
        body: >-
          On 1 April 1572 a fleet of rebel privateers, the Sea Beggars, led by Lumey and Treslong, sailed into the
          harbour of Brielle and took the town in the name of the Prince of Orange. Town after town in Holland and
          Zeeland went over to the revolt, and William of Orange became its leader.
        visual: { kind: photo, photo: brielle-1572 }
      - type: who
        photo: william-orange
        clues:
          - I was born in 1533 at Dillenburg, in Germany, and raised a Lutheran.
          - At 11 I inherited the principality of Orange, in the south of France.
          - In 1555 the old emperor leaned on my shoulder as he gave up his lands.
          - I led the revolt against Philip II until I was shot dead in my own house.
        options: [William of Orange, Maurice of Nassau, Louis of Nassau, Frederick Henry]
        answer: 0
        explain: >-
          William of Orange, called the Silent, the Father of the Fatherland. Much of the Dutch royal family's
          name and colour, orange, comes from him.
      - type: pin
        prompt: Pin Brielle, the port the Sea Beggars took on 1 April 1572.
        place: brielle
        fullKm: 10
        okKm: 25
        explain: Brielle, Den Briel in Dutch, guards the mouth of the Maas west of Rotterdam.
      - type: truemyth
        statement: A Dutch rhyme about 1 April 1572 makes a pun on Brielle, because bril is Dutch for glasses.
        visual: { kind: photo, photo: brielle-1572 }
        answer: true
        explain: >-
          "Op 1 april verloor Alva zijn bril": on 1 April Alba lost his glasses, that is, Brielle.
      - type: region
        prompt: The revolt took root in two counties, Holland and Zeeland. Shade the three provinces of today that cover them.
        layer: provinces
        answer: [NL-NH, NL-ZH, NL-ZE]
        explain: >-
          North Holland, South Holland and Zeeland. Their towns, ports and water made them hard to attack, and
          from 1572 they were the heart of the rebel state.
      - type: gap
        prompt: The Wilhelmus, written during the revolt, is now the Dutch national anthem. William himself sings in it. Fill the gap in its first verse.
        quote: William of Nassau am I, of Germanic blood; true to the fatherland I remain until death. A Prince of Orange am I, free and fearless; the King of Spain I have always ___.
        source: Het Wilhelmus, written between 1568 and 1572, first verse in English
        options: [honoured, fought, feared, hated]
        answer: 0
        explain: >-
          "Den Coninck van Hispangien heb ick altijt gheeert": the King of Spain I have always honoured. The rebels
          claimed to fight the king's bad advisers, not the king. The song is often credited to Marnix of Saint
          Aldegonde, but nobody knows who wrote it. It has been the national anthem since 1932.
      - type: story
        title: Hear the Wilhelmus
        body: >-
          An early recording of the song, made in 1899, more than thirty years before it became the national anthem.
          It is still sung before international football matches and at the remembrance of the dead on 4 May.
        visual: { kind: sound, sound: wilhelmus-1899 }
      - type: choice
        prompt: In 1574 the rebels broke the dikes and sailed a fleet across the flooded land to save this besieged town. What did the starving townspeople get when it arrived on 3 October?
        visual: { kind: photo, photo: leiden-relief }
        answer: 1
        options:
          - label: Cheese and beer
            why: Cheese and beer were common food, but not what the fleet handed out.
          - label: Herring and white bread
            why: >-
              Right. Leiden still celebrates 3 October with herring and white bread. Legend adds a pot of hutspot,
              a stew, found in the abandoned Spanish camp. The siege had cost over 6,000 lives, almost half the
              town.
          - label: Apples and cabbage
            why: The fleet brought sea fish and bread.
          - label: Nothing, the town had already fallen
            why: Leiden held out, and the Spanish army pulled back as the water rose.
      - type: truemyth
        statement: William of Orange was called the Silent because he hardly ever spoke.
        visual: { kind: photo, photo: william-orange }
        answer: false
        explain: >-
          A myth. He was sociable and talkative. His enemies called him taciturnus, "the silent", meaning sly: a
          man who kept his plans to himself. Only centuries later did the nickname become a compliment.
      - type: voices
        prompt: In 1580 Philip II outlawed William of Orange, and William answered him. What did the king promise whoever killed William?
        voices:
          - who: Philip II, king of Spain, in his ban against William
            when: 15 March 1580
            text: For these causes we declare him traitor and miscreant, enemy of ourselves and of the country. And if anyone of our subjects or any stranger should be found sufficiently generous of heart to rid us of this pest, delivering him to us, alive or dead, or taking his life, we will cause to be furnished to him the sum of twenty-five thousand crowns in gold.
            photo: philip-ii
          - who: William of Orange, in his Apology, read to the States General at Delft
            when: December 1580
            text: I am in the hand of God; my worldly goods and my life have been long since dedicated to His service. He will dispose of them as seems best for His glory and my salvation.
            photo: william-orange
        options:
          - 25,000 crowns in gold, a pardon for any crime, and a noble title
          - William's lands in Holland
          - A place at the king's court in Madrid
          - Nothing; the ban only sent William into exile
        answer: 0
        explain: >-
          Gold, a pardon and a title. William's Apology turned the charge round: Philip had broken his oaths to the
          provinces, so he had no right to rule them. In 1581 the States went further with the Act of Abjuration, and
          in 1584 William was shot dead in Delft. Both texts are quoted in the translation of the historian John
          Lothrop Motley.
      - type: hunt
        prompt: On 10 July 1584 William was shot in the Prinsenhof in Delft, his home. The holes left by the bullets can still be seen. Find them.
        photo: prinsenhof-bullet-holes
        targets: [[0.39, 0.67, 0.36, 0.15]]
        explain: >-
          The killer, Balthasar Gerards, was a Catholic from Franche-Comté, after the reward of 25,000 gold crowns
          that Philip had offered for William's death. William was buried in the New Church in Delft, because the
          family tomb at Breda was in Spanish hands.
      - type: scrub
        prompt: Drag the slider to a year when Holland has gone over to the rebels, but nearly every other province is still the king's.
        map: revolt
        answer: [1572, 1575]
        explain: >-
          From 1572 to 1576 Holland and Zeeland fought the king almost alone. Then the Spanish Fury drove the
          other provinces to join them.
      - type: order
        prompt: Put these in order, oldest first.
        items:
          - { label: The Sea Beggars take Brielle, year: 1572, when: April 1572 }
          - { label: Haarlem surrenders after a long siege, year: 1573, when: July 1573 }
          - { label: Leiden is relieved, year: 1574, when: October 1574 }
          - { label: Leiden University is founded, year: 1575, when: '1575' }
          - { label: William is shot in Delft, year: 1584, when: July 1584 }
        explain: Holland held out, and Leiden's university trained the ministers and lawyers of the new state.

  - id: u5-l4
    title: Two unions
    icon: book
    sources:
      - title: "Raymond Fagel, The Spanish Fury in Antwerp, Early Modern Low Countries 2020"
        url: https://emlc-journal.org/article/view/7257/7885
      - title: "Flemish heritage inventory, Antwerp town hall (in Dutch)"
        url: https://inventaris.onroerenderfgoed.be/erfgoedobjecten/4032
      - title: "Encyclopaedia Britannica, Pacification of Ghent"
        url: https://www.britannica.com/event/Pacification-of-Ghent
      - title: "Encyclopaedia Britannica, Union of Arras"
        url: https://www.britannica.com/topic/Union-of-Arras
      - title: "Encyclopaedia Britannica, Union of Utrecht"
        url: https://www.britannica.com/topic/Union-of-Utrecht
      - title: "House of Representatives of the Netherlands, Act of Abjuration on display (in Dutch)"
        url: https://www.tweedekamer.nl/nieuws/kamernieuws/%E2%80%98plakkaat-van-verlatinghe%E2%80%99-tentoongesteld-de-kamer
    exercises:
      - type: story
        title: The Spanish Fury
        body: >-
          On 4 November 1576, Spanish soldiers who had not been paid for months stormed Antwerp, looting and
          killing. Thousands died: people at the time spoke of 7,000 or more, though historians today count fewer.
          Four days later the provinces made a pact, the Pacification of Ghent: nearly all of them would stand with
          Holland and Zeeland to drive the foreign troops out.
        visual: { kind: photo, photo: spanish-fury }
      - type: truemyth
        statement: Antwerp's brand-new town hall was set on fire during the Spanish Fury.
        visual: { kind: photo, photo: antwerp-town-hall }
        answer: true
        explain: >-
          The town hall had been finished only in 1565. In the fire only its outer walls were left standing, and
          rebuilding began in 1579, inside the old walls you still see today.
      - type: scrub
        prompt: Drag the slider to a year when nearly all the provinces stand together against the king's troops.
        map: revolt
        start: 1572
        answer: [1576, 1578]
        explain: >-
          After the Pacification of Ghent in 1576, almost the whole country was against the Spanish army. The
          unity did not last: Catholics and Calvinists soon distrusted each other more than they did the king.
      - type: choice
        prompt: Look at the map in 1579. In January the provinces in the south-west made their peace with the king in the Union of Arras. Which?
        visual: { kind: time-map, map: revolt, year: 1579 }
        answer: 0
        options:
          - label: Artois, Hainaut and Walloon Flanders
            why: >-
              Right. Artois, Hainaut and the town of Douai signed first, and Lille and Orchies joined them. These
              Catholic, French-speaking lands wanted peace, their old rights and their faith.
          - label: Flanders and Brabant
            why: Flanders and Brabant still sided with the rebels in 1579.
          - label: Holland and Zeeland
            why: Holland and Zeeland were the heart of the revolt.
          - label: Luxembourg and Namur
            why: Luxembourg had never joined the rebels, and Don John had already seized Namur.
      - type: pin
        prompt: The Union of Arras was signed in the capital of Artois, today in France. Pin Arras.
        place: arras
        okKm: 30
        fullKm: 12
        explain: >-
          Arras lies in northern France. Artois stayed Spanish until France took it in the 1600s.
      - type: region
        prompt: On 23 January 1579 Holland, Zeeland, Utrecht and Guelders signed the Union of Utrecht, promising to fight on together. Shade those lands, using today's provinces.
        layer: provinces
        answer: [NL-NH, NL-ZH, NL-ZE, NL-UT, NL-GE]
        explain: >-
          North and South Holland, Zeeland, Utrecht and Gelderland. Overijssel, Friesland and Groningen joined
          soon after, and so, for a few years, did Ghent, Bruges, Ypres, Antwerp and Breda in the south. The union
          served as the Republic's constitution until 1795.
      - type: gap
        prompt: Article 13 of the Union of Utrecht promised something new in the Europe of its day. Fill the gap.
        visual: { kind: photo, photo: union-utrecht }
        quote: Each person shall remain free in his religion, and no one shall be ___ or investigated because of his religion.
        source: Union of Utrecht, article 13, 23 January 1579
        options: [persecuted, taxed, honoured, baptised]
        answer: 0
        explain: >-
          Freedom of conscience: what you believed in private could not be punished. It did not mean freedom of
          worship. Each province decided which church could hold public services, and in Holland and Zeeland only
          the Reformed church could.
      - type: gap
        prompt: In 1581 the States General declared that Philip was no longer their ruler. Fill the gap in their reason.
        visual: { kind: photo, photo: abjuration }
        quote: A prince is constituted by God to be ruler of a people, to defend them from oppression and violence as the ___ his sheep.
        source: Act of Abjuration, 26 July 1581, in an English translation of 1907
        options: [shepherd, father, wolf, farmer]
        answer: 0
        explain: >-
          A prince who oppresses his people instead of protecting them, it went on, is no longer a prince but a
          tyrant, and his subjects may choose another. Some historians see it as a model for the American
          Declaration of Independence of 1776, though the link is debated.
      - type: match
        prompt: Match each agreement to what it did.
        pairs:
          - [Pacification of Ghent, United the provinces against the Spanish troops]
          - [Union of Arras, Brought the Walloon provinces back to the king]
          - [Union of Utrecht, Bound the north to fight on together]
          - [Act of Abjuration, Declared Philip no longer their ruler]
