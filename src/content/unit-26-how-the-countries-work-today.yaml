    exercises:
      - type: story
        title: Two houses of 150
        body: >-
          The Dutch House of Representatives, the Tweede Kamer, and the Belgian Chamber of Representatives each have 150
          seats, shared out among the parties by their share of the vote. No party ever wins half, so every government
          is a coalition. This is the Dutch house after the election of October 2025. Tap a party to pick out its
          seats, and tick the box to see which parties govern.
        visual: { kind: seats, chamber: tk-2025 }
      - type: choice
        prompt: Fifteen parties won seats in the Dutch election of 2025, and the two biggest, D66 and the PVV, won 26 each. How many seats does a government need to be sure of passing its laws?
        visual: { kind: seats, chamber: tk-2025, hideCabinet: true }
        answer: 2
        options:
          - label: "26"
            why: That is the biggest party alone. A majority is half of 150 and one more, 76.
          - label: "75"
            why: Seventy-five is half, a tie. A majority is 76.
          - label: "76"
            why: >-
              Right. D66, the VVD and CDA formed the Jetten cabinet in February 2026 with only 66 seats, a minority
              government that must find votes for each law. Rob Jetten, 38, is the youngest Dutch prime minister ever.
          - label: "100"
            why: Two-thirds is needed only to change the constitution. A majority is 76.
      - type: choice
        prompt: This is the Belgian Chamber after the election of June 2024. The Dutch-speaking parties hold 81 seats between them, a majority. Why can't they form a government on their own?
        visual: { kind: seats, chamber: be-2024, hideCabinet: true }
        answer: 1
        options:
          - label: The king must approve every party
            why: The king has no such power. The constitution asks for as many French-speaking ministers as Dutch-speaking ones.
          - label: The constitution says the cabinet has as many French-speaking ministers as Dutch-speaking ones
            why: >-
              Right: Article 99, apart from the prime minister. So a government needs parties from both sides. Bart De
              Wever's government, sworn in on 3 February 2025, joins five parties, three Flemish and two French-speaking,
              with 82 seats.
          - label: Brussels must have its own prime minister
            why: Brussels has its own regional government, but that is not the reason. The federal cabinet must be half French-speaking.
          - label: The French-speaking parties have more votes
            why: They have fewer seats. The rule is that the cabinet must be half French-speaking.
      - type: gap
        prompt: Belgium made voting compulsory for men in 1893, when every man got a vote, and for women in 1948. The constitution still says so. Fill the gap.
        quote: "Voting is ___ and secret."
        source: The Belgian Constitution, Article 62 (English translation)
        visual: { kind: seats, chamber: be-2024, hideCabinet: true }
        options: [compulsory, free, public, optional]
        answer: 0
        explain: >-
          Compulsory. Strictly, a Belgian must turn up at the polling station; what happens in the booth is secret. Fines
          are rarely handed out now, but turnout is still close to nine in ten. Since 2024 Belgians of 16 and 17 have
          voted in European elections, and Flanders dropped the duty for its municipal elections that year.
      - type: scrub
        prompt: The Netherlands had compulsory voting too, for a while. Drag the slider to the years when Dutch voters had to go to the polls.
        map: state
        start: 1990
        answer: [1917, 1969]
        explain: >-
          From 1917 to 1970. The duty came with the vote for every man in 1917 and was dropped in 1970, when the parties
          agreed that a vote should be a right, not a duty. Turnout fell from about 95% to under 80%.
      - type: truemyth
        statement: In the Dutch election of 1918, the first in which every man could vote, a man who stayed at home could be fined.
        visual: { kind: photo, photo: voting-1918 }
        answer: true
        explain: >-
          True. The constitution of 1917 gave every man of 25 the vote and made him turn up at the polling station, on
          pain of a small fine. The election of July 1918 was the first held with seats shared out by share of the vote.
          Women could stand in 1918 and vote from 1919; their first general election was in 1922.
      - type: truemyth
        statement: Dutch voters still mark their ballot by hand, with a red pencil.
        visual: { kind: photo, photo: red-pencil }
        answer: true
        explain: >-
          True. In 2006 most Dutch voters used voting computers, until campaigners showed that their signals could be
          picked up from outside the polling station. They were withdrawn in 2007, and the red pencil came back on a
          ballot the size of a newspaper page. Much of Belgium votes on computers that print a paper slip.
      - type: choice
        prompt: Belgium holds the world record for forming a government, 541 days after 2010. The Netherlands set its own record after the election of March 2021. How long did it take?
        visual: { kind: photo, photo: ridderzaal }
        answer: 2
        options:
          - label: 54 days
            why: Far longer. It took 299 days, until the fourth Rutte cabinet was sworn in on 10 January 2022.
          - label: 154 days
            why: Far longer. It took 299 days, until the fourth Rutte cabinet was sworn in on 10 January 2022.
          - label: 299 days
            why: >-
              Right, from 17 March 2021 to 10 January 2022, slowed by a leaked note that showed a scout's talks about an
              awkward member of parliament, "a post elsewhere" for Pieter Omtzigt. In the end the same four parties as
              before formed the fourth Rutte cabinet. The old cabinet ran the country in the meantime.
          - label: 541 days
            why: That is Belgium's record, from June 2010 to December 2011. The Dutch one is 299 days.
      - type: truemyth
        statement: Since 2012 the Dutch king has had no part in forming a cabinet.
        visual: { kind: photo, photo: tweede-kamer }
        answer: true
        explain: >-
          True. Until 2012 the queen met the party leaders after an election and appointed the informateur who sounded
          them out. Since then the House of Representatives appoints its own scouts and informateurs, and the king
          only swears in the cabinet. The house has met in a temporary chamber since 2021, while the Binnenhof is
          rebuilt.
      - type: choice
        prompt: In 1983 the members of the States of North Brabant cast these votes in their provincial house in Den Bosch. What were they electing?
        visual: { kind: photo, photo: staten-vote-1983 }
        answer: 0
        options:
          - label: The Senate of the Netherlands
            why: >-
              Right. The 75 members of the Eerste Kamer, the Senate, are elected by the members of the twelve provincial
              parliaments, a few weeks after the provincial elections. So when the Dutch vote for their province they
              also choose, at one remove, the Senate.
          - label: The King's Commissioner of the province
            why: The commissioner is appointed by the Crown for six years. They were electing the Senate.
          - label: The mayors of North Brabant
            why: Dutch mayors are appointed by the Crown too. They were electing the Senate.
          - label: The board of a water board
            why: Water boards are elected by the voters themselves. They were electing the Senate.
      - type: cause
        prompt: Link each cause to what it led to.
        pairs:
          - [No party wins half the seats, Every government is a coalition of several parties]
          - ["Seats are shared out by share of the vote, nationwide", Fifteen parties sit in the Dutch House]
          - ["Belgium's parties split along the language line in the 1960s and 1970s", "Each side has its own socialists, liberals and Christian democrats"]
          - [Voting is compulsory in Belgium, Close to nine in ten Belgians vote]
        explain: >-
          Proportional representation came to Belgium in 1899, the first country to use it for a whole parliament, and to
          the Netherlands in 1917. A Dutch party needs about 0.67% of the vote, one seat's worth; a Belgian one needs 5%
          in a constituency.

  - id: u26-l3
    title: Twelve provinces
    icon: puzzle
    sources:
      - title: "Wikipedia, Provinces of the Netherlands"
        url: https://en.wikipedia.org/wiki/Provinces_of_the_Netherlands
      - title: "Wikipedia, Holland"
        url: https://en.wikipedia.org/wiki/Holland
      - title: "Wikipedia, Flevoland"
        url: https://en.wikipedia.org/wiki/Flevoland
      - title: "Wikipedia, Houtribdijk"
        url: https://en.wikipedia.org/wiki/Houtribdijk
      - title: "Wikipedia, Paviljoen Welgelegen"
        url: https://en.wikipedia.org/wiki/Paviljoen_Welgelegen
      - title: "Wikipedia, King's Commissioner"
        url: https://en.wikipedia.org/wiki/King%27s_Commissioner
      - title: "CBS StatLine, population of the provinces on 1 January 2024"
        url: https://opendata.cbs.nl/statline/#/CBS/nl/dataset/37230ned/table
      - title: "Wikimedia Commons, flags of the Dutch provinces"
        url: https://commons.wikimedia.org/wiki/Category:Flags_of_provinces_of_the_Netherlands
    exercises:
      - type: story
        title: Provinces that were once states
        body: >-
          The Netherlands has twelve provinces. Seven of them, Holland, Zeeland, Utrecht, Gelderland, Overijssel,
          Friesland and Groningen, were the seven united provinces of the Dutch Republic; Drenthe, Brabant and Limburg
          were added later. Each elects its own parliament, the Provincial States, which runs roads, nature and planning,
          and each is led by a King's Commissioner appointed for six years. Tap a province to see its flag, its capital and
          how many people live there.
        visual: { kind: provinces, country: NLD }
      - type: drill
        prompt: Find these Dutch provinces on the map.
        country: NLD
        rounds: 6
        misses: 1
        explain: >-
          South Holland has the most people, 3.8 million; Zeeland the fewest, under 400,000. Friesland is the biggest
          once its water is counted, Gelderland the biggest on land, and Utrecht the smallest overall.
      - type: truemyth
        statement: Holland is just another name for the Netherlands.
        visual: { kind: time-map, map: state, year: 1839 }
        answer: false
        explain: >-
          A myth, though a common one. Holland was the richest of the seven provinces of the Republic, which is how its
          name came to stand for the whole country. Since 1840 it has been two provinces, North and South Holland, home to
          Amsterdam, Rotterdam and The Hague. In 2020 the Dutch government stopped using Holland to promote the country.
      - type: scrub
        prompt: Drag the slider to the years when the Netherlands had eleven provinces.
        map: state
        start: 1839
        answer: [1840, 1985]
        explain: >-
          From 1840, when Holland was split in two, to 1985. On 1 January 1986 the three polders won from the Zuiderzee
          became Flevoland, the twelfth province.
      - type: choice
        prompt: This villa was built in the 1780s as the summer house of the banker Henry Hope, and in 1808 King Louis Bonaparte bought it. Since 1930 it has housed the government of North Holland. In which city?
        visual: { kind: photo, photo: welgelegen }
        answer: 1
        options:
          - label: Amsterdam
            why: Amsterdam is the capital of the country, but not of its province. Welgelegen stands in Haarlem.
          - label: Haarlem
            why: >-
              Right. Haarlem has been the capital of North Holland since the province was made in 1840, though Amsterdam
              has more than five times as many people. In the same way The Hague, not Rotterdam, is the capital of South Holland.
          - label: Alkmaar
            why: Alkmaar is a market town in North Holland, but its capital is Haarlem.
          - label: Zaandam
            why: Zaandam is in North Holland, but its capital is Haarlem.
      - type: choice
        prompt: This dam runs 26 km across the water to Lelystad, capital of the youngest province. What is unusual about Flevoland's land?
        visual: { kind: photo, photo: houtribdijk }
        answer: 0
        options:
          - label: It was the bottom of the Zuiderzee until between 1942 and 1968
            why: >-
              Right. The Noordoostpolder fell dry in 1942, East Flevoland in 1957 and South Flevoland in 1968. Lelystad,
              named after the engineer Cornelis Lely, and Almere, now the biggest town, were built on it from nothing.
              The Noordoostpolder joined Flevoland in 1986.
          - label: It belongs to no municipality
            why: It is divided into municipalities like any other. Its land was the bottom of the Zuiderzee until 1942 to 1968.
          - label: It is an island in the Wadden Sea
            why: It lies in the middle of the country. Its land was the bottom of the Zuiderzee until 1942 to 1968.
          - label: It was German until 1945
            why: It was never German. Its land was the bottom of the Zuiderzee until 1942 to 1968.
      - type: drill
        prompt: Find each Dutch province by its capital.
        country: NLD
        ask: capital
        rounds: 6
        misses: 1
        explain: >-
          Some capitals are small: Assen in Drenthe, Middelburg in Zeeland and Lelystad in Flevoland. Den Bosch, the
          capital of North Brabant, is officially 's-Hertogenbosch, the duke's wood.
      - type: truemyth
        statement: Friesland's official name has been in Frisian, Fryslân, since 1997.
        visual: { kind: photo, photo: flag-friesland }
        answer: true
        explain: >-
          True. Frisian is the second official language of the Netherlands, spoken at home by about half the province.
          The seven red leaves on the flag, pompeblêden, stand for the seven Frisian sea lands of the Middle Ages.
      - type: sort
        prompt: Sort these provinces by the neighbour they border.
        visual: { kind: provinces, country: NLD }
        groups: [Belgium, Germany, Neither]
        items:
          - { label: Zeeland, group: 0 }
          - { label: North Brabant, group: 0 }
          - { label: Groningen, group: 1 }
          - { label: Overijssel, group: 1 }
          - { label: Drenthe, group: 1 }
          - { label: Utrecht, group: 2 }
          - { label: Friesland, group: 2 }
          - { label: Flevoland, group: 2 }
        explain: >-
          Five provinces border Germany and three Belgium. Limburg, left out here, borders both. Utrecht and Flevoland are
          the only ones without a coast or a foreign border, unless the IJsselmeer counts.

