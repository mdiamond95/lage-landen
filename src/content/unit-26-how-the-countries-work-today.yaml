    exercises:
      - type: story
        title: A capital that is not the seat, and a seat of many capitals
        body: >-
          The Netherlands has its capital in Amsterdam and its parliament, government and king in The Hague. Belgium has
          everything in Brussels, which is also the capital of Flanders, of the French Community and, in all but name, of
          the European Union. Slide to today to see the twelve Dutch provinces, the three Belgian regions and the seats of
          power on one map.
        visual: { kind: time-map, map: state, year: 2026 }
      - type: gap
        prompt: The Dutch constitution names the country's capital in only one place, the article on the new king. Fill the gap.
        quote: "As soon as possible after assuming the royal prerogative the King shall be sworn in and inaugurated in the capital city, ___, at a public and joint session of the two Houses of the States General."
        source: The Constitution of the Kingdom of the Netherlands, Article 32 (English translation)
        visual: { kind: photo, photo: huis-ten-bosch }
        options: [Amsterdam, The Hague, Utrecht, Rotterdam]
        answer: 0
        explain: >-
          Amsterdam, named as the capital in the constitution only since 1983. The king lives at Huis ten Bosch, in a wood in The Hague,
          and works at Noordeinde Palace in the city centre; the palace on the Dam in Amsterdam is kept for state visits.
      - type: truemyth
        statement: The Hague is the capital of the Netherlands.
        visual: { kind: photo, photo: tweede-kamer }
        answer: false
        explain: >-
          A myth. The Hague is the seat of government, of parliament and of the king, and of the world's courts in the
          Peace Palace and the International Criminal Court, but the capital is Amsterdam. The counts of Holland held
          court in The Hague from the 1200s, and the States General stayed.
      - type: choice
        prompt: Brussels is the capital of many things. Which of these is it not the capital of?
        visual: { kind: provinces, country: BEL }
        answer: 3
        options:
          - label: Belgium
            why: It is, by the constitution. The capital of Flemish Brabant is Leuven.
          - label: Flanders
            why: It is, though it lies outside Flanders. The capital of Flemish Brabant is Leuven.
          - label: The French Community of Belgium
            why: It is. The capital of Flemish Brabant is Leuven.
          - label: The province of Flemish Brabant
            why: >-
              Right: that is Leuven, since 1995. Brussels belongs to no province at all. It is the capital of Belgium, of
              Flanders, of the French Community and of its own region, and the home of the European Commission, the
              Council and NATO.
      - type: choice
        prompt: This house in Leiden was, from 1578, the seat of Rijnland, the oldest water board in the Netherlands, first named in a charter of 1255. Who chooses the boards of the 21 Dutch water boards today?
        visual: { kind: photo, photo: rijnland-house }
        answer: 2
        options:
          - label: The king
            why: The king appoints the chair, the dike-reeve, but the board is elected. Voters choose it on the day of the provincial elections.
          - label: The farmers whose land they drain
            why: Landowners and farmers keep some seats of their own, but most are elected by all the voters, on the day of the provincial elections.
          - label: The voters, on the day of the provincial elections
            why: >-
              Right. Every resident pays the water board tax and has a vote, cast with the same red pencil on the same day
              as the provincial elections. The boards keep the dikes, the water levels and the sewage plants. Rijnland
              now works from a modern office on the edge of Leiden.
          - label: The provinces
            why: The provinces watch over them, but the boards are elected by the voters, on the day of the provincial elections.
      - type: truemyth
        statement: In Baarle, where the border runs through houses, a house belongs to the country its front door stands in.
        visual: { kind: photo, photo: baarle-border }
        answer: true
        explain: >-
          True, by long custom. Baarle-Hertog is 22 scraps of Belgium inside the Netherlands, with seven scraps of the
          Netherlands inside them again, left over from the land deals of the dukes of Brabant and the lords of Breda in
          the Middle Ages. The house numbers carry little flags, and a few families have moved their front door.
      - type: hunt
        prompt: In Baarle the border is marked on the ground. Find the line outside this café.
        photo: baarle-cafe
        targets:
          - [0.44, 0.68, 0.26, 0.32]
          - [0.64, 0.42, 0.18, 0.26]
          - [0.76, 0.15, 0.17, 0.27]
        explain: >-
          The white crosses mark the border, with NL on one side and B on the other. In a café on the line, customers
          once moved to the Belgian tables when Dutch closing time came.
      - type: choice
        prompt: Drag the divider between 1839 and today. How many more provinces do the two countries have now than in 1839?
        visual: { kind: compare, map: state, years: [1839, 2026] }
        answer: 1
        options:
          - label: One
            why: More. Holland and Brabant were split in two, and Flevoland was made.
          - label: Three
            why: >-
              Right: 19 then, 22 now. The Netherlands went from ten to twelve, with Holland split in 1840 and Flevoland
              made in 1986, and Belgium from nine to ten, with Brabant split in 1995 and Brussels left out.
          - label: Five
            why: Fewer. Holland and Brabant were split in two, and Flevoland was made.
          - label: None
            why: The map changed. Holland and Brabant were split in two, and Flevoland was made.
      - type: drill
        prompt: Every province by its flag. Find the province that flies each one.
        country: both
        ask: flag
        rounds: 6
        misses: 2
        explain: >-
          Many flags carry an old coat of arms: the lions of Limburg, Hainaut and Brabant, the cross of Utrecht, the
          perron of Liège. The flag of the Brussels region is a stylised iris, a flower of its marshes.
      - type: sort
        prompt: The Netherlands, Belgium, or both?
        visual: { kind: time-map, map: state, year: 2026 }
        groups: [The Netherlands, Belgium, Both]
        items:
          - { label: Twelve provinces, group: 0 }
          - { label: Its seat of government is not its capital, group: 0 }
          - { label: Three islands in the Caribbean are part of it, group: 0 }
          - { label: Three regions and three communities, group: 1 }
          - { label: Voting is compulsory, group: 1 }
          - { label: A lower house of 150 seats, group: 2 }
          - { label: A king who is never crowned, group: 2 }
          - { label: A founder of the Benelux, NATO and the EEC, group: 2 }
        explain: >-
          Bonaire, Sint Eustatius and Saba have been special municipalities of the Netherlands since 2010. Aruba, Curaçao
          and Sint Maarten are countries of their own within the Kingdom of the Netherlands.
      - type: drill
        prompt: The final drill. Find every province of both countries, and Brussels.
        country: both
        rounds: 10
        misses: 2
        explain: >-
          Twenty-two provinces and one capital region, home to nearly 30 million people. That is the map of the Low Countries
