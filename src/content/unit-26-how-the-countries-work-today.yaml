    exercises:
      - type: story
        title: Ten provinces, three regions
        body: >-
          Belgium has ten provinces, five in Flanders and five in Wallonia, and a capital region, Brussels, that belongs to
          none. Since the state reforms the regions, with their own parliaments, run most things that touch the land:
          roads, housing, farming, jobs. The provinces are older, from the French départements of 1795, and their
          governors are now appointed by the regions. Tap a province to see its flag and its capital.
        visual: { kind: provinces, country: BEL }
      - type: drill
        prompt: Find these Belgian provinces on the map.
        country: BEL
        rounds: 6
        misses: 1
        explain: >-
          Antwerp has the most people, 1.9 million; Luxembourg, the biggest province, the fewest, under 300,000. Walloon
          Brabant is the smallest.
      - type: choice
        prompt: The Walloon government meets in this house on the bank of the Meuse. Which city did the Walloon Region choose as its capital in 1986?
        visual: { kind: photo, photo: elysette }
        answer: 1
        options:
          - label: Liège
            why: Liège is the biggest city region of Wallonia, but the capital is Namur, in the middle.
          - label: Namur
            why: >-
              Right. Namur lies between Liège and Charleroi, the two big rivals, where the Sambre meets the Meuse. The
              house is the Elysette, in Jambes, across the river; the Walloon Parliament sits in an old hospital in the
              centre of Namur.
          - label: Charleroi
            why: Charleroi has the most people in Wallonia, but the capital is Namur.
          - label: Mons
            why: Mons is the capital of Hainaut. The capital of Wallonia is Namur.
      - type: truemyth
        statement: The Flemish Parliament and the Flemish government sit outside Flanders.
        visual: { kind: provinces, country: BEL, focus: BE-BRU }
        answer: true
        explain: >-
          True: in Brussels, which is in no Flemish province. Flanders merged its region and its community in 1980 and
          chose Brussels as its capital, to show that it would not give up the city or its Dutch-speaking people.
          Wallonia kept them apart, so the French Community sits in Brussels and the Walloon Region in Namur.
      - type: scrub
        prompt: Drag the slider to the years when Flanders and Wallonia already existed as regions, but Brabant was still one province across the language border.
        map: state
        start: 1970
        answer: [1980, 1994]
        explain: >-
          From 1980, when the second state reform made the regions, to 1994. On 1 January 1995 Brabant was split into
          Flemish Brabant, Walloon Brabant and Brussels.
      - type: choice
        prompt: Drag the divider between 1979 and 1995. What happened to the province of Brabant?
        visual: { kind: compare, map: state, years: [1979, 1995] }
        answer: 0
        options:
          - label: It was split into Flemish Brabant, Walloon Brabant and Brussels, which belongs to no province
            why: >-
              Right. Flemish Brabant has its capital in Leuven and Walloon Brabant in Wavre. Brabant had been one land
              since the dukes of the Middle Ages; its name lives on in the Dutch province of North Brabant, and in the
              title of the heir to the Belgian throne, Duke or Duchess of Brabant.
          - label: It became part of the province of Antwerp
            why: Antwerp kept its borders. Brabant was split in three.
          - label: It was given to the German-speaking Community
            why: That is in the east, in the province of Liège. Brabant was split in three.
          - label: It was renamed Brussels
            why: Brussels left it. Brabant was split into Flemish Brabant, Walloon Brabant and Brussels.
      - type: sort
        prompt: Before 1980 every Belgian province looked the same on the map. Sort these into the region they belong to today.
        visual: { kind: time-map, map: state, year: 1979 }
        groups: [Flanders, Wallonia]
        items:
          - { label: Antwerp, group: 0 }
          - { label: Limburg, group: 0 }
          - { label: East Flanders, group: 0 }
          - { label: Flemish Brabant, group: 0 }
          - { label: Hainaut, group: 1 }
          - { label: Namur, group: 1 }
          - { label: Luxembourg, group: 1 }
          - { label: Liège, group: 1 }
        explain: >-
          West Flanders is the fifth Flemish province, Walloon Brabant the fifth Walloon one. Hainaut is Henegouwen in
          Dutch, and Liège is Luik.
      - type: odd
        prompt: Three of these buildings house the government of a province. Which is the odd one out?
        items:
          - { label: "Welgelegen, Haarlem", photo: welgelegen }
          - { label: "The Gouvernement, Maastricht", photo: gouvernement-maastricht }
          - { label: "The Elysette, Namur", photo: elysette }
          - { label: "The Palace of the Prince-Bishops, Liège", photo: liege-palace }
        answer: 2
        reasons:
          - It houses the government of a region, not a province.
          - It is the only one in Belgium.
          - It is the only one built in modern times.
        reason: 0
        explain: >-
          The Elysette is the seat of the Walloon government. The prince-bishops ruled Liège for 800 years, until 1795;
          their palace now holds the province's governor and the law courts. The province of Namur has its own house, a
          former bishop's palace.
      - type: choice
        prompt: The German-speaking Community, about 80,000 people in nine municipalities, has its own parliament in Eupen. In which province is it?
        visual: { kind: photo, photo: german-parliament }
        answer: 2
        options:
          - label: Luxembourg
            why: Around Arlon, in Luxembourg, some villages speak Luxembourgish, but the community is in Liège.
          - label: Limburg
            why: Limburg is Flemish. The German-speaking Community is in the province of Liège.
          - label: Liège
            why: >-
              Right. Eupen, Sankt Vith and the villages around them came to Belgium from Germany after the First World
              War, in 1920, and were joined to the province of Liège. They are part of Wallonia, but run their own
              schools and culture in German.
          - label: Namur
            why: Namur is French-speaking. The German-speaking Community is in the province of Liège.
      - type: drill
        prompt: Find each Belgian province by its capital.
        country: BEL
        ask: capital
        rounds: 6
        misses: 1
        explain: >-
          Two capitals are not the biggest town of their province: Mons rather than Charleroi in Hainaut, and Wavre
          rather than Braine-l'Alleud in Walloon Brabant. Belgium has 565 municipalities since 2025, down from 2,359 before the mergers of
          1977.

  - id: u26-l5
    title: Benelux, Europe and NATO
    icon: stars
    sources:
      - title: "Wikipedia, Benelux"
        url: https://en.wikipedia.org/wiki/Benelux
      - title: "Wikipedia, Treaty of Rome"
        url: https://en.wikipedia.org/wiki/Treaty_of_Rome
      - title: "Wikipedia, Schengen Agreement"
        url: https://en.wikipedia.org/wiki/Schengen_Agreement
      - title: "Wikipedia, Maastricht Treaty"
        url: https://en.wikipedia.org/wiki/Maastricht_Treaty
      - title: "Wikipedia, 2005 Dutch European Constitution referendum"
        url: https://en.wikipedia.org/wiki/2005_Dutch_European_Constitution_referendum
      - title: "Wikipedia, Secretary General of NATO"
        url: https://en.wikipedia.org/wiki/Secretary_General_of_NATO
      - title: "Wikipedia, Mark Rutte"
        url: https://en.wikipedia.org/wiki/Mark_Rutte
      - title: "Wikipedia, 2025 NATO summit"
        url: https://en.wikipedia.org/wiki/2025_The_Hague_NATO_summit
      - title: "The Schengen Agreement of 14 June 1985 (EUR-Lex)"
        url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:42000A0922(01)
    exercises:
      - type: story
        title: Small countries, big tables
        body: >-
          In 1944, in exile in London, the governments of Belgium, the Netherlands and Luxembourg agreed to drop the
          customs duties between them: the Benelux, in force from 1948. All three joined NATO in 1949 and founded the
          European communities with France, West Germany and Italy. Today Brussels is home to the European Commission and
          NATO, The Hague to the courts of the world, and the most important European treaties carry Low Countries
          names. Drag the slider to see them arrive.
        visual: { kind: time-map, map: state, year: 1948 }
      - type: choice
        prompt: Six countries signed the Treaty of Rome on 25 March 1957, which made the common market; these are their signatures, on Belgium's copy. Which country was not among them?
        visual: { kind: photo, photo: rome-signatures }
        answer: 3
        options:
          - label: Luxembourg
            why: Luxembourg signed, with Belgium and the Netherlands, its Benelux partners. Britain stayed out until 1973.
          - label: Italy
            why: Italy signed, in its own capital. Britain stayed out until 1973.
          - label: West Germany
            why: West Germany signed, twelve years after the war. Britain stayed out until 1973.
          - label: Britain
            why: >-
              Right. Britain would not join a customs union with powers over its own, and set up a looser free trade
              area instead in 1960. It joined in 1973, and left in 2020. Joseph Luns signed for the Netherlands and
              Paul-Henri Spaak for Belgium.
      - type: choice
        prompt: On 14 June 1985 five countries agreed to do away with checks at their borders, aboard a riverboat, the Princesse Marie-Astrid, moored at the village of Schengen in Luxembourg. On which river?
        visual: { kind: photo, photo: marie-astrid }
        answer: 1
        options:
          - label: The Meuse
            why: The Meuse runs through Belgium and the Netherlands, but Schengen lies on the Moselle.
          - label: The Moselle
            why: >-
              Right. Schengen lies where Luxembourg, France and Germany meet, so the three Benelux countries met their two
              big neighbours on the border. Checks ended in 1995. This boat is a newer Marie-Astrid, on the same river.
          - label: The Rhine
            why: The Rhine is further east. Schengen lies on the Moselle.
          - label: The Scheldt
            why: The Scheldt flows to Antwerp. Schengen lies on the Moselle.
      - type: gap
        prompt: The Schengen Agreement did not end border checks at once. Its second article says what the police and customs officers would do from the next day. Fill the gap.
        quote: "The police and customs authorities shall as a general rule carry out simple visual surveillance of private vehicles crossing the common border at reduced speed, without requiring such vehicles to ___."
        source: The Schengen Agreement, Article 2, signed at Schengen on 14 June 1985 (English text, Official Journal of the European Communities, 2000)
        visual: { kind: time-map, map: state, year: 1985 }
        options: [stop, pay, register, turn back]
        answer: 0
        explain: >-
          Stop. A green disc on the windscreen told the officers that the driver had nothing to declare. In 1990 a second
          Schengen convention set out the rules, and on 26 March 1995 the checks ended for good.
      - type: pin
        prompt: Pin the village of Schengen, where Luxembourg meets France and Germany.
        place: schengen
        fullKm: 12
        okKm: 30
        explain: >-
          Schengen, in the far southeast corner of Luxembourg, a small wine village. Some 29 countries now
          belong to the Schengen area.
      - type: choice
        prompt: On 7 February 1992 twelve countries signed a treaty in this building, the house of the Dutch province of Limburg, on an island in the Maas. What did it lead to?
        visual: { kind: photo, photo: gouvernement-maastricht }
        answer: 2
        options:
          - label: The end of border checks
            why: That was Schengen, in 1985. The Treaty of Maastricht made the European Union and led to the euro.
          - label: The founding of NATO
            why: That was in Washington, in 1949. The Treaty of Maastricht made the European Union and led to the euro.
          - label: The European Union by that name, and the euro
            why: >-
              Right. The Dutch held the chair of the European Community that year, so the treaty was signed in Maastricht.
              Euro notes and coins replaced the guilder and the Belgian franc on 1 January 2002.
          - label: The Benelux
            why: The Benelux dates from 1944. The Treaty of Maastricht made the European Union and led to the euro.
      - type: truemyth
        statement: In 2005 Dutch voters said no to a constitution for Europe.
        visual: { kind: photo, photo: european-parliament }
        answer: true
        explain: >-
          True. On 1 June 2005, three days after the French, 61.6% of Dutch voters rejected it, in the first national
          referendum in two hundred years. The constitution was dropped, and much of it came back in the Treaty of Lisbon
          of 2007, which needed no referendum.
      - type: odd
        prompt: All four led NATO, as its secretary general. Which is the odd one out?
        items:
          - { label: Joseph Luns, 1971 to 1984, photo: luns }
          - { label: Willy Claes, 1994 to 1995, photo: claes }
          - { label: Jaap de Hoop Scheffer, 2004 to 2009, photo: hoop-scheffer }
          - { label: Mark Rutte, since 2024, photo: rutte-2024 }
        answer: 1
        reasons:
          - He is the only Belgian of the four.
          - He was never a minister.
          - He led NATO the longest.
        reason: 0
        explain: >-
          Willy Claes, a Flemish socialist, who stepped down after a year over a bribery scandal at home. Paul-Henri
          Spaak, another Belgian, led NATO from 1957 to 1961. Joseph Luns led it the longest, for nearly thirteen years.
          Of fourteen secretaries general, six have come from the Low Countries: Dirk Stikker, the first Dutchman, led it from 1961 to 1964.
      - type: who
        photo: rutte-2024
        clues:
          - I was prime minister of my country for nearly fourteen years, longer than anyone before me.
          - All that time I taught a class at a secondary school in The Hague once a week.
          - I cycled to work, and when I spilled my coffee in parliament I mopped it up myself.
          - In 2024 I moved to Brussels to lead an alliance of 32 countries.
        options: [Mark Rutte, Jaap de Hoop Scheffer, Joseph Luns, Dick Schoof]
        answer: 0
        explain: >-
          Mark Rutte, prime minister from 2010 to 2024 and secretary general of NATO since 1 October 2024. In June 2025 he
          hosted NATO's leaders in his home town, The Hague, where they agreed to spend 5% of their national income on
          defence by 2035.
      - type: scrub
        prompt: Drag the slider to the years when the European Commission was already in Brussels, but NATO was not. Look for the gold stars by Brussels.
        map: state
        start: 1948
        answer: [1958, 1966]
        explain: >-
          From 1958 to 1966. NATO moved its headquarters from Paris to Brussels in 1967, after France left its joint
          command. Since 2018 it has a new building at Evere, across the road from the old one.

  - id: u26-l6
