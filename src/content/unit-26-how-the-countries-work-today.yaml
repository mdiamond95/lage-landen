id: unit-26
number: 26
title: How the countries work today
era: 1839 to today
summary: >-
  Two kings who are never crowned, two parliaments of 150 seats, compulsory voting in Belgium and a red pencil in
  the Netherlands. Then the map: twelve Dutch provinces, ten Belgian ones, three regions and a capital that belongs to
  none, and the treaties of Rome, Schengen and Maastricht that made the Low Countries the heart of Europe. Drill the
  provinces until you know them by name, capital and flag, and follow the map of provinces and seats of power from
  1839 to today.
lessons:
  - id: u26-l1
    title: Two kings, no crowns
    icon: orb
    sources:
      - title: "Wikipedia, Monarchy of the Netherlands"
        url: https://en.wikipedia.org/wiki/Monarchy_of_the_Netherlands
      - title: "Wikipedia, Inauguration of the Dutch monarch"
