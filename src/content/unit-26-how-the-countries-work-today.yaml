      - title: "The Belgian Constitution (English translation), Articles 88, 91 and 106"
        url: https://www.dekamer.be/kvvcr/pdf_sections/publications/constitution/GrondwetUK.pdf
    exercises:
      - type: story
        title: Kings who sign, ministers who answer
        body: >-
          The Netherlands and Belgium are both kingdoms, and both are run by their parliaments. The king signs the laws
          and appoints the ministers, but every act of his needs a minister's signature, and the minister answers for it.
          Willem-Alexander became King of the Netherlands on 30 April 2013, when his mother Beatrix stepped down;
          Philippe became King of the Belgians on 21 July 2013, when his father Albert II did the same. Neither was
          crowned. In Amsterdam the Dutch crown, orb and sceptre lay on a table beside the king.
        visual: { kind: photo, photo: regalia }
      - type: who
        photo: willem-alexander-2013
        clues:
          - I was born in Utrecht in 1967, the first boy born to the Dutch royal family in more than a hundred years.
          - In 1986 I skated the Elfstedentocht, 200 km on frozen canals, under a false name.
          - For more than twenty years I flew twice a month as a co-pilot for KLM's short-haul airline.
          - I became king in 2013, the day my mother stepped down.
        options: [Willem-Alexander, Philippe, Albert II, Claus]
        answer: 0
        explain: >-
          Willem-Alexander, in the royal mantle, photographed by Koos Breukel before his inauguration. He skated the
          Elfstedentocht as "W.A. van Buren", and his flying for KLM Cityhopper came out only in 2017. He was the first
          Dutch king since 1890: Wilhelmina, Juliana and Beatrix reigned for 123 years between them.
      - type: choice
        prompt: At the inauguration in the Nieuwe Kerk in Amsterdam in 2013, the crown lay on this table and never touched the king's head. Why is a Dutch king never crowned?
        visual: { kind: photo, photo: regalia }
        answer: 1
        options:
          - label: The crown is too old and fragile to wear
            why: It was made for William II in 1840 and has never been worn. A Dutch king is sworn in, not crowned.
          - label: He is king the moment the last one goes, and is sworn in to the constitution before parliament
            why: >-
              Right. A Dutch king is "inaugurated": in a joint session of both houses of parliament he swears to uphold
              the constitution, and the members swear loyalty back. The crown, orb and sceptre lie on a table, the
              credence, as signs of the kingdom, not of the king.
          - label: The church will not crown a Protestant king
            why: No church crowns him, but none refuses either. A Dutch king is sworn in to the constitution, not crowned.
          - label: Only the pope could crown a king
            why: Dutch kings have never asked. A Dutch king is sworn in to the constitution, before parliament.
      - type: gap
        prompt: In Belgium the heir becomes king only once he has sworn an oath before both houses of parliament. Philippe swore it on 21 July 2013, in Dutch, French and German. Fill the gap.
        quote: "I swear to observe the Constitution and the laws of the Belgian people, to maintain the national independence and the integrity of the ___."
        source: The Belgian Constitution, Article 91, the oath of the king (in force since 1831; English translation)
        visual: { kind: photo, photo: philippe-oath }
        options: [territory, kingdom, monarchy, faith]
        answer: 0
        explain: >-
          The territory. Until he has sworn, the throne is empty and the ministers rule together. Leopold I swore the
          same words on 21 July 1831, which is why 21 July is Belgium's national day.
      - type: truemyth
        statement: He is called King of the Belgians, not King of Belgium, because his crown comes from the people rather than from the land.
        visual: { kind: photo, photo: royal-palace }
        answer: true
        explain: >-
          True. The National Congress that wrote the constitution in 1831 chose the title on purpose: a "popular
          monarchy", in which the king is chosen by and bound to the people. The constitution says that all powers come
          from the nation. The Royal Palace in Brussels is where the king works; he lives at the castle of Laeken.
      - type: voices
        prompt: Both constitutions say who answers for what the king does. What do they agree on?
        voices:
          - who: The Dutch constitution
            when: Article 42 (the rule dates from 1848; English translation)
            text: >-
              The Government shall comprise the King and the Ministers. The King shall be inviolable; the Ministers shall
              be accountable.
            photo: noordeinde
          - who: The Belgian constitution
            when: Articles 88 and 106 (in force since 1831; English translation)
            text: >-
              The King's person is inviolable; his ministers are accountable. No act of the King can take effect without
              the countersignature of a minister, who, in doing so, assumes responsibility for it.
            photo: philippe
        options:
          - The king cannot be tried; his ministers answer for him
          - The king answers to parliament for his acts
          - The king may act alone in an emergency
          - The ministers answer to the king
        answer: 0
        explain: >-
          Ministerial responsibility, written into the Dutch constitution by Thorbecke in 1848 and into the Belgian one
          from the start. A king who will not sign is in trouble: in 1990 King Baudouin would not sign Belgium's abortion
          law, and parliament declared him unable to reign for a day and a half while the ministers signed it.
      - type: choice
        prompt: Both crowns will pass to a woman, the eldest child of the king. Which of these two, both photographed in Luxembourg in October 2025, is the heir to the Belgian throne?
        answer: 1
        options:
          - photo: amalia-2025
            why: >-
              This is Catharina-Amalia, Princess of Orange, born in 2003, the heir to the Dutch throne. Since 1983 the
              eldest child inherits in the Netherlands, son or daughter.
          - photo: elisabeth-2025
            why: >-
              Right. Elisabeth, Duchess of Brabant, born in 2001. Belgium let daughters inherit in 1991; she will be the
              country's first queen in her own right. Both princesses were guests at the accession of Grand Duke
              Guillaume of Luxembourg on 3 October 2025.

  - id: u26-l2
    title: Parliaments and votes
    icon: ballot
    sources:
