    exercises:
      - type: story
        title: One state, three regions, three communities
        body: >-
          From 1970 to 2011 Belgium changed its constitution six times, each time handing more to its parts. Flemings
          wanted communities that look after people in their own language, and Walloons wanted regions that run
          their own economy, so Belgium got both, and they overlap. Tap the maps to see who runs what.
        visual: { kind: federal }
      - type: gap
        prompt: In February 1970 the prime minister told parliament why Belgium had to change. Fill the gap.
        quote: The unitary state, as the laws still lay it down in its structures and its workings, has been overtaken by the ___.
        source: Gaston Eyskens, prime minister, in the Chamber, 18 February 1970 (translated from the French)
        visual: { kind: photo, photo: palace-nation }
        options: [facts, Flemings, courts, king]
        answer: 0
        explain: >-
          "Dépassé par les faits": the country had already split in its parties, its universities and its
          politics, and the law had to catch up. The reform of 1970 set up cultural communities for Dutch, French and
          German, and promised regions.
      - type: landmark
        prompt: The Belgian parliament meets in the Palace of the Nation, about 900 m east of the Grand-Place in Brussels, facing the Royal Palace across a park. Find it on the map.
        city: brussels
        answer: palace-nation
        show: [grand-place]
        options: [palace-nation, grand-place, palace-justice, manneken-pis, cbbd]
        explain: >-
          King and parliament face each other from either end of the Park of Brussels. The palace was built from 1778
          to 1783 for the Council of Brabant, under Austrian rule.
      - type: order
        prompt: Put the six state reforms in order.
        items:
          - { label: Cultural communities for Dutch, French and German, year: 1970, when: '1970' }
          - { label: Flanders and Wallonia get regional governments, year: 1980, when: '1980' }
          - { label: The Brussels-Capital Region, and schools go to the communities, year: 1988, when: '1988–89' }
          - { label: Belgium becomes a federal state, year: 1993, when: '1993' }
          - { label: The regions take over farming and foreign trade, year: 2001, when: '2001' }
          - { label: Brussels-Halle-Vilvoorde is split, year: 2011, when: '2011–12' }
        explain: >-
          Each reform needed a two-thirds majority in parliament, and a majority on both sides of the language line,
          so each one was a hard bargain between Flemish and French-speaking parties.
      - type: sort
        prompt: Who runs it? Sort them.
        visual: { kind: federal }
        groups: [The federal state, The regions, The communities]
        items:
          - { label: The army, group: 0 }
          - { label: Pensions, group: 0 }
          - { label: Justice and the police, group: 0 }
          - { label: Roads and public transport, group: 1 }
          - { label: Housing, group: 1 }
          - { label: Schools, group: 2 }
          - { label: Television and radio, group: 2 }
        explain: >-
          The regions look after land: the economy, roads, housing, the environment. The communities look after
          people: schools, culture, the media in their language. The federal state keeps what has to be the same for
          everyone.
      - type: drill
        prompt: Since 1995 the Flemish Region has five provinces. Find them on the map.
        country: BEL
        only: [BE-VAN, BE-VLI, BE-VOV, BE-VWV, BE-VBR]
        misses: 1
        explain: >-
          Antwerp, Limburg, East Flanders, West Flanders and Flemish Brabant, made when Brabant was split in 1995.
          Wallonia has the other five, and Brussels belongs to no province.
      - type: choice
        prompt: On the map of communities, Brussels is striped in two colours. Why?
        visual: { kind: federal, show: communities }
        answer: 2
        options:
          - label: Nobody runs its schools
            why: Brussels has plenty of schools, in both languages.
          - label: It belongs to the German-speaking Community too
            why: The German-speaking Community is only its nine towns in the east.
          - label: Both the Flemish and the French Community run schools and culture there
            why: >-
              Right. A family in Brussels chooses a Dutch or a French school, and each is run by its community. As a
              region, Brussels runs itself, since 1989.
          - label: It is not part of Belgium
            why: Brussels is Belgium's capital, and a region of its own.
      - type: odd
        prompt: Three of these parliaments make laws for a part of Belgium. Which is the odd one out, and why?
        items:
          - { label: The Flemish Parliament, photo: flemish-parliament }
          - { label: The Walloon Parliament, photo: walloon-parliament }
          - { label: The Parliament of the German-speaking Community, photo: german-parliament }
          - { label: The European Parliament, photo: european-parliament }
        answer: 3
        reasons:
          - It makes laws for the whole European Union, not for a part of Belgium
          - It is outside Belgium
          - It is the oldest of the four
        reason: 0
        explain: >-
          The European Parliament meets in Brussels as well as Strasbourg. The Flemish Parliament sits in Brussels
          too, the Walloon Parliament in Namur and the German-speaking one in Eupen. With the Brussels and French
          Community parliaments, the national one and Europe's, a voter in Brussels lives under many parliaments.
      - type: who
        photo: dehaene
        clues:
          - I was born in Montpellier, in France, in 1940, as my parents fled the German invasion.
          - I was a Flemish Christian Democrat, and they called me the Plumber, for fixing deals.
          - In 1993 my government made Belgium a federal state.
          - I was prime minister from 1992 to 1999.
        options: [Jean-Luc Dehaene, Wilfried Martens, Guy Verhofstadt, Elio Di Rupo]
        answer: 0
        explain: >-
          Jean-Luc Dehaene. The Saint Michael's Agreement of 1992 led to the reform of 1993, and since then the
          first article of the constitution has read: "Belgium is a federal State composed of communities and regions." The province of
          Brabant was split in two, and in 1995 Belgians voted directly for their regional parliaments for the first
          time.
      - type: truemyth
        statement: After the election of June 2010 Belgium went 541 days without a new government.
        visual: { kind: photo, photo: wetstraat }
        answer: true
        explain: >-
          True. The Flemish nationalists of the N-VA came first in Flanders and the Socialists in Wallonia, and they
          could not agree on how far the next reform should go. The old government ran the country as caretaker
          until December 2011, when Elio Di Rupo formed a government, once the sixth reform had been agreed.
      - type: scrub
        prompt: Drag the slider to the stage when Brussels became a region of its own.
        map: language
        start: 1963
        answer: [1989, 1992]
        explain: >-
          The Brussels-Capital Region was set up in 1989, with its own parliament and government for its 19
          municipalities. Flemings had long feared a third region where they would be a small minority, and French
          speakers had wanted one.
      - type: cause
        prompt: Link each cause to its effect.
        pairs:
          - [Flemings wanted to run their own schools and culture, Belgium got communities]
          - [Walloons wanted to run their own economy, Belgium got regions]
          - [Brussels was neither Flemish nor Walloon, It became a region of its own in 1989]
          - [No party stood in all of Belgium any more, Every reform had to be bargained between the two sides]
        explain: >-
          Belgium did not choose between the Flemish and the Walloon plan; it built both, one on top of the other.
          That is why it has six governments for under twelve million people.

  - id: u15-l5
    title: Brussels, capital of Europe
    icon: atom
    sources:
