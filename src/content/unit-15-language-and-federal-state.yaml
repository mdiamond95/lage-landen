      - title: "Wikipedia, Gelijkheidswet, with Coremans' speech of 18 November 1896 (in Dutch)"
        url: https://nl.wikipedia.org/wiki/Gelijkheidswet
      - title: "Wikipedia, Coucke and Goethals"
        url: https://en.wikipedia.org/wiki/Coucke_and_Goethals
      - title: "Wikipedia, Jules Destrée"
        url: https://en.wikipedia.org/wiki/Jules_Destr%C3%A9e
      - title: "Université Laval, L'aménagement linguistique dans le monde: Belgique, la Lettre au roi of 1912 (in French)"
        url: https://www.axl.cefan.ulaval.ca/europe/belgiqueetat_histoire.htm
      - title: "Wikipedia, Ghent University"
