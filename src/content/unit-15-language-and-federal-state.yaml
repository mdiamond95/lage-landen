        url: https://en.wikipedia.org/wiki/Expo_58
      - title: "Wikipedia, Paul-Henri Spaak"
        url: https://en.wikipedia.org/wiki/Paul-Henri_Spaak
      - title: "Wikipedia, Berlaymont building"
        url: https://en.wikipedia.org/wiki/Berlaymont_building
      - title: "Wikipedia, Treaty of Rome"
        url: https://en.wikipedia.org/wiki/Treaty_of_Rome
      - title: "NATO, A short history of NATO"
        url: https://www.nato.int/cps/en/natohq/declassified_139339.htm
    exercises:
      - type: story
        title: The world comes to Brussels
        body: >-
          From April to October 1958 Brussels held the first world's fair since the Second World War. Expo 58 was
          about science, peace and the future, and its centrepiece still stands on the Heysel plateau. The same year
          Brussels became the home of the new European Economic Community, and in 1967 of NATO. A city split between
          two languages became the capital of a continent.
        visual: { kind: photo, photo: atomium }
      - type: choice
        prompt: The Atomium was built for Expo 58. What does it show?
        visual: { kind: then-now, pair: atomium }
        answer: 3
        options:
          - label: The nine provinces of Belgium
            why: Belgium did have nine provinces then, but that is not what the spheres stand for.
          - label: A molecule of water
            why: Water has only three atoms.
          - label: The planets around the sun
            why: The spheres are atoms, not planets.
          - label: Nine atoms of an iron crystal, 165 billion times bigger than life
            why: >-
              Right. It is 102 m tall, and stairs, escalators and a lift run through its tubes. It was not meant to
              outlast the fair, and became the symbol of Brussels.
      - type: choice
        prompt: The Philips Pavilion was designed in Le Corbusier's studio by the composer and architect Iannis Xenakis. What did visitors find inside?
        visual: { kind: photo, photo: expo58-philips }
        answer: 0
        options:
          - label: A show of light, pictures and electronic music, played through hundreds of loudspeakers
            why: >-
              Right. Edgard Varèse's Poème électronique came from 425 loudspeakers around the walls. Philips, the
              Dutch electronics firm, pulled the pavilion down after the fair.
          - label: A factory making radios
            why: It was a show, not a factory.
          - label: A cinema showing Hollywood films
            why: What it showed was far stranger.
          - label: A shop selling light bulbs
            why: Philips was showing off, not selling.
      - type: truemyth
        statement: Expo 58 drew more visitors than any world's fair before it.
        visual: { kind: photo, photo: expo58-congo }
        answer: false
        explain: >-
          Myth, just. About 41.5 million visitors came, second only to the Paris fair of 1900, with about 48
          million. Beside the Atomium and the pavilions of the world stood the grand pavilions of the Belgian Congo,
          two years before its independence.
      - type: who
        photo: spaak
        clues:
          - I was born in Schaerbeek in 1899, and my mother was the first woman in the Belgian Senate.
          - I was prime minister of Belgium three times, the first time in 1938.
          - I chaired the first General Assembly of the United Nations, in 1946.
          - A report with my name led to the Treaty of Rome, and I later led NATO.
        options: [Paul-Henri Spaak, Robert Schuman, Gaston Eyskens, Jean Monnet]
        answer: 0
        explain: >-
          Paul-Henri Spaak, a Socialist from Brussels, was called "Mr. Europe". In London during the war he helped
          set up the Benelux, and in 1956 his committee wrote the plan for the common market that six countries
          signed at Rome in 1957. He was NATO's secretary general from 1957 to 1961.
      - type: gap
        prompt: Fill the gap in the first line of the Treaty of Rome, signed by Belgium, France, West Germany, Italy, Luxembourg and the Netherlands.
        quote: Determined to lay the foundations of an ever closer ___ among the peoples of Europe
        source: Treaty establishing the European Economic Community, signed at Rome, 25 March 1957
        options: [union, market, army, friendship]
        answer: 0
        explain: >-
          "An ever closer union" has been in every European treaty since. The Commission of the new community set
          up in Brussels in 1958, a city in a small country, between the big ones, where all could meet.
      - type: choice
        prompt: The European Commission moved into this building in 1967. Why did it have to move out again, from 1991 to 2004?
        visual: { kind: photo, photo: berlaymont }
        answer: 1
        options:
          - label: It was too small
            why: It is one of the biggest office buildings in Brussels.
          - label: It was full of asbestos, which had to be taken out
            why: >-
              Right. The Berlaymont, named after the convent that stood on its site, was stripped and rebuilt, and
              the Commission came back in 2004. It is the heart of the European Quarter.
          - label: It was hit by a bomb
            why: It was emptied to be repaired, not after an attack.
          - label: The Commission moved to Strasbourg
            why: The Commission has always been in Brussels.
      - type: choice
        prompt: In 1966 France left NATO's joint military command and asked NATO's headquarters to leave Paris. Where did they go?
        answer: 2
        options:
          - label: London
            why: NATO chose a city on the continent.
          - label: Bonn
            why: It went to a smaller country.
          - label: Brussels
            why: >-
              Right. NATO's headquarters opened in Evere, in Brussels, in October 1967, and its military command went
              to Casteau, near Mons. Its new headquarters, across the road, opened in 2017.
          - label: Luxembourg
            why: Luxembourg was too small for it.
      - type: cause
        prompt: Link each cause to its effect.
        pairs:
          - [Expo 58 needed a centrepiece, The Atomium was built]
          - [Six countries signed the Treaty of Rome, The European Commission set up in Brussels]
          - [France left NATO's military command, NATO moved to Brussels in 1967]
          - [The Berlaymont was full of asbestos, The Commission moved out from 1991 to 2004]
        explain: >-
          Brussels is the capital of Belgium, of Flanders, of the French Community, of the European Union and of
          NATO.

  - id: u15-l6
