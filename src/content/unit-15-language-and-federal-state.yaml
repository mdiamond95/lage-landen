    exercises:
      - type: story
        title: Belgium today
        body: >-
          About six in ten Belgians live in Flanders, three in ten in Wallonia and one in ten in Brussels, and some
          80,000 in the German-speaking east. There is a king, a federal government in the Wetstraat, the Rue de la
          Loi, and five more governments below it. Some Flemish parties want Flanders to go its own way; others want
          Belgium to take powers back. Here is the map of 1993, when Belgium became a federal state.
        visual: { kind: time-map, map: language, year: 1993 }
      - type: choice
        prompt: Eupen, near the German border, is the seat of the German-speaking Community. How did it become Belgian?
        visual: { kind: photo, photo: eupen-town }
        answer: 1
        options:
          - label: It joined Belgium in 1830, with the rest of the country
            why: In 1830 it was in Prussia.
          - label: The Treaty of Versailles took it from Germany and gave it to Belgium in 1920
            why: >-
              Right. Germany annexed it again in 1940, and many of its men were made to fight in the German army.
              Since 1945 it has been Belgian, and since 1973 it has had its own council, now a parliament.
          - label: Belgium bought it from Luxembourg
            why: It was German land, not Luxembourg's.
          - label: Its people voted in secret to join Belgium
            why: The vote of 1920 was not secret, and few dared sign against.
      - type: pin
        prompt: Pin Eupen, the capital of Belgium's German-speaking Community.
        place: eupen
        fullKm: 10
        okKm: 25
        explain: >-
          Eupen lies a few kilometres from the German border, south of Aachen. Its parliament governs the schools and
          culture of nine municipalities, inside the Walloon Region.
      - type: story
        title: Older than the language laws
        body: >-
          Beneath Belgium's three official languages lie older ones: the dialects of Flanders and Brussels, Walloon,
          Picard and Gaumais in the south, Luxembourgish around Arlon and the Platt of the east. Tap the map to read
          about them and hear some of them. Unit 20 has more.
        visual: { kind: dialects }
      - type: choice
        prompt: Look at the map of regions. Which region do the German-speaking towns belong to?
        visual: { kind: federal, show: regions }
        answer: 1
        options:
          - label: A German region of their own
            why: There are only three regions, and none is German.
          - label: The Walloon Region
            why: >-
              Right. As a community they run their own schools and culture in German, but their roads, housing and
              economy are run from Namur, by the Walloon Region, which has handed them a few of its powers.
          - label: The Flemish Region
            why: Flanders is on the other side of the country.
          - label: The Brussels-Capital Region
            why: Brussels is 120 km away.
      - type: scrub
        prompt: The electoral district of Brussels-Halle-Vilvoorde let French speakers in the Flemish towns around Brussels vote for French-speaking parties of Brussels. Drag the slider to the stage when it was finally split.
        map: language
        start: 1993
        answer: [2012, 2012]
        explain: >-
          In 2003 the court ruled that the district broke the constitution, as every other district stayed on one
          side of the line. It took nine years and the 541-day crisis to split it, in 2012, with special rights kept
          for French speakers in the six towns with facilities.
      - type: truemyth
        statement: In December 2006 Belgium's French-language public television told viewers that Flanders had declared independence, and many believed it.
        visual: { kind: photo, photo: royal-palace }
        answer: true
        explain: >-
          True. On 13 December 2006 the RTBF broke into its evening programmes with a special news report: Flanders
          had left Belgium, and the king had flown abroad. After half an hour a banner said "This is fiction".
          Its phone lines and website were swamped, and the hoax, Bye Bye Belgium, was meant to start a debate on where the country was
          heading.
      - type: choice
        prompt: Why are the street signs of Brussels in two languages?
        visual: { kind: photo, photo: brussels-signs }
        answer: 0
        options:
          - label: Brussels is officially bilingual, Dutch and French
            why: >-
              Right. Street names, town halls and public services in its 19 municipalities work in both languages.
              Most people in Brussels speak French at home, and many speak neither language first.
          - label: Half the street names are for tourists
            why: Both names are official.
          - label: The French names are older
            why: Many street names were Flemish first.
          - label: It is a law of the European Union
            why: It is a Belgian law, from the language laws of 1932 and 1963.
      - type: choice
        prompt: Each community has its own holiday. The Flemish Community's is 11 July. What does it remember?
        visual: { kind: photo, photo: breydel-statue }
        answer: 2
        options:
          - label: The Belgian Revolution of 1830
            why: The French Community remembers the fighting in Brussels of September 1830, on 27 September.
          - label: The end of the First World War
            why: That is 11 November, Armistice Day, a holiday for all Belgians.
          - label: The Battle of the Golden Spurs, 1302
            why: >-
              Right. The statue of Jan Breydel and Pieter de Coninck, leaders of the Flemish craftsmen, stands in the
              Markt of Bruges. The German-speaking Community keeps its holiday on 15 November, the King's Feast.
          - label: The Equality Law of 1898
            why: The holiday goes much further back.
      - type: region
        prompt: When the province of Brabant was split in 1995, Flanders got five provinces. Tap them.
        layer: provinces
        answer: [BE-VAN, BE-VLI, BE-VOV, BE-VWV, BE-VBR]
        explain: >-
          Antwerp, Limburg, East Flanders, West Flanders and Flemish Brabant. Wallonia has five too: Hainaut, Liège,
          Luxembourg, Namur and Walloon Brabant. Brussels belongs to no province.
      - type: cause
        prompt: Link each cause to its effect.
        pairs:
          - [The Treaty of Versailles gave Belgium the East Cantons, Belgium has a German-speaking Community]
          - [Brussels-Halle-Vilvoorde crossed the language line, The court ruled it against the constitution]
          - [Flemings and Walloons vote for different parties, Forming a government can take a very long time]
          - [Brussels is bilingual, Its signs and town halls work in Dutch and French]
        explain: >-
          Belgium has survived its language quarrel by giving each side its own ground and its own governments, and
          by sharing Brussels. Whether it goes further apart, or back together, is still argued over every election.
