id: unit-15
number: 15
title: Language and the federal state
era: 1830 to today
summary: Belgium began in 1830 as a state run in French, though most of its people spoke Dutch. The Flemish Movement won equal laws in 1898, a university in Dutch in 1930 and a language for each region in 1932. In the 1960s a line was drawn for good across the country, the university of Leuven split in two, and from 1970 six state reforms turned Belgium into a federal state of three regions and three communities, with Brussels, home of the Atomium, the European Commission and NATO, shared between them.
lessons:
  - id: u15-l1
    title: A language of their own
    icon: speech
    sources:
      - title: "Wikipedia, Flemish Movement"
        url: https://en.wikipedia.org/wiki/Flemish_Movement
      - title: "Wikipedia, Equality law (Belgium)"
