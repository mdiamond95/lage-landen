    exercises:
      - type: story
        title: Before and after
        body: >-
          On 19 April 1839 the Netherlands and Belgium signed a treaty in London, with Britain, France, Austria,
          Prussia and Russia. Drag the divider to wipe from the kingdom of 1815 to the two countries of 1839, and
          see what was cut in two.
        visual: { kind: compare, map: kingdom, years: [1815, 1839] }
      - type: choice
        prompt: Drag the divider from 1830 to 1839. What happened to Luxembourg?
        visual: { kind: compare, map: kingdom, years: [1830, 1839] }
        answer: 2
        options:
          - label: All of it became Belgian
            why: Only the west did.
          - label: It went to Prussia
            why: Prussia kept a garrison in its fortress, but did not get the land.
          - label: It was split, and the west became Belgium's province of Luxembourg
            why: >-
              Right. The French-speaking west, with the German-speaking town of Arlon, stayed Belgian. The rest
              became the Grand Duchy of Luxembourg we know, ruled by the Dutch king until 1890. It lost more than
              half its land.
          - label: It became a province of the Netherlands
            why: It stayed a grand duchy of its own, under the same king.
      - type: choice
        prompt: The Dutch copy of the treaty came with this map of Limburg, cut in two. The pink part went to the Netherlands. Which river does most of the new border follow?
        visual: { kind: photo, photo: separation-treaty }
        answer: 0
        options:
          - label: The Maas, or Meuse
            why: >-
              Right. The Netherlands got the land east of the river, with Maastricht and Venlo, and Belgium the
              west. From 1839 to 1866 Dutch Limburg was also a duchy of the German Confederation.
          - label: The Rhine
            why: The Rhine flows far to the north and east.
          - label: The Scheldt
            why: The Scheldt flows through Antwerp, far to the west.
          - label: The IJssel
            why: The IJssel is in the north.
      - type: region
        prompt: Limburg was cut in two in 1839, and both halves keep the name. Paint the two provinces of today called Limburg.
        layer: provinces
        answer: [NL-LI, BE-VLI]
        explain: >-
          Dutch Limburg, with Maastricht, and Belgian Limburg, with Hasselt. People on both sides had been
          Belgian for eight years, and many in Dutch Limburg did not want to go back.
      - type: gap
        prompt: Article VII of the treaty decided Belgium's place in Europe for 75 years. Fill the gap.
        quote: Belgium, within the limits specified, shall form an Independent and ___ Neutral State. It shall be bound to observe such Neutrality towards all other States.
        source: Treaty of London, 19 April 1839, article VII
        options: [perpetually, partly, briefly, secretly]
        answer: 0
        explain: >-
          Perpetually: for ever. The great powers, Prussia among them, guaranteed it. Belgium could have no allies
          and take no side.
      - type: truemyth
        statement: In 1914 Britain went to war partly to keep a promise made in 1839.
        visual: { kind: photo, photo: scrap-of-paper }
        answer: true
        explain: >-
          True. When Germany invaded Belgium in August 1914, its chancellor scoffed that Britain would fight for a
          "scrap of paper". Britain declared war, and posters like this one showed the seals and signatures of
          1839, Palmerston's among them.
      - type: truemyth
        statement: In one village on the Dutch-Belgian border, the border runs through houses, shops and cafés.
        visual: { kind: photo, photo: baarle-border }
        answer: true
        explain: >-
          True. In Baarle-Hertog and Baarle-Nassau, medieval landholdings left a patchwork of 22 Belgian
          pieces inside the Netherlands, some with Dutch pieces inside them. The border treaty of 1843 could not
          untangle it, so crosses on the pavement still mark the line, even through this shop.
      - type: pin
        prompt: Pin Baarle, the village where the border runs through houses.
        place: baarle
        okKm: 20
        fullKm: 8
        explain: >-
          Baarle, north of Turnhout, deep inside the Dutch province of North Brabant.
      - type: choice
        prompt: This postcard of about 1900 shows a strip of land near Aachen, between the Netherlands, Belgium and Germany, that belonged to no single country from 1816 to 1920. Why was it left neutral?
        visual: { kind: photo, photo: moresnet-map }
        answer: 1
        options:
          - label: Nobody lived there
            why: Its village, Kelmis, grew to about 5,000 people.
          - label: Prussia and the Netherlands both wanted its zinc mine, and could not agree
            why: >-
              Right. Neutral Moresnet was run by both, and after 1830 by Prussia and Belgium. It had no army and low
              taxes, and in 1908 some of its people dreamed of an Esperanto state. In 1920 it went to Belgium.
          - label: It was a hunting ground of the king
            why: The fight was over its zinc mine.
          - label: The pope owned it
            why: The church had nothing to do with it.
      - type: who
        photo: conscience
        clues:
          - I was born in Antwerp in 1812. My father was French.
          - In 1830 I joined the Belgian army as a volunteer.
          - In 1838 I wrote a novel, in Dutch, about the Battle of the Golden Spurs.
          - People said I taught my people to read.
        options: [Hendrik Conscience, Jenneval, Charles Rogier, Guido Gezelle]
        answer: 0
        explain: >-
          Hendrik Conscience. His novel De Leeuw van Vlaenderen, The Lion of Flanders, turned 1302 into a story
          of Flemish pride. Written in the new Belgium, it gave the Flemish Movement its hero, its lion and its
          date, 11 July.
      - type: choice
        prompt: In 1840 William I gave up his throne, and a Dutch cartoonist drew him leaving for Prussia. Why did he go?
        visual: { kind: photo, photo: william-leaves-1840 }
        answer: 2
        options:
          - label: He had lost a war with Belgium
            why: The war had ended with a treaty in 1839.
          - label: He was going to fight for Prussia
            why: He was 68.
          - label: He wanted to marry a Catholic Belgian countess, whom his people disliked
            why: >-
              Right: Henriette d'Oultremont, his late wife's lady-in-waiting. Parliament was also cutting his powers.
              His son became William II, and the old king died in Berlin in 1843.
          - label: He had been deposed
            why: He gave up the throne himself, on 7 October 1840.
      - type: scrub
        prompt: Drag the slider to the year Maastricht's Dutch garrison was surrounded by Dutch land again.
        map: kingdom
        start: 1830
        answer: [1839, 1839]
        explain: >-
          For nine years Maastricht had been a Dutch island in Belgian Limburg; the treaty joined it to Dutch land again.
      - type: cause
        prompt: Link each cause to its effect.
        pairs:
          - [Belgium is made neutral for ever, Britain goes to war when Germany invades in 1914]
          - [The Netherlands keeps eastern Limburg, Dutch Limburg joins the German Confederation until 1866]
          - [Luxembourg loses its west, The grand duchy shrinks to less than half its size]
          - [William I wants to marry a Belgian Catholic, He gives up his throne in 1840]
        explain: >-
          The line drawn in 1839 is, with small changes, the border between the Netherlands and Belgium today.
