id: unit-07
number: 7
title: Trade, empire and slavery
era: 1600 to 1863
summary: The VOC and the WIC build a trading empire from Japan to the Caribbean, with forts, plantations and colonies taken by force. Dutch ships carry spices, sugar and silver, and more than half a million enslaved Africans. This unit follows the ships, the people who fought back, and the long road to Keti Koti in 1863.
note: >-
  This checkpoint has questions on slavery, the slave trade and the conquest of the Banda Islands. They are
  asked plainly, without celebrations.
lessons:
  - id: u7-l1
    title: Round the Cape to the spice islands
    icon: ship
    note: >-
      This lesson includes the conquest of the Banda Islands in 1621, when most of the islanders were killed,
      enslaved or driven away. It is told plainly, without celebrations.
    sources:
      - title: "Canon van Nederland, De VOC (in Dutch)"
        url: https://www.canonvannederland.nl/nl/voc
      - title: "Encyclopaedia Britannica, Banda Islands"
        url: https://www.britannica.com/place/Banda-Islands
      - title: "Western Australian Museum, Dirk Hartog's pewter plate"
        url: https://museum.wa.gov.au/explore/dirk-hartog/dirk-hartogs-pewter-plate
      - title: "Rijksmuseum, The Castle of Batavia, Andries Beeckman"
        url: https://www.rijksmuseum.nl/en/collection/SK-A-19
      - title: "Bataviawerf, the replica of the Batavia (in Dutch)"
        url: https://www.bataviawerf.nl/
      - title: "Westfries Museum, Hoorn"
        url: https://wfm.nl/
    exercises:
      - type: story
        title: Ships to the other side of the world
        body: >-
          From 1602 the VOC sent its ships round Africa to Asia for spices, silk and porcelain, and the WIC soon
          followed across the Atlantic. Over two centuries they built forts and trading posts from Japan to the
          Caribbean. Press play to follow the ships. The dark red routes carried enslaved Africans.
        visual: { kind: time-map, map: empire }
      - type: scrub
        prompt: Drag the slider to a year when ships already sail east on the roaring forties, but Batavia has not been built yet.
        map: empire
        start: 1602
        answer: [1611, 1618]
        explain: >-
          Hendrik Brouwer first sailed the new route in 1611, cutting the trip from the Cape to Java by about half.
          Batavia was founded in 1619. Until then the VOC's main post on Java was Bantam.
      - type: who
        photo: coen
        clues:
          - I was born in Hoorn in 1587 and worked my way up in the VOC.
          - In 1619 I destroyed the Javanese port of Jayakarta and built a new capital on its ruins.
          - In 1621 I led the conquest of the Banda Islands, where most of the people were killed, enslaved or driven out.
          - My statue in Hoorn is now disputed.
        options: [Jan Pieterszoon Coen, Piet Hein, Abel Tasman, Peter Stuyvesant]
        answer: 0
        explain: >-
          Jan Pieterszoon Coen, twice governor-general of the VOC in Asia. He built Batavia, today Jakarta. In
          Hoorn a sign beside his statue now explains the violence he was responsible for.
      - type: choice
        prompt: The Banda Islands were tiny, but in 1600 they were the only place in the world where one spice grew. Which?
        visual: { kind: photo, photo: banda-1724 }
        answer: 1
        options:
          - label: Pepper
            why: Pepper grew widely, in India, Sumatra and Java.
          - label: Nutmeg, and mace, made from its husk
            why: >-
              Right. Nutmeg was worth many times its weight by the time it reached Europe, and the VOC wanted all of
              it. Here are Banda Neira and the volcano Gunung Api around 1724.
          - label: Cinnamon
            why: Cinnamon came from Ceylon, today Sri Lanka.
          - label: Cloves
            why: Cloves grew on other islands of the Moluccas, such as Ambon and Ternate.
      - type: truemyth
        statement: When the VOC conquered the Banda Islands in 1621, most of the islanders were killed, enslaved or driven away.
        visual: { kind: photo, photo: fort-belgica }
        answer: true
        explain: >-
          True. Of perhaps 15,000 Bandanese, only about 1,000 were left on the islands. Thousands died in the
          fighting or of hunger, hundreds of leaders were shipped to Batavia, and their land was handed to Dutch
          planters who worked it with enslaved people brought from elsewhere. Fort Belgica, begun in 1611, still
          stands over Banda Neira.
      - type: hunt
        prompt: Andries Beeckman painted Batavia around 1662, with a busy market under the palm trees. Find the castle, the VOC's headquarters in Asia.
        photo: batavia-castle
        targets: [[0.37, 0.66, 0.44, 0.11]]
        explain: >-
          The long grey walls behind the market. Inside the castle sat the governor-general and his council, and
          the warehouses of the company. Look at the market too: Javanese, Chinese, Indian and European traders,
          and enslaved servants, some holding parasols over their masters.
      - type: choice
        prompt: This is a replica of the Batavia, a VOC ship launched in 1628. On her first voyage, in 1629, she struck a reef. Where?
        visual: { kind: photo, photo: batavia-replica }
        answer: 2
        options:
          - label: Off the Cape of Good Hope
            why: The Cape was the halfway stop, but the Batavia passed it safely.
          - label: In the Strait of Malacca
            why: The Batavia never reached Asia.
          - label: Off the west coast of Australia
            why: >-
              Right, on the Houtman Abrolhos islands. Ships on the Brouwer route had to judge when to turn north,
              and without a way to measure longitude, some turned too late. The replica was built at Lelystad and
              launched in 1995.
          - label: On the sandbanks off Texel
            why: She left Texel safely in October 1628.
      - type: gap
        prompt: In 1616 Dirk Hartog's ship, the Eendracht, came ashore on an island off the west coast of Australia. His crew left this pewter plate nailed to a post. Fill the gap in what they scratched into it.
        quote: 1616. The 25 October is here arrived the ship Eendraght of Amsterdam, the uppermerchant Gillis Miebais of Liège, skipper Dirck Hatichs of Amsterdam. The 27 ditto we set sail for ___.
        source: The Hartog plate, Dirk Hartog Island, 1616 (translated by the Western Australian Museum)
        visual: { kind: photo, photo: hartog-plate }
        options: [Bantam, Amsterdam, Japan, the Cape]
        answer: 0
        explain: >-
          Bantam, the VOC's post on Java. Note the upper merchant from Liège, in the Spanish south. The plate is the
          oldest known European object left in Australia. Willem de Vlamingh took it away in 1697, and it is now in
          the Rijksmuseum.
      - type: choice
        prompt: Abel Tasman, painted here with his wife and daughter, sailed from Batavia in 1642 and found a large island south of Australia. What is it called today?
        visual: { kind: photo, photo: tasman-family }
        answer: 1
        options:
          - label: New Guinea
            why: New Guinea lies north of Australia, and Europeans knew it long before.
          - label: Tasmania
            why: >-
              Right. Tasman named it Van Diemen's Land, after the governor-general who sent him. Weeks later he
              reached New Zealand.
          - label: Java
            why: Java was the island he sailed from.
          - label: Madagascar
            why: Madagascar lies off Africa, far to the west.
      - type: cause
        prompt: Link each cause to its effect.
        pairs:
          - [The VOC wants all the world's nutmeg, Coen conquers the Banda Islands]
          - [Strong westerly winds blow south of the Cape, Ships take the Brouwer route to Java]
          - [Captains can't measure longitude at sea, Some ships turn north too late and wreck on Australia]
          - [Jayakarta is destroyed in 1619, Batavia is built on its ruins]
        explain: >-
          Wind, profit and force shaped the VOC's empire. The company made fortunes for shareholders at home,
          paid for by people in Asia.
      - type: pin
        prompt: The great VOC fleets gathered and set sail from the roadstead off one island in the north of Holland. Pin Texel.
        place: texel
        okKm: 25
        fullKm: 10
        explain: >-
          Texel, at the entrance to the Zuiderzee. Ships from Amsterdam, Hoorn and Enkhuizen waited in its sheltered
          roads for a good wind out into the North Sea.

  - id: u7-l2
    title: Japan, Ceylon and the Cape
    icon: globe
    note: >-
      This lesson covers the VOC's slave trade in Asia and the taking of Khoikhoi land at the Cape. It is told
      plainly, without celebrations.
    sources:
      - title: "Dejima, Nagasaki, the official site"
        url: https://nagasakidejima.jp/en/
      - title: "Matthias van Rossum, 'Vervloekte goudzugt': de VOC, slavenhandel en slavernij in Azië, TSEG, 2015 (in Dutch)"
        url: https://doi.org/10.18352/tseg.90
      - title: "South African History Online, Conquest: 1600s to 1800s"
        url: https://www.sahistory.org.za/article/conquest-1600s-1800s
      - title: "Castle of Good Hope, Cape Town"
        url: https://castleofgoodhope.co.za/
      - title: "UNESCO, Melaka and George Town"
        url: https://whc.unesco.org/en/list/1223/
      - title: "Encyclopaedia Britannica, Ostend Company"
        url: https://www.britannica.com/topic/Ostend-Company
    exercises:
      - type: story
        title: A window on Japan
        body: >-
          In 1641 the shogun moved the Dutch to Dejima, a fan-shaped island built in the bay of Nagasaki, about 120
          metres long. Japan had expelled the Portuguese, and for the next two centuries the Dutch were the only
          Europeans allowed to trade there. Chinese junks still came too. Zoom in to see the island and the ships.
        visual: { kind: photo, photo: dejima-bay }
      - type: hunt
        prompt: Find the two Dutch ships among the Chinese junks.
        photo: dejima-bay
        targets: [[0.68, 0.5, 0.08, 0.22], [0.76, 0.54, 0.11, 0.2]]
        explain: >-
          The two tall ships with the red, white and blue flags, right of centre. In the 1700s only one or two
          Dutch ships a year were allowed to come.
      - type: choice
        prompt: Why did Japan let the Dutch stay when it threw out the Portuguese in 1639?
        visual: { kind: photo, photo: dejima-plan }
        answer: 0
        options:
          - label: The Dutch came to trade, not to spread Christianity
            why: >-
              Right. The shoguns feared Catholic missionaries and Japanese Christians. The Dutch kept their
              religion to themselves, and even fired on Christian rebels at Shimabara in 1638.
          - label: The Dutch had beaten the Japanese in a war
            why: The Dutch never fought Japan. They needed the shogun far more than he needed them.
          - label: The Dutch paid no rent
            why: The Dutch paid a heavy rent for Dejima to its Japanese owners every year.
          - label: Japan wanted Dutch soldiers
            why: Japan wanted silk, sugar, books and news from the Dutch, not soldiers.
      - type: hunt
        prompt: Isaac Titsingh, who ran the post on Dejima, had this plan of the island made. Find the only way off it.
        photo: dejima-plan
        targets: [[0.43, 0.57, 0.1, 0.18]]
        explain: >-
          The little bridge to Nagasaki, guarded at its gate. The Dutch could not cross it without permission, and
          only a few Japanese, such as interpreters and officials, could come over.
      - type: truemyth
        statement: The VOC traded in enslaved people across Asia as well as in spices and silk.
        visual: { kind: photo, photo: arakan }
        answer: true
        explain: >-
          True. This print from 1663 shows the VOC buying people near Pipeli, on the Bay of Bengal. People were
          taken from India, Bali, Sulawesi, Madagascar and many other places. The historian Matthias van Rossum
          estimates that between about 660,000 and 1,135,000 enslaved people were brought to VOC lands in Asia in
          the 1600s and 1700s, as many as or more than the Dutch carried across the Atlantic.
      - type: choice
        prompt: In 1652 Jan van Riebeeck set up a VOC station at the Cape of Good Hope. What was it for?
        visual: { kind: photo, photo: cape-castle }
        answer: 3
        options:
          - label: To mine gold
            why: Gold was found in South Africa only in the 1880s.
          - label: To send settlers inland
            why: The company first wanted a small station, not a colony. Settlers came later.
          - label: To trade in spices
            why: No spices grew at the Cape.
          - label: To grow fresh food for ships on the way to Asia
            why: >-
              Right. Sailors on the long voyage died of scurvy without fresh food. The garden, the fort and later
              this stone Castle of Good Hope, built from 1666 to 1679, served the passing fleets.
      - type: gap
        prompt: The Khoikhoi had grazed their cattle at the Cape for centuries. After a war in 1659, their leaders told Van Riebeeck what they thought, and he wrote it in his journal. Fill the gap.
        quote: It would be of little consequence if you people stayed at the ___, but you come right into the interior and select the best land for yourselves.
        source: The Khoikhoi leaders, as recorded in Jan van Riebeeck's journal, 1660 (quoted in M. Morris, Every Step of the Way, 2004)
        visual: { kind: photo, photo: cape-1795-map }
        options: [fort, coast, harbour, mountain]
        answer: 0
        explain: >-
          The fort. They asked whether they would be allowed to do the same if they went to Holland. Their words
          survive only because the colonists wrote them down. By 1795, as this map shows, the colony reached far
          inland.
      - type: truemyth
        statement: Charles Bell's painting shows Van Riebeeck's arrival at the Cape as it really happened.
        visual: { kind: photo, photo: riebeeck-arrival }
        answer: false
        explain: >-
          A myth. Bell painted it around 1850, almost 200 years later, and imagined the scene: the proud Dutchmen
          in the middle, the Khoikhoi to one side. Paintings like this shaped how later white South Africans told
          the story of their country.
      - type: choice
        prompt: The VOC took Malacca from the Portuguese in 1641. Who built the red town hall, the Stadthuys, that still stands on its main square?
        visual: { kind: photo, photo: malacca }
        answer: 1
        options:
          - label: The Portuguese
            why: The Portuguese fort of A Famosa stood nearby, but the Stadthuys is later.
          - label: The Dutch
            why: >-
              Right, in the 1650s, as the governor's offices. Christ Church beside it was built by the Dutch in 1753.
              Malacca guarded the narrow strait between the Indian Ocean and the South China Sea.
          - label: The British
            why: The British took over Malacca for good only in 1824, and painted the buildings red.
          - label: The sultans of Malacca
            why: The sultans' palace was destroyed when the Portuguese conquered the town in 1511.
      - type: choice
        prompt: In 1722 the emperor gave merchants in the Austrian Netherlands, today's Belgium, their own company to trade with China and India. Why did it close in 1731?
        visual: { kind: photo, photo: ostend-patent }
        answer: 2
        options:
          - label: Its ships were all lost at sea
            why: Its ships made good profits, especially on tea from Canton.
          - label: Nobody in Flanders wanted tea
            why: Tea sold well, much of it smuggled on to Britain.
          - label: The Dutch and British forced the emperor to give it up
            why: >-
              Right. They saw the Ostend Company as a dangerous rival. Emperor Charles VI gave it up in return for
              their support for his daughter Maria Theresa as his heir.
          - label: It was banned by the pope
            why: The pope had nothing to do with it.
      - type: pin
        prompt: The company was named after the Flemish port its ships sailed from. Pin Ostend.
        place: ostend
        okKm: 20
        fullKm: 8
        explain: >-
          Ostend, on the coast of Flanders. Its company kept posts at Banquibazar in Bengal and on the Coromandel
          coast of India.
      - type: cause
        prompt: Link each cause to its effect.
        pairs:
          - [Japan fears Christian missionaries, The Portuguese are thrown out in 1639]
          - [Sailors need fresh food on the long voyage, The VOC sets up a station at the Cape]
          - [Colonists take the best grazing land, The Khoikhoi go to war in 1659]
          - [The Dutch and British see a rival, The Ostend Company is closed]
        explain: >-
          Each post had its own story, but the VOC's aim was always the same: trade on its own terms, by force if
          it had to.

  - id: u7-l3
    title: The West India Company
    icon: coin
    sources:
      - title: "New Netherland Institute, The Peter Schagen letter"
        url: https://www.newnetherlandinstitute.org/history-and-heritage/additional-resources/dutch-treats/peter-schagen-letter
      - title: "Encyclopaedia Britannica, Dutch West India Company"
        url: https://www.britannica.com/topic/Dutch-West-India-Company
      - title: "Encyclopaedia Britannica, Piet Heyn"
        url: https://www.britannica.com/biography/Piet-Heyn
      - title: "Mauritshuis, The Hague"
        url: https://www.mauritshuis.nl/en/
      - title: "Encyclopaedia Britannica, Peter Stuyvesant"
        url: https://www.britannica.com/biography/Peter-Stuyvesant
    exercises:
      - type: story
        title: New Amsterdam
        body: >-
          The West India Company, founded in 1621, had sole rights to Dutch trade with Africa and the Americas. It
          was a weapon in the war with Spain as much as a business. On Manhattan it built New Amsterdam, seen here in
          1660: a fort, a windmill, a canal and a few hundred houses.
        visual: { kind: photo, photo: castello-plan }
      - type: hunt
        prompt: On this plan, north is to the right. Find the wall that kept out attackers from the north, and gave a famous New York street its name.
        photo: castello-plan
        targets: [[0.77, 0.08, 0.06, 0.8]]
        explain: >-
          The wall of wooden stakes across the island, built in 1653. The street that ran beside it is still called
          Wall Street.
      - type: gap
        prompt: In November 1626 a ship from New Netherland reached Amsterdam, and Pieter Schaghen reported the news to the States General. Fill the gap in his letter.
        quote: They have purchased the Island Manhattes from the Indians for the value of ___ guilders.
        source: Pieter Schaghen, letter to the States General, 5 November 1626 (translated by the New Netherland Institute)
        visual: { kind: photo, photo: schaghen-letter }
        options: ['60', '600', '24', '6,000']
        answer: 0
        explain: >-
          Sixty guilders' worth of goods. The letter, in the National Archives in The Hague, is the oldest record of
          the deal. The same ship brought 7,246 beaver skins.
      - type: truemyth
        statement: Manhattan was bought for 24 dollars' worth of beads, and both sides understood it as a sale.
        visual: { kind: photo, photo: schaghen-letter }
        answer: false
        explain: >-
          A myth, twice over. The letter speaks of goods worth 60 guilders and says nothing of beads. The "24
          dollars" is a conversion made in the 1840s. And no record of the Lenape's own view survives: they may well
          have thought they were agreeing to share the land, not giving it up for ever.
      - type: region
        prompt: Like the VOC, the WIC had chambers in different towns, in Amsterdam, Middelburg, Rotterdam, Hoorn and Groningen. Shade the provinces of today they lie in.
        layer: provinces
        answer: [NL-NH, NL-ZE, NL-ZH, NL-GR]
        explain: >-
          North Holland (Amsterdam and Hoorn), Zeeland (Middelburg), South Holland (Rotterdam) and Groningen. The
          Amsterdam chamber was by far the largest.
      - type: choice
        prompt: In 1628 Piet Hein captured the Spanish silver fleet off Cuba, worth about 11.5 million guilders. What did the WIC do with it?
        visual: { kind: photo, photo: silver-fleet }
        answer: 1
        options:
          - label: It gave it all back to buy peace with Spain
            why: The war with Spain went on for twenty more years.
          - label: It paid its shareholders a dividend of 50 per cent, and paid for an attack on Brazil
            why: >-
              Right. The fleet that took Recife and Olinda in 1630 was paid for partly with Spanish silver. Piet Hein
              became a hero, and a song about him is still sung.
          - label: It built the canal ring in Amsterdam
            why: The canal ring was paid for by the town, from 1613.
          - label: It bought Manhattan
            why: Manhattan had been bought two years before, for far less.
      - type: who
        photo: stuyvesant
        clues:
          - I lost my right leg to a cannonball attacking a Spanish fort on Sint Maarten in 1644.
          - From 1647 I ruled New Netherland for the WIC, with a firm hand.
          - I tried to keep Jewish refugees from Brazil out of New Amsterdam, but the company overruled me.
          - In 1664 I surrendered the town to the English without a shot.
        options: [Peter Stuyvesant, Peter Minuit, Piet Hein, Johan Maurits]
        answer: 0
        explain: >-
          Peter Stuyvesant. He stayed on as a farmer on his estate, the Bouwerij, which gave the Bowery its name.
      - type: choice
        prompt: Johan Maurits of Nassau governed Dutch Brazil from 1637 to 1644. Back in The Hague he had this house built, today a famous museum. Which?
        visual: { kind: photo, photo: mauritshuis-1825 }
        answer: 2
        options:
          - label: The Rijksmuseum
            why: The Rijksmuseum is in Amsterdam and was built in the 1880s.
          - label: The Binnenhof
            why: The Binnenhof is the old seat of government next door.
          - label: The Mauritshuis
            why: >-
              Right, built from 1636 to 1641, while he was in Brazil. The museum says he played a key role in the
              slave trade in Dutch Brazil, which increased his wealth.
          - label: The Royal Palace
            why: The palace on the Dam was Amsterdam's town hall, built from 1648.
      - type: choice
        prompt: Frans Post went to Brazil with Johan Maurits. What did he become the first European painter to do?
        visual: { kind: photo, photo: post-pernambuco }
        answer: 0
        options:
          - label: Paint landscapes of the Americas
            why: >-
              Right. He kept painting Brazilian landscapes for the rest of his life in Haarlem, like this one from
              1668. Small figures of enslaved workers and sugar mills appear in many of them.
          - label: Paint in oils
            why: Oil painting had been used in Europe for two centuries.
          - label: Paint a map of the world
            why: Maps were the work of mapmakers like Blaeu.
          - label: Paint a self-portrait
            why: Painters had painted themselves for a long time.
      - type: scrub
        prompt: Drag the slider to a year when the Dutch held both New Amsterdam and Recife.
        map: empire
        start: 1602
        answer: [1630, 1653]
        explain: >-
          From the taking of Recife in 1630 until its loss in 1654. In those years the WIC was at its height, and
          Dutch ships began carrying enslaved Africans to Brazil.
      - type: truemyth
        statement: At the Peace of Breda in 1667, the Dutch handed New York to England in exchange for Suriname.
        visual: { kind: time-map, map: empire, year: 1667 }
        answer: false
        explain: >-
          A myth, or at least too neat. The treaty let each side keep what it had taken in the war: England kept New
          Netherland, taken in 1664, and the Dutch kept Suriname, taken from the English in February 1667. The Dutch
          even took New York back in 1673, then returned it for good in 1674.
      - type: order
        prompt: Put these in order, oldest first.
        items:
          - { label: The WIC is founded, year: 1621, when: '1621' }
          - { label: Manhattan is bought, year: 1626, when: '1626' }
          - { label: Piet Hein takes the silver fleet, year: 1628, when: '1628' }
          - { label: Recife is taken, year: 1630, when: '1630' }
          - { label: Dutch Brazil surrenders, year: 1654, when: '1654' }
          - { label: New Amsterdam becomes New York, year: 1664, when: '1664' }
        explain: In forty years the WIC won and lost an empire in the Americas.

  - id: u7-l4
    title: The Atlantic slave trade
    icon: book
    note: >-
      This lesson is about the slave trade: people taken from Africa and shipped across the Atlantic by Dutch
      merchants. It describes deaths at sea. It is told plainly, without celebrations.
    sources:
      - title: "African Studies Centre Leiden, Dutch involvement in the transatlantic slave trade and abolition"
        url: https://www.ascleiden.nl/content/webdossiers/dutch-involvement-transatlantic-slave-trade-and-abolition
      - title: "Canon van Nederland, Slavernij (in Dutch)"
        url: https://www.canonvannederland.nl/nl/slavernij
      - title: "UNESCO, Forts and Castles of Ghana"
        url: https://whc.unesco.org/en/list/34/
      - title: "Zeeuws Archief, the slave voyages of the MCC ship Eenigheid"
        url: https://eenigheid.slavenhandelmcc.nl/archief-van-de-mcc/?lang=en
      - title: "Leiden Special Collections, A Leiden dissertation of 1742: slavery not against the Bible"
        url: https://leidenspecialcollectionsblog.nl/articles/leiden-dissertation-1742-slavery-not-against-the-bible
      - title: "SlaveVoyages, the Trans-Atlantic Slave Trade Database"
        url: https://www.slavevoyages.org/
    exercises:
      - type: story
        title: Elmina
        body: >-
          In 1637 the WIC captured Elmina Castle on the Gold Coast, today Ghana, from the Portuguese. It was meant
          for trading gold, but it became the centre of the Dutch slave trade. Johannes Vingboons painted it around
          1665, with Fort Nassau on the hill. Dutch ships brought cloth, guns, metal and liquor, and left with
          people.
        visual: { kind: photo, photo: elmina-1665 }
      - type: choice
        prompt: About how many enslaved Africans did Dutch ships carry across the Atlantic?
        visual: { kind: time-map, map: empire, year: 1700 }
        answer: 1
        options:
          - label: About 60,000
            why: Far too few. Dutch ships made well over a thousand slave voyages.
          - label: About 550,000 to 600,000
            why: >-
              Right, some 5 per cent of the whole Atlantic slave trade, which took about 12 million people from
              Africa. Tens of thousands of them died on the voyage.
          - label: About 6 million
            why: That is about half of the whole Atlantic slave trade, by all nations.
          - label: About 12 million
            why: That is about the total carried by all European nations together.
      - type: choice
        prompt: This low doorway in Elmina Castle led from the dungeons to the beach. What is it called today?
        visual: { kind: photo, photo: elmina-gate }
        answer: 3
        options:
          - label: The Water Gate
            why: It did lead to the water, but that is not its name today.
          - label: The Governor's Door
            why: The governor lived in fine rooms upstairs, far from here.
          - label: The Gate of Gold
            why: Gold left the castle another way.
          - label: The Door of No Return
            why: >-
              Right. Captives held in the dark dungeons below were taken through it to the boats and the ships, and
              never came home. Visitors from the African diaspora now come here to remember them.
      - type: who
        photo: capitein
        clues:
          - I was born in West Africa around 1717 and sold into slavery as a boy.
          - A Dutch captain brought me to the Netherlands in 1728, and I studied at Leiden.
          - In 1742 I argued in my dissertation that slavery was not against Christian freedom.
          - The WIC sent me to Elmina as a minister, and I died there in 1747.
        options: [Jacobus Capitein, Anton de Kom, Tula, Johan Maurits]
        answer: 0
        explain: >-
          Jacobus Capitein, the first African to be ordained in the Dutch Reformed Church. His dissertation, printed in
          Latin and Dutch, was welcomed by those who profited from the slave trade. Historians still debate why he,
          once enslaved himself, argued as he did.
      - type: truemyth
        statement: After the WIC lost its monopoly around 1730, most Dutch slave voyages were made by private merchants, many of them from Zeeland.
        visual: { kind: photo, photo: mcc-ships }
        answer: true
        explain: >-
          True. The largest was the Middelburgsche Commercie Compagnie of Middelburg, whose ships are painted here.
          From 1730 to 1803 it bought more than 31,000 enslaved Africans to sell in the Americas. Its archive is so
          complete that UNESCO added it to the Memory of the World in 2011.
      - type: pin
        prompt: Pin Middelburg, the home of the Middelburgsche Commercie Compagnie.
        place: middelburg
        okKm: 20
        fullKm: 8
        explain: >-
          Middelburg, on Walcheren in Zeeland. Its ships sailed from nearby Vlissingen. Zeeland's merchants made a
          large share of all Dutch slave voyages.
      - type: choice
        prompt: On 1 January 1738 the WIC slave ship Leusden ran aground in the mouth of the Marowijne river in Suriname. What did the crew do?
        answer: 2
        options:
          - label: They freed the captives to swim ashore
            why: Sadly not.
          - label: They stayed with the ship until help came
            why: The crew left the ship.
          - label: They nailed the hatches shut and saved themselves, and a chest of gold
            why: >-
              Right. About 664 people locked below deck drowned or suffocated, the worst disaster in the Dutch slave
              trade. The captain said he feared a revolt, and he was cleared. The survivors were sold.
          - label: They sailed back to Africa
            why: The ship was wrecked and never sailed again.
      - type: odd
        prompt: Three of these forts belonged to the WIC. Which is the odd one out, and why?
        items:
          - { label: Elmina Castle, photo: elmina-castle }
          - { label: Fort Amsterdam, Curaçao, photo: fort-amsterdam-curacao }
          - { label: Castle of Good Hope, photo: cape-castle }
          - { label: Fort Oranje, Sint Eustatius, photo: first-salute }
        answer: 2
        reasons:
          - It belonged to the VOC, not the WIC
          - It is the only one in Africa
          - It was built of wood
        reason: 0
        explain: >-
          The Castle of Good Hope was the VOC's, on the route to Asia. Elmina is in Africa too, so that can't be the
          reason. All four were built of stone.
      - type: cause
        prompt: Link each cause to its effect.
        pairs:
          - [Sugar plantations in the Americas need workers, Ships carry enslaved Africans across the Atlantic]
          - [The WIC loses its monopoly around 1730, Private firms in Zeeland take over the trade]
          - [Britain bans the slave trade in 1807 and presses others, The Dutch ban it in 1814]
        explain: >-
          The trade was driven by money: cheap labour for plantations, and profit for merchants and shareholders in
          the Republic.
      - type: order
        prompt: Put these in order, oldest first.
        items:
          - { label: The WIC takes Elmina, year: 1637, when: '1637' }
          - { label: The Leusden disaster, year: 1738, when: '1738' }
          - { label: Capitein defends his dissertation, year: 1742, when: '1742' }
          - { label: The Dutch ban the slave trade, year: 1814, when: '1814' }
        explain: The Dutch slave trade lasted nearly two centuries. Slavery itself lasted another fifty years.

  - id: u7-l5
    title: Suriname, Curaçao and resistance
    icon: quill
    note: >-
      This lesson is about plantation slavery in Suriname and the Caribbean, and the people who resisted it. It is
      told plainly, without celebrations.
    sources:
      - title: "Rijksmuseum, Plantation in Surinam, Dirk Valkenburg, 1707"
        url: https://www.rijksmuseum.nl/en/collection/SK-A-4075
      - title: "Canon van Nederland, Slavernij (in Dutch)"
        url: https://www.canonvannederland.nl/nl/slavernij
      - title: "Gert Oostindie (ed.), Curaçao in the Age of Revolutions, 1795 to 1800 (KITLV Press, 2011)"
        url: https://library.oapen.org/handle/20.500.12657/34536
      - title: "US Naval History and Heritage Command (holds Phillips Melville's painting of the first salute, NH 85510-KN)"
        url: https://www.history.navy.mil/
      - title: "Encyclopaedia Britannica, Suriname: history"
        url: https://www.britannica.com/place/Suriname/History
    exercises:
      - type: story
        title: A plantation colony
        body: >-
          From 1667 Suriname was a Dutch colony of plantations along its rivers, growing sugar, then coffee, cacao
          and cotton. Almost all the work was done by enslaved Africans and their children. Dirk Valkenburg painted
          this plantation in 1707, for its Amsterdam owner.
        visual: { kind: photo, photo: valkenburg-plantation }
      - type: hunt
        prompt: In the front of the painting are the houses of the enslaved workers. Find the planter's house, far behind them.
        photo: valkenburg-plantation
        targets: [[0.59, 0.69, 0.14, 0.08]]
        explain: >-
          The white house with three gables, behind the trees. On most plantations the owner lived in Amsterdam, and
          a manager ran the place for him.
      - type: region
        prompt: The fleet that took Suriname from the English in 1667 was sent and paid for by one province, which at first ran the colony. Shade it.
        layer: provinces
        answer: [NL-ZE]
        explain: >-
          Zeeland. Its fleet, under Abraham Crijnssen, took the English fort at Paramaribo in February 1667. Later
          the colony was run by a society in which Amsterdam and the WIC had shares.
      - type: choice
        prompt: Some enslaved people escaped into the rainforest and built free villages there. What happened in 1760?
        visual: { kind: time-map, map: empire, year: 1760 }
        answer: 1
        options:
          - label: The colony's soldiers destroyed them all
            why: The soldiers tried for decades, but never won.
          - label: The colony made peace with the Ndyuka and recognised their freedom
            why: >-
              Right. On 10 October 1760 the colony signed a treaty with the Ndyuka, and in 1762 with the Saamaka. The
              Maroons kept their land, but had to send back people who escaped later. Suriname marks 10 October as the
              Day of the Maroons.
          - label: They all went back to the plantations
            why: They stayed free. Their descendants still live in Suriname's interior.
          - label: They sailed back to Africa
            why: They built a new life in Suriname, with languages and customs of their own.
      - type: choice
        prompt: Tula led a great revolt on Curaçao in August 1795. What gave him hope that enslaved people could be freed?
        visual: { kind: photo, photo: tula-monument }
        answer: 0
        options:
          - label: Slavery had been ended in Haiti, and France now ruled over the Netherlands
            why: >-
              Right. The revolution in Saint-Domingue, today Haiti, had freed its enslaved people, and French
              armies had made the Netherlands a sister republic. Why not freedom on Curaçao too? The revolt was
              crushed and Tula was tortured to death on 3 October 1795.
          - label: The king of the Netherlands had promised freedom
            why: There was no king in 1795, and no promise.
          - label: The WIC had gone bankrupt
            why: The WIC had been wound up in 1791, but its end freed no one.
          - label: Spain had invaded the island
            why: Spain had lost Curaçao to the Dutch in 1634.
      - type: truemyth
        statement: Enslaved people in Suriname and on the islands put up with slavery and seldom resisted.
        visual: { kind: photo, photo: kwakoe }
        answer: false
        explain: >-
          A myth. People resisted all the time: by working slowly, by escaping, by keeping their own languages,
          songs and beliefs, and by open revolt, as on Curaçao in 1795. The Maroons forced the colony to make peace.
          This statue, Kwakoe, stands for the freedom they fought for.
      - type: choice
        prompt: In November 1776 the guns of Fort Oranje on Sint Eustatius saluted a ship. What was special about its flag?
        visual: { kind: photo, photo: first-salute }
        answer: 3
        options:
          - label: It was a pirate flag
            why: It was a warship, the Andrew Doria.
          - label: It was the flag of Spain
            why: Spain's flag was well known. This one was new.
          - label: It was the flag of the VOC
            why: VOC ships did not sail to the Caribbean.
          - label: It belonged to the rebel American colonies
            why: >-
              Right, a few months after they declared independence. Statia sold the rebels guns and gunpowder, and
              Britain was furious. In 1781 a British fleet captured the island and plundered it.
      - type: match
        prompt: Match each place to its part in the Dutch Atlantic.
        pairs:
          - [Suriname, Plantations of sugar and coffee]
          - [Curaçao, A market selling enslaved people on to Spanish America]
          - [Sint Eustatius, 'A free port, the "Golden Rock"']
          - [Elmina, The main Dutch fort on the Gold Coast]
      - type: choice
        prompt: Drag the line to wipe from 1641 to 1667. Two Dutch colonies in the Americas are gone, and a new one has appeared. Which is new?
        visual: { kind: compare, map: empire, years: [1641, 1667] }
        answer: 0
        options:
          - label: Suriname
            why: >-
              Right. Zeeland's ships took it from the English in 1667, the same year the Dutch gave up their claim to
              New Netherland. It stayed Dutch until 1975.
          - label: Curaçao
            why: Curaçao was Dutch from 1634, on both maps.
          - label: Brazil
            why: Dutch Brazil was lost in 1654.
          - label: New Netherland
            why: New Amsterdam became New York in 1664.
      - type: cause
        prompt: Link each cause to its effect.
        pairs:
          - [People escape from the plantations, Maroon villages grow in the rainforest]
          - [The Maroons cannot be beaten, The colony makes peace treaties in 1760 and 1762]
          - [Haiti's enslaved people win their freedom, Tula leads a revolt on Curaçao in 1795]
          - [Statia trades with the American rebels, Britain captures the island in 1781]
        explain: >-
          Slavery was never accepted by the enslaved. Their resistance shaped the colonies, and is remembered today.

  - id: u7-l6
    title: "Keti Koti: the end of slavery"
    icon: chain
    note: >-
      This lesson is about the end of slavery and how it is remembered. It is told plainly, without celebrations.
    sources:
      - title: "CBS, On 1 July 1863, 47 thousand slaves freed in Suriname and the Antilles (in Dutch)"
        url: https://www.cbs.nl/nl-nl/achtergrond/2013/27/op-1-juli-1863-47-duizend-slaven-vrijgemaakt-in-suriname-en-op-de-antillen
      - title: "Canon van Nederland, Anton de Kom (in Dutch)"
        url: https://www.canonvannederland.nl/nl/antondekom
      - title: "NL Times, Full English text of Prime Minister Rutte's speech, 19 December 2022"
        url: https://nltimes.nl/2022/12/19/video-full-english-text-prime-minister-ruttes-speech-apologies-slavery
      - title: "NPR, The Dutch leader apologizes for the Netherlands' role in slave trade, 20 December 2022"
        url: https://www.npr.org/2022/12/20/1144311201/the-dutch-leader-apologizes-for-the-netherlands-role-in-slave-trade
      - title: "NL Times, Full English text of King Willem-Alexander's speech, 1 July 2023"
        url: https://nltimes.nl/node/66893
      - title: "NiNsee, National Institute for the Study of Dutch Slavery and its Legacy"
        url: https://www.ninsee.nl/
    exercises:
      - type: story
        title: Chains broken
        body: >-
          On 1 July 1863 slavery was abolished in Suriname and on the Dutch Caribbean islands, and about 46,500
          people were declared free. The day is called Keti Koti, "the chains are broken" in Sranan Tongo. Since
          2002 it has been remembered at this monument in the Oosterpark in Amsterdam, by Erwin de Vries.
        visual: { kind: photo, photo: slavery-monument }
      - type: truemyth
        statement: On 1 July 1863 everyone freed in Suriname could leave the plantations at once.
        visual: { kind: photo, photo: abolition-law }
        answer: false
        explain: >-
          A myth. The law, published in the state newspaper in August 1862, made the freed people of Suriname aged
          15 to 60 work on for ten more years under state supervision, for wages. Only in 1873 could they leave, and
          many did.
      - type: choice
        prompt: This cheque from 1863, kept in the museum on Sint Eustatius, paid out 3,200 guilders. Who was paid?
        visual: { kind: photo, photo: compensation-cheque }
        answer: 1
        options:
          - label: A freed family, to start a new life
            why: The freed people received nothing at all.
          - label: A slave owner, for the people he had to set free
            why: >-
              Right. Owners received 300 guilders for each enslaved person in Suriname and 200 on the islands, almost
              12 million guilders in all, about a tenth of the state's spending in 1863.
          - label: A plantation, to buy machines
            why: The money went to owners, not plantations.
          - label: A church, to build schools
            why: Churches received no share of it.
      - type: choice
        prompt: This statue in Paramaribo was unveiled in 1963, a hundred years after abolition. It is called Kwakoe. What does the name mean?
        visual: { kind: photo, photo: kwakoe }
        answer: 2
        options:
          - label: Freedom
            why: Close in spirit, but the name means something more everyday.
          - label: Chains
            why: The statue breaks chains, but its name means something else.
          - label: Wednesday
            why: >-
              Right. In the Maroons' Kromanti language Kwakoe is the name for Wednesday, and 1 July 1863 was a
              Wednesday. The sculptor was Jozef Klas.
          - label: Brother
            why: The name means something else.
      - type: who
        photo: de-kom-statue
        clues:
          - I was born in Paramaribo in 1898. My father had been born into slavery.
          - In 1933 the colonial government arrested me and sent me back to the Netherlands without a trial.
          - In 1934 I wrote a book about Suriname's history in the voice of its enslaved people.
          - I joined the resistance in the Second World War and died in a German camp in 1945.
        options: [Anton de Kom, Jacobus Capitein, Tula, Erwin de Vries]
        answer: 0
        explain: >-
          Anton de Kom. His book, Wij slaven van Suriname (We Slaves of Suriname), was censored when it first came
          out. The university of Suriname is named after him, and in 2020 he was added to the Canon of the
          Netherlands, the list of subjects every Dutch pupil learns.
      - type: voices
        prompt: Read what the prime minister said in 2022, and what an activist said afterwards. What did the activist miss?
        voices:
          - who: Mark Rutte, prime minister
            when: speech at the National Archives, The Hague, 19 December 2022
            text: Today, on behalf of the Dutch government, I apologise for the past actions of the Dutch State to enslaved people in the past, everywhere in the world, who suffered as a consequence of those actions, as well as to their daughters and sons.
          - who: Mitchell Esajas, director of The Black Archives
            when: speaking to the Associated Press, 19 December 2022
            text: Reparation wasn't even mentioned. So, beautiful words, but it's not clear what the next concrete steps will be.
        options:
          - Concrete steps, such as reparation
          - An apology to the descendants
          - The word 'apologise'
          - Any mention of the Dutch State
        answer: 0
        explain: >-
          Rutte apologised to the enslaved and their descendants, but Esajas and others wanted deeds to follow, and
          had wanted the apology on 1 July. The government set up a fund for awareness and education, but ruled out
          paying reparations.
      - type: gap
        prompt: On Keti Koti 2023, 160 years after abolition, King Willem-Alexander spoke at the monument in the Oosterpark. Fill the gap.
        quote: Today, on this day of remembrance, I ask ___ for the clear failure to act in the face of this crime against humanity.
        source: King Willem-Alexander, speech at the National Slavery Monument, Amsterdam, 1 July 2023 (English text published by NL Times)
        visual: { kind: photo, photo: slavery-monument }
        options: [forgiveness, permission, patience, payment]
        answer: 0
        explain: >-
          Forgiveness. He spoke for himself and his family, and said the stadtholders and kings of the House of Orange
          had done nothing to stop slavery.
      - type: cause
        prompt: Link each cause to its effect.
        pairs:
          - [Britain presses the Dutch to end the trade, The slave trade is banned in 1814]
          - [Owners demand payment for their losses, The state pays them almost 12 million guilders]
          - [State supervision ends in 1873, Many freed people leave the plantations]
          - [Plantations still want cheap labour, Contract workers are brought from India and Java]
        explain: >-
          Freedom came slowly, and on the owners' terms. From 1873 ships brought contract workers from British India,
          and from 1890 from Java, whose descendants are part of Suriname today.
      - type: order
        prompt: Put these in order, oldest first.
        items:
          - { label: The Dutch slave trade is banned, year: 1814, when: '1814' }
          - { label: Slavery ends in the Dutch East Indies, year: 1860, when: '1860' }
          - { label: Keti Koti in Suriname and the islands, year: 1863, when: 1 July 1863 }
          - { label: State supervision ends in Suriname, year: 1873, when: '1873' }
          - { label: The slavery monument is unveiled, year: 2002, when: 1 July 2002 }
          - { label: The king asks forgiveness, year: 2023, when: 1 July 2023 }
        explain: Abolition took decades, and remembering it in the Netherlands took more than a century longer.
