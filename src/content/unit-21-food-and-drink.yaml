        prompt: Aelbert Cuyp painted this young woman with a pot of them in about 1652. Listen to their name. When do Dutch families eat them?
        visual: { kind: sound, sound: nl-oliebol, photo: cuyp-oliebollen }
        answer: 2
        options:
          - label: On Sinterklaas, 5 December
            why: Sinterklaas brings speculaas and chocolate letters. Oliebollen are for the last night of the year.
          - label: At Easter
            why: Oliebollen are for the last night of the year.
          - label: On New Year's Eve
            why: >-
              Right. Oliebollen, oil balls, are balls of yeast dough with currants and raisins, fried and dusted with
              icing sugar. Stalls sell them all winter, and families fry their own on 31 December.
          - label: On King's Day, 27 April
            why: King's Day is for orange cakes and flea markets. Oliebollen are for the last night of the year.
