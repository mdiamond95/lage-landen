        title: Potatoes for everyone
        body: >-
          Potatoes came late to the Low Countries: they were grown in the south only from around the 1730s. A hundred
          years later they fed the poor, as in Van Gogh's Potato Eaters of 1885, and they still sit on most Dutch and
          Belgian plates, mashed into stamppot or fried as frites.
        visual: { kind: photo, photo: potato-eaters }
      - type: truemyth
        statement: The stew the Spanish soldiers left behind at Leiden in 1574 was a mash of potatoes, carrots and onions.
        visual: { kind: photo, photo: leiden-relief }
        answer: false
        explain: >-
          Myth. Leiden still eats hutspot every 3 October, the day the siege ended, along with the herring and white
          bread the relief ships brought, painted here. But in 1574 the pot would have held parsnips, not potatoes,
          which were not yet grown in Holland.
