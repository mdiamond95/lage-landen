        prompt: Chicory roots kept in the dark sprout these pale leaves, found near Brussels in the 1850s. What are they called in Flemish?
        visual: { kind: photo, photo: witloof }
        answer: 2
        options:
          - label: Spruitjes
            why: Spruitjes are Brussels sprouts. These are witloof, white leaf.
          - label: Andijvie
            why: Andijvie is curly endive, grown in the light. These are witloof, white leaf.
          - label: Witloof
            why: >-
              Right. Witloof means white leaf; in French it is chicon. Kept in the dark, the leaves cannot turn green.
              It is eaten raw, or baked with ham and cheese.
          - label: Prei
            why: Prei is leek. These are witloof, white leaf.
